<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دردشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap-theme.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--primary:#438ac7;--primary-dark:#36719f;--bg:#e9e9e9;--panel:#FFFFFF;--border:#d9d9d9;--text:#222222;--text-dim:#767676;--msg-bg:#f0f0f5;--msg-border:#d3d3d3;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Cairo','Tajawal',Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; font-size:13px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#c3c3c3; border-radius:0;}
::-webkit-scrollbar-track{background:#f1f1f1;}
.btn-primary, .label-primary, .bg-primary{background-color:var(--primary); border-color:var(--primary);}
.btn-primary:hover, .btn-primary:focus{background-color:var(--primary-dark); border-color:var(--primary-dark);}
.label{border-radius:2px; font-weight:600;}
a{cursor:pointer;}
.corner{border-radius:3px;}
.border{border:1px solid var(--border);}
.nosel{-webkit-user-select:none; user-select:none;}
.hand{cursor:pointer;}
#loginScreen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#33373d; padding:16px; z-index:50;}
.loginCard{width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border); border-radius:4px; box-shadow:0 2px 12px rgba(0,0,0,.35); max-height:92vh; overflow-y:auto;}
.loginCardHead{background:var(--primary); color:#fff; padding:10px 14px; font-weight:700; font-size:15px; text-align:center; border-radius:3px 3px 0 0;}
.loginCardBody{padding:16px;}
.loginLogo{width:52px; height:52px; border-radius:4px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; margin:0 auto 10px; overflow:hidden;}
.loginLogo img{width:100%; height:100%; object-fit:cover;}
.loginSub{text-align:center; color:var(--text-dim); font-size:12px; margin-bottom:14px;}
.offlineBanner{background:#f2dede; color:#a94442; border:1px solid #ebccd1; font-size:12px; font-weight:700; text-align:center; padding:6px; border-radius:3px; margin-bottom:12px;}
.tabRow{display:flex; border-bottom:2px solid var(--border); margin-bottom:14px;}
.tabBtn{flex:1; padding:8px 0; font-weight:700; font-size:13px; color:var(--text-dim); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer;}
.tabBtn.active{color:var(--primary); border-color:var(--primary);}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:3px; font-weight:700;}
.field input, .field select, .field textarea{width:100%; padding:6px 8px; border:1px solid #ccc; border-radius:3px; font-size:13px; background:#fff; outline:none;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field.inline{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.field.inline label{margin:0;}
.primaryBtn{width:100%; padding:8px 0; background:var(--primary); color:#fff; border:1px solid var(--primary); border-radius:3px; font-weight:700; font-size:13px; margin-top:4px; cursor:pointer;}
.primaryBtn:hover{background:var(--primary-dark);}
.primaryBtn:disabled{opacity:.5; cursor:not-allowed;}
.ghostBtn{width:100%; padding:8px 0; margin-top:6px; border-radius:3px; font-weight:700; font-size:12px; color:var(--primary); border:1px solid var(--primary); background:#fff; cursor:pointer;}
.loginMsg{font-size:12px; text-align:center; margin-top:8px; min-height:16px; color:#a94442; font-weight:700;}
.switchWrap{position:relative; width:38px; height:20px; flex-shrink:0;}
.switchWrap input{opacity:0; width:0; height:0;}
.switchTrack{position:absolute; inset:0; background:#ccc; border-radius:2px; transition:.15s; cursor:pointer;}
.switchTrack:before{content:""; position:absolute; width:16px; height:16px; right:2px; top:2px; background:#fff; transition:.15s;}
.switchWrap input:checked + .switchTrack{background:var(--primary);}
.switchWrap input:checked + .switchTrack:before{transform:translateX(-18px);}
#app{display:none; height:100vh; width:100vw; flex-direction:column;}
#app.show{display:flex;}
.topBar{background:var(--primary); color:#fff; padding:6px 12px; display:flex; align-items:center; gap:10px; flex-shrink:0;}
.topBar b{font-size:14px;}
.topBar .fa{cursor:pointer; padding:6px; font-size:15px;}
.mainRow{flex:1; display:flex; min-height:0;}
.sidebar{width:290px; min-width:250px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column;}
.sidebarHead{padding:8px 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); background:#f7f7f7;}
.avatar{width:34px; height:34px; border-radius:3px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; font-weight:800; font-size:13px; flex-shrink:0; position:relative;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.verifiedBadge{position:absolute; bottom:-2px; left:-2px; background:#3c763d; color:#fff; width:13px; height:13px; border-radius:50%; font-size:8px; display:flex; align-items:center; justify-content:center; border:1px solid #fff;}
.meName{font-weight:700; font-size:12.5px;}
.meRank{font-size:10.5px; color:var(--text-dim);}
.iconBtn{width:28px; height:28px; border-radius:3px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14px; cursor:pointer; background:none; border:none;}
.iconBtn:hover{background:#eee; color:var(--text);}
.tabs2{display:flex; border-bottom:1px solid var(--border); background:#f7f7f7;}
.tabs2 button{flex:1; padding:8px 4px; font-size:10.5px; font-weight:700; color:var(--text-dim); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;}
.tabs2 button.active{color:var(--primary); border-color:var(--primary); background:#fff;}
.tabs2 .badge{background:var(--primary);}
.listScroll{flex:1; overflow-y:auto; background:#fff;}
.roomItem, .userItem{padding:7px 10px; display:flex; align-items:center; gap:8px; cursor:pointer; border-bottom:1px solid #eee;}
.roomItem:hover, .userItem:hover{background:#f5f5f5;}
.roomItem.active{background:#eaf2fa; border-right:3px solid var(--primary);}
.roomIcon{width:32px; height:32px; border-radius:3px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; overflow:hidden; font-size:12px;}
.roomIcon img{width:100%; height:100%; object-fit:cover;}
.itemTitle{font-weight:700; font-size:12.5px;}
.itemSub{font-size:10.5px; color:var(--text-dim);}
.dot{width:7px; height:7px; border-radius:50%; background:#5cb85c; flex-shrink:0;}
.lockIcon{font-size:10px; color:var(--text-dim);}
.newRoomBtn{margin:8px; padding:7px; border-radius:3px; background:#5cb85c; color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; border:1px solid #4cae4c;}
.newRoomBtn:hover{background:#449d44;}
.badgeBc{background:#f0ad4e; color:#fff; font-size:9px; padding:1px 5px; border-radius:2px; margin-left:4px;}
.chatArea{flex:1; display:flex; flex-direction:column; background:#f5f5f5; position:relative; min-width:0;}
.bannerBar{background:#f0ad4e; color:#fff; padding:5px 12px; font-size:11.5px; font-weight:700; text-align:center;}
.chatHead{padding:7px 12px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;}
.chatHeadInfo{flex:1; min-width:0;}
.chatHeadTitle{font-weight:700; font-size:13.5px;}
.chatHeadSub{font-size:10.5px; color:var(--text-dim);}
.emptyState{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-dim); gap:8px;}
.emptyState .bigIcon{font-size:40px; opacity:.4;}
.micRow{display:flex; gap:6px; padding:8px 10px; background:#33373d; border-bottom:1px solid var(--border); overflow-x:auto;}
.micSeat{width:48px; flex-shrink:0; text-align:center;}
.micSeatCircle{width:40px; height:40px; border-radius:50%; background:#4c6a8c; border:3px solid #989594; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; margin:0 auto 2px;}
.micSeatCircle.taken{border-color:#58c827;}
.micSeatCircle.speaking{border-color:#58c827; box-shadow:0 0 0 2px rgba(88,200,39,.4);}
.micSeatLabel{font-size:9px; color:#ccc;}
.messages{flex:1; overflow-y:auto; padding:6px 10px; display:flex; flex-direction:column; gap:1px;}
.msgRow{display:flex; gap:6px; background:var(--msg-bg); border:1px solid var(--msg-border); margin-top:-1px; padding:4px 6px; align-items:flex-start;}
.msgAvatar{width:24px; height:24px; border-radius:3px; background:var(--primary); color:#fff; font-weight:800; font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; overflow:hidden;}
.msgAvatar img{width:100%; height:100%; object-fit:cover;}
.bubble{flex:1; min-width:0; font-size:12.5px; line-height:1.6; word-break:break-word;}
.bubbleName{font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; gap:3px; margin-left:6px;}
.bubbleTime{font-size:9.5px; color:var(--text-dim); float:left; margin-top:2px;}
.bubbleGiftIcon{width:14px; height:14px; border-radius:2px;}
.flagIcon{width:15px; height:11px; border-radius:1px; object-fit:cover; vertical-align:middle; margin:0 2px;}
.sysMsg{align-self:center; font-size:11px; color:var(--text-dim); background:#fcf8e3; border:1px solid #faebcc; padding:3px 10px; border-radius:2px; margin:3px 0;}
.msgActions{display:inline-flex; gap:6px; margin-right:6px;}
.msgActions button{font-size:10px; color:#c9302c; font-weight:700; background:none; border:none; cursor:pointer;}
.composer{padding:6px 8px; background:var(--panel); border-top:1px solid var(--border); display:flex; align-items:flex-end; gap:5px; position:relative;}
.composer textarea{flex:1; border:1px solid #ccc; border-radius:3px; padding:6px 9px; font-size:13px; resize:none; max-height:90px; outline:none; background:#fff;}
.composer textarea:focus{border-color:var(--primary);}
.sendBtn{padding:0 14px; height:32px; border-radius:3px; background:var(--primary); color:#fff; border:1px solid var(--primary); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; cursor:pointer; font-weight:700;}
.sendBtn:hover{background:var(--primary-dark);}
.emojiBtn{width:32px; height:32px; border-radius:3px; font-size:15px; flex-shrink:0; color:var(--text-dim); background:#f5f5f5; border:1px solid #ccc; cursor:pointer;}
.pickerPanel{position:absolute; bottom:44px; left:8px; background:var(--panel); border:1px solid var(--border); border-radius:3px; padding:8px; box-shadow:0 2px 10px rgba(0,0,0,.2); display:none; width:250px; max-height:200px; overflow-y:auto; z-index:20;}
.pickerPanel.show{display:block;}
.pickerGrid{display:flex; flex-wrap:wrap; gap:5px;}
.pickerGrid img{width:32px; height:32px; border-radius:2px; cursor:pointer; object-fit:cover; background:#f5f5f5; border:1px solid #eee;}
.pickerGrid img:hover{outline:2px solid var(--primary);}
.pickerTabs{display:flex; gap:4px; margin-bottom:6px;}
.pickerTabs button{font-size:10.5px; padding:3px 8px; border-radius:2px; background:#f5f5f5; color:var(--text-dim); font-weight:700; border:1px solid #ddd; cursor:pointer;}
.pickerTabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.wallWrap{padding:8px;}
.wallComposer{background:var(--panel); border:1px solid var(--border); border-radius:3px; padding:8px; margin-bottom:10px;}
.wallComposer textarea{width:100%; border:1px solid #ccc; border-radius:3px; padding:6px; resize:none; font-size:12.5px; outline:none; min-height:44px; font-family:inherit;}
.wallPost{background:var(--panel); border:1px solid var(--border); border-radius:3px; margin-bottom:8px;}
.wallPostHead{display:flex; align-items:center; gap:8px; padding:7px 8px; background:#f7f7f7; border-bottom:1px solid var(--border);}
.wallPostName{font-weight:800; font-size:12px;}
.wallPostTime{font-size:10px; color:var(--text-dim);}
.wallPostBody{font-size:12.5px; line-height:1.6; padding:8px;}
.wallActions{display:flex; gap:14px; border-top:1px solid #eee; padding:6px 8px;}
.wallActions button{font-size:11px; color:var(--text-dim); font-weight:700; display:flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer;}
.wallActions button.liked{color:#c9302c;}
.wallComments{padding:0 8px 8px; display:none;}
.wallComments.show{display:block;}
.wallComment{font-size:11.5px; padding:4px 0; border-top:1px solid #f5f5f5;}
.wallComment b{color:var(--primary);}
.wallCommentInput{display:flex; gap:5px; margin-top:5px;}
.wallCommentInput input{flex:1; padding:5px 8px; border:1px solid #ccc; border-radius:2px; font-size:11.5px;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:60; padding:14px;}
.overlay.show{display:flex;}
.modal{background:var(--panel); border-radius:4px; width:100%; max-width:400px; max-height:88vh; overflow-y:auto; padding:0; box-shadow:0 5px 25px rgba(0,0,0,.4);}
.modal.wide{max-width:800px;}
.modalHead{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--primary); color:#fff; border-radius:3px 3px 0 0;}
.modalTitle{font-weight:700; font-size:14px; flex:1;}
.closeX{width:26px; height:26px; border-radius:2px; color:#fff; background:none; border:none; font-size:15px; cursor:pointer;}
.closeX:hover{background:rgba(255,255,255,.2);}
.modal > .field, .modal > .sectionLabel, .modal > .adminTabs, .modal > .adminSection, .modal > .primaryBtn, .modal > .ghostBtn{margin-left:14px; margin-right:14px;}
.modal > .field:first-of-type{margin-top:14px;}
.modal > .primaryBtn, .modal > .ghostBtn{width:calc(100% - 28px); margin-top:8px; margin-bottom:8px;}
.modal.wide > *{margin-left:16px; margin-right:16px;}
.swatchRow{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px;}
.swatch{width:22px; height:22px; border-radius:2px; border:2px solid transparent; cursor:pointer;}
.swatch.sel{border-color:#333;}
.sectionLabel{font-weight:800; font-size:12px; margin:14px 0 6px; color:var(--primary); text-transform:uppercase;}
.adminTabs{display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; margin-top:14px;}
.adminTabs button{padding:5px 11px; border-radius:2px; font-size:11px; font-weight:700; background:#f5f5f5; color:var(--text-dim); border:1px solid #ddd; cursor:pointer;}
.adminTabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.adminSection{display:none;}
.adminSection.active{display:block;}
.tableRow{display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid #eee; font-size:11.5px; flex-wrap:wrap;}
.tableRow .col{flex:1; min-width:80px;}
.tinyBtn{padding:3px 8px; border-radius:2px; font-size:10.5px; font-weight:700; background:#f5f5f5; color:var(--text); border:1px solid #ccc; cursor:pointer;}
.tinyBtn.danger{background:#f2dede; color:#a94442; border-color:#ebccd1;}
.tinyBtn.primary{background:var(--primary); color:#fff; border-color:var(--primary);}
.permGrid{display:flex; flex-wrap:wrap;}
.permGrid label{display:flex; align-items:center; gap:3px; font-size:10.5px; margin:2px 7px 2px 0;}
.assetRow{display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid #eee;}
.assetRow img{width:26px; height:26px; border-radius:2px; object-fit:cover; background:#f5f5f5;}
#toastWrap{position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:6px;}
.toast{background:#333; color:#fff; padding:8px 16px; border-radius:2px; font-size:12px; font-weight:600; box-shadow:0 3px 10px rgba(0,0,0,.3);}
@media (max-width:820px){.sidebar{position:fixed; inset:0; top:34px; z-index:40; width:100%;}.sidebar.hideOnMobile{display:none;}.chatArea{position:fixed; inset:0; top:34px; z-index:41; display:none;}.chatArea.showOnMobile{display:flex;}.backBtn{display:flex !important;}}
.backBtn{display:none;}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="loginCard">
    <div class="loginCardHead" id="siteTitleText"><i class="fa fa-comments"></i> دردشة</div>
    <div class="loginCardBody">
      <div id="offlineNotice" class="offlineBanner" style="display:none;"><i class="fa fa-lock"></i> الدردشة مغلقة مؤقتًا من قبل الإدارة</div>
      <div class="loginLogo" id="siteLogoWrap">د</div>
      <div class="loginSub">تواصل فوري بالعربية</div>
      <div class="tabRow">
        <button class="tabBtn active" id="tabLoginBtn" onclick="switchAuthTab('login')"><i class="fa fa-sign-in"></i> دخول</button>
        <button class="tabBtn" id="tabRegisterBtn" onclick="switchAuthTab('register')"><i class="fa fa-user-plus"></i> تسجيل عضوية</button>
      </div>
      <div id="loginForm">
        <div class="field"><label>اسم المستخدم</label><input type="text" id="loginUser" maxlength="30"></div>
        <div class="field"><label>كلمة السر</label><input type="password" id="loginPass" maxlength="40"></div>
        <button class="primaryBtn" onclick="doLogin()"><i class="fa fa-sign-in"></i> دخول</button>
        <button class="ghostBtn" id="guestBtn" onclick="doGuestLogin()"><i class="fa fa-user-secret"></i> الدخول كزائر</button>
      </div>
      <div id="registerForm" style="display:none;">
        <div class="field"><label>اسم المستخدم</label><input type="text" id="regUser" maxlength="30" placeholder="بدون رموز خاصة"></div>
        <div class="field"><label>كلمة السر</label><input type="password" id="regPass" maxlength="40" placeholder="4 أحرف على الأقل"></div>
        <button class="primaryBtn" id="regSubmitBtn" onclick="doRegister()"><i class="fa fa-check"></i> إنشاء الحساب</button>
      </div>
      <div class="loginMsg" id="loginMsg"></div>
    </div>
  </div>
</div>
<div id="app">
  <div class="topBar">
    <i class="fa fa-comments"></i> <b id="appTitleText">دردشة</b>
    <div style="flex:1;"></div>
    <i class="fa fa-cog" title="بروفايلي" onclick="openProfileModal()"></i>
    <i class="fa fa-wrench" id="adminEntryBtn" title="لوحة التحكم" style="display:none;" onclick="openAdminModal()"></i>
    <i class="fa fa-sign-out" title="خروج" onclick="doLogout()"></i>
  </div>
  <div class="mainRow">
  <div class="sidebar" id="sidebarEl">
    <div class="sidebarHead">
      <div class="avatar" id="meAvatar">?
        <span class="verifiedBadge" id="meVerifiedBadge" style="display:none;">✓</span>
      </div>
      <div style="flex:1;">
        <div class="meName" id="meName">-</div>
        <div class="meRank" id="meRank">عضو</div>
      </div>
    </div>
    <div class="tabs2">
      <button class="active" id="tabRoomsBtn" onclick="switchSideTab('rooms')"><i class="fa fa-users"></i> الغرف</button>
      <button id="tabUsersBtn" onclick="switchSideTab('users')"><i class="fa fa-user"></i> المتصلون</button>
      <button id="tabWallBtn" onclick="switchSideTab('wall')"><i class="fa fa-commenting-o"></i> الحائط</button>
    </div>
    <div class="listScroll" id="roomsPane">
      <div class="newRoomBtn" onclick="openCreateRoomModal()"><i class="fa fa-plus"></i> غرفة جديدة</div>
      <div id="roomsList"></div>
    </div>
    <div class="listScroll" id="usersPane" style="display:none;">
      <div id="onlineUsersList"></div>
    </div>
    <div class="listScroll wallWrap" id="wallPane" style="display:none;">
      <div class="wallComposer">
        <textarea id="wallInput" placeholder="اكتب منشورًا..." rows="2"></textarea>
        <div style="text-align:left; margin-top:6px;"><button class="tinyBtn primary" onclick="postToWall()"><i class="fa fa-send"></i> نشر</button></div>
      </div>
      <div id="wallList"></div>
    </div>
  </div>
  <div class="chatArea" id="chatAreaEl">
    <div id="bannerBarEl" class="bannerBar" style="display:none;"></div>
    <div id="emptyChatState" class="emptyState">
      <div class="bigIcon"><i class="fa fa-comment-o"></i></div>
      <div>اختر غرفة أو مستخدمًا لبدء الحديث</div>
    </div>
    <div id="activeChat" style="display:none; flex:1; flex-direction:column; height:100%; min-height:0;">
      <div class="chatHead">
        <button class="iconBtn backBtn" onclick="closeActiveChatMobile()"><i class="fa fa-arrow-right"></i></button>
        <div class="roomIcon" id="chatHeadIcon">غ</div>
        <div class="chatHeadInfo">
          <div class="chatHeadTitle" id="chatHeadTitle">-</div>
          <div class="chatHeadSub" id="chatHeadSub">-</div>

  const darker = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');

function escapeHtml(str){
  if(typeof str !== 'string') return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

  if(!pass || pass.length < 4){ setLoginMsg('كلمة السر يجب ألا تقل عن 4 أحرف'); return; }

  const geo = await getGeoInfo();
  const banned = await checkIsBanned(key, getDeviceId(), geo.country_code);
  if(banned){ setLoginMsg('هذا الاسم أو الجهاز محظور'); return; }

  }

async function doLogin(){
  const uname = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!uname || !pass){ setLoginMsg('الرجاء إدخال الاسم وكلمة السر'); return; }
  const key = uname.toLowerCase();
  const snap = await db.ref('users/' + key).get();
  if(!snap.exists()){ setLoginMsg('اسم المستخدم أو كلمة السر غير صحيحة'); return; }
  const userData = snap.val();
  const passHash = await sha256(pass);
  if(passHash !== userData.passHash){ setLoginMsg('اسم المستخدم أو كلمة السر غير صحيحة'); return; }
  const geo = await getGeoInfo();
  const banned = await checkIsBanned(key, getDeviceId(), geo.country_code);
  if(banned){ setLoginMsg('حسابك محظور من الدخول'); return; }
  const subSnap = await db.ref('subs/' + key).get();
  if(subSnap.exists()){
    const sub = subSnap.val();
    if(sub.timefinish && Date.now() > sub.timefinish){
      await db.ref('users/' + key + '/power').set('');
      userData.power = '';
      await db.ref('subs/' + key).remove();
    }
  }
  await signInSession(key, userData);
  await logLogin('دخول|عضوية');
}
async function doGuestLogin(){
  if(!siteSettings.allowGuest){ setLoginMsg('دخول الزوار مغلق حاليًا'); return; }
  const geo = await getGeoInfo();

  if(banned){ setLoginMsg('هذا الجهاز محظور'); return; }
  const guestName = 'زائر' + Math.floor(Math.random()*9000 + 1000);
  const guestData = {
    username: guestName, topic: guestName, power: '', rep: 0, evaluation: 0,
    bg: '#FFFFFF', ucol: COLORS[0], mcol: '#000000', pic: '', ico: '',
    status: '( زائر )', isGuest: true, muted: false, allowPm: true, country: geo.country_code || ''
  };
  await signInSession(null, guestData, true);
  await logLogin('دخول|زائر');
}
async function signInSession(userKey, userData, isGuest){
  try{
    const cred = await auth.signInAnonymously();
    currentUid = cred.user.uid;
    currentUser = Object.assign({}, userData, { userKey: userKey, uid: currentUid, isGuest: !!isGuest });
    await ensureDefaultRanks();
    await onLoginSuccess();
  }catch(err){
    console.error(err);
    setLoginMsg('تعذّر الاتصال، حاول مرة أخرى');
  }
}
async function checkIsBanned(userKey, deviceId, country){
  const snap = await db.ref('bans').get();
  if(!snap.exists()) return false;
  const bans = Object.values(snap.val());
  return bans.some(b =>
    (b.type === 'name' && userKey && b.value.toLowerCase() === userKey) ||
    (b.type === 'device' && b.value === deviceId) ||
    (b.type === 'country' && country && b.value.toLowerCase() === country.toLowerCase())
  );
}

  text = applyCuts(text);
  const filtered = applyFilter(text);
  if(filtered === null){ toast('رسالتك تحتوي على كلمات ممنوعة'); return; }

    uid: currentUid, topic: currentUser.topic, ucol: currentUser.ucol, mcol: currentUser.mcol,
    pic: currentUser.pic || '', ico: currentUser.ico || '', co: currentUser.country || '',
    msg: filtered, time: timeNow(), ts: Date.now()
  };

  db.ref('filter').on('value', snap => { filterCache = snap.exists() ? snap.val() : {}; renderFilterAdmin(); });

function applyFilter(text){
  const lower = text.toLowerCase();
  const allowed = Object.values(filterCache).filter(f => f.type === 'allowed').some(f => f.word && lower.includes(f.word.toLowerCase()));
  if(allowed) return text;
  const banned = Object.values(filterCache).filter(f => f.type === 'banned');
  for(const f of banned){ if(f.word && lower.includes(f.word.toLowerCase())) return null; }
  const watched = Object.values(filterCache).filter(f => f.type === 'watch');
  for(const f of watched){
    if(f.word && lower.includes(f.word.toLowerCase())){
      db.ref('histLetter').push({ topic: currentUser.topic, msg: text, word: f.word, ts: Date.now() });
    }
  }
  return text;
}

async function deleteRank(name){
  if(!myPerm('setpower')){ toast('لا تملك صلاحية'); return; }
  if(!confirm('حذف رتبة "' + name + '"؟')) return;
  await db.ref('powers/' + name).remove();
  await logState('حذف رتبة', name);
}
function renderAdminRooms(){
  const el = document.getElementById('adminRoomsList'); if(!el) return;
  const ids = Object.keys(roomsCache);
  el.innerHTML = ids.map(id => {
    const r = roomsCache[id];
    return `<div class="tableRow">
      <div class="col">${escapeHtml(r.topic)}</div>
      <div class="col itemSub">${escapeHtml(r.about||'')}</div>
      <button class="tinyBtn danger" onclick="adminDeleteRoom('${id}')">حذف</button>
    </div>`;
  }).join('') || '<div style="color:var(--text-dim); font-size:12.5px;">لا توجد غرف</div>';
}
async function adminDeleteRoom(id){
  if(!myPerm('admin') && !myPerm('createroom')){ toast('لا تملك صلاحية'); return; }
  if(!confirm('حذف هذه الغرفة؟')) return;
  const topic = roomsCache[id].topic;
  await db.ref('rooms/' + id).remove();
  await db.ref('messages/rooms/' + id).remove();
  await logState('حذف غرفة (إدارة)', topic);
}
async function renderLogsAdmin(){
  const stateEl = document.getElementById('stateLogList');
  const loginEl = document.getElementById('loginLogList');
  const stateSnap = await db.ref('stateLog').limitToLast(50).get();
  const loginSnap = await db.ref('loginLog').limitToLast(50).get();
  const stateArr = stateSnap.exists() ? Object.values(stateSnap.val()).reverse() : [];
  const loginArr = loginSnap.exists() ? Object.values(loginSnap.val()).reverse() : [];
  stateEl.innerHTML = stateArr.map(s => `<div class="tableRow">
    <div class="col">${escapeHtml(s.state)}</div><div class="col itemSub">${escapeHtml(s.target||'')}</div>
    <div class="col itemSub">${escapeHtml(s.by||'')}</div>
  </div>`).join('') || '<div style="color:var(--text-dim); font-size:12px;">لا يوجد سجل</div>';
  loginEl.innerHTML = loginArr.map(s => `<div class="tableRow">
    <div class="col">${escapeHtml(s.username||'')}</div><div class="col itemSub">${escapeHtml(s.state)}</div>
    <div class="col itemSub">${new Date(s.ts).toLocaleString('ar')}</div>
  </div>`).join('') || '<div style="color:var(--text-dim); font-size:12px;">لا يوجد سجل</div>';
}
function switchSideTab(tab){
  document.getElementById('tabRoomsBtn').classList.toggle('active', tab==='rooms');
  document.getElementById('tabUsersBtn').classList.toggle('active', tab==='users');
  document.getElementById('tabWallBtn').classList.toggle('active', tab==='wall');
  document.getElementById('roomsPane').style.display = tab==='rooms' ? 'block' : 'none';
  document.getElementById('usersPane').style.display = tab==='users' ? 'block' : 'none';
  document.getElementById('wallPane').style.display = tab==='wall' ? 'block' : 'none';
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function showChatOnMobile(){
  if(window.innerWidth > 820) return;
  document.getElementById('sidebarEl').classList.add('hideOnMobile');
  document.getElementById('chatAreaEl').classList.add('showOnMobile');
}
function closeActiveChatMobile(){
  if(msgsListenerRef) msgsListenerRef.off();
  document.getElementById('sidebarEl').classList.remove('hideOnMobile');
  document.getElementById('chatAreaEl').classList.remove('showOnMobile');
}
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دردشة الزوار - GemiApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #0f3460;
            --chat-bg: #e8e8e8;
            --sent-msg: #007aff;
            --received-msg: #e5e5ea;
            --shadow: 0 8px 32px rgba(0,0,0,0.12);
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-color);
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 40px 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .login-card h2 {
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-card .subtitle i {
            color: var(--accent-color);
        }
        .btn-guest {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            transition: all 0.3s;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-guest:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            color: white;
        }
        .btn-guest:active {
            transform: scale(0.98);
        }
        .btn-guest i {
            margin-left: 10px;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0 20px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider-text {
            padding: 0 15px;
            color: #999;
            font-size: 13px;
            font-weight: 600;
        }
        .name-input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .name-input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .name-input-group input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border: 2px solid #eee;
            border-radius: 50px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8f9fa;
            text-align: right;
        }
        .name-input-group input:focus {
            border-color: var(--accent-color);
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(15, 52, 96, 0.1);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }
        .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        #chat-screen {
            display: none;
            height: 100vh;
            background: white;
        }
        .chat-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar {
            width: 320px;
            background: var(--primary-color);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar-header {
            padding: 0 20px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 15px;
        }
        .sidebar-header h4 {
            font-weight: 700;
            margin: 0;
            font-size: 20px;
        }
        .sidebar-header h4 i {
            color: var(--sent-msg);
            margin-left: 8px;
        }
        .user-profile {
            text-align: center;
            padding: 15px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 15px;
        }
        .user-profile .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 32px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .user-profile h6 {
            margin: 0;
            font-weight: 600;
        }
        .user-profile .guest-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }
        .user-profile .online-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .online-users {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px;
        }
        .online-users::-webkit-scrollbar {
            width: 4px;
        }
        .online-users::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .online-users h6 {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            transition: background 0.2s;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .user-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .user-item .avatar-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .user-item .user-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }
        .user-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #2ecc71;
        }
        .status-dot.offline {
            background: #e74c3c;
        }
        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-footer small {
            color: rgba(255,255,255,0.4);
            font-size: 11px;
        }
        .btn-leave {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #e74c3c;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-leave:hover {
            background: rgba(231, 76, 60, 0.2);
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f2f2f7;
            height: 100vh;
        }
        .chat-header {
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-header h5 {
            margin: 0;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 18px;
        }
        .chat-header h5 i {
            color: var(--sent-msg);
            margin-left: 8px;
        }
        .chat-header .badge-online {
            background: #2ecc71;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .chat-messages {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            background: #f2f2f7;
        }
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.sent {
            background: var(--sent-msg);
            color: white;
            margin-right: auto;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
        }
        .message.received {
            background: white;
            color: #1a1a2e;
            margin-left: auto;
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .message .msg-sender {
            font-size: 12px;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
            opacity: 0.8;
        }
        .message.sent .msg-sender {
            color: rgba(255,255,255,0.8);
        }
        .message .msg-content {
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
            text-align: left;
        }
        .message.sent .msg-time {
            color: rgba(255,255,255,0.7);
        }
        .message .msg-media {
            max-width: 200px;
            border-radius: 12px;
            margin-top: 6px;
            display: block;
        }
        .message .msg-file {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 4px;
            text-decoration: none;
            color: inherit;
        }
        .message.sent .msg-file {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .message.received .msg-file {
            background: #f0f0f0;
            color: var(--primary-color);
        }
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }
        .empty-chat i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.3;
        }
        .empty-chat p {
            font-size: 16px;
            font-weight: 500;
        }
        .chat-input {
            padding: 15px 25px;
            background: white;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #eee;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .chat-input input:focus {
            border-color: var(--sent-msg);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08);
        }
        .chat-input input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        .chat-input .btn-send {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: var(--sent-msg);
            color: white;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-input .btn-send:hover {
            background: #0055b3;
            transform: scale(1.02);
        }
        .chat-input .btn-send:active {
            transform: scale(0.96);
        }
        .file-upload-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-upload-wrapper .btn-file {
            padding: 10px 16px;
            border-radius: 30px;
            border: 2px solid #eee;
            background: white;
            transition: all 0.3s;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .file-upload-wrapper .btn-file:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .sidebar {
                display: none;
                width: 100%;
            }
            .sidebar.mobile-show {
                display: flex;
                position: fixed;
                z-index: 1000;
                width: 80%;
                max-width: 300px;
                box-shadow: 4px 0 20px rgba(0,0,0,0.3);
            }
            .message {
                max-width: 88%;
            }
            .chat-input {
                padding: 10px 15px;
                gap: 6px;
                flex-wrap: wrap;
            }
            .chat-input input {
                font-size: 14px;
                padding: 10px 16px;
                min-width: 120px;
            }
            .chat-input .btn-send {
                padding: 10px 18px;
                font-size: 13px;
            }
            .chat-header h5 {
                font-size: 15px;
            }
            .login-card {
                padding: 30px 20px;
            }
            .chat-messages {
                padding: 15px;
            }
        }
        @media (max-width: 480px) {
            .login-card h2 {
                font-size: 22px;
            }
            .btn-guest {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2><i class="fas fa-comment-dots" style="color: #667eea;"></i> دردشة الزوار</h2>
        <p class="subtitle"><i class="fas fa-users"></i> تواصل فوري بدون تسجيل</p>
        <button id="guestLoginBtn" class="btn-guest">
            <i class="fas fa-user-astronaut"></i> دخول كزائر
        </button>
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-text">اختر اسماً</span>
            <span class="divider-line"></span>
        </div>
        <div class="name-input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="guestNameInput" placeholder="أدخل اسمك للدردشة..." maxlength="20" autocomplete="off">
        </div>
        <button id="guestNameBtn" class="btn-guest" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);">
            <i class="fas fa-sign-in-alt"></i> دخول بالاسم
        </button>
        <div class="login-footer">
            🚀 تجربة دردشة فورية • <a href="#" id="randomNameBtn">اسم عشوائي</a>
        </div>
        <div id="loginError" style="color: #e74c3c; text-align: center; margin-top: 15px; font-size: 13px; display: none;"></div>
    </div>
</div>

<div id="chat-screen">
    <div class="chat-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-comments"></i> الدردشة</h4>
            </div>
            <div class="user-profile">
                <div class="avatar" id="userAvatar">ز</div>
                <h6 id="userDisplayName">زائر</h6>
                <span class="guest-badge"><span class="online-status"></span> متصل</span>
            </div>
            <div class="online-users">
                <h6><i class="fas fa-circle" style="color: #2ecc71; font-size: 8px;"></i> المتصلون الآن (<span id="onlineCount">0</span>)</h6>
                <div id="usersList"></div>
            </div>
            <div class="sidebar-footer">
                <small><i class="fas fa-shield-alt"></i> زوار</small>
                <button id="leaveBtn" class="btn-leave"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <h5><i class="fas fa-hashtag"></i> الغرفة العامة</h5>
                <span class="badge-online" id="headerOnlineCount"><i class="fas fa-circle" style="font-size: 8px;"></i> 0 متصل</span>
            </div>
            <div class="chat-messages" id="messagesContainer">
                <div class="empty-chat" id="emptyChat">
                    <i class="fas fa-comment-dots"></i>
                    <p>لا توجد رسائل بعد</p>
                    <span style="font-size: 13px; color: #bbb;">كن أول من يكتب!</span>
                </div>
            </div>
            <div class="chat-input">
                <div class="file-upload-wrapper">
                    <button class="btn-file"><i class="fas fa-paperclip"></i></button>
                    <input type="file" id="fileInput" accept="image/*,video/*,audio/*">
                </div>
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." dir="auto" autocomplete="off">
                <button id="sendBtn" class="btn-send"><i class="fas fa-paper-plane"></i> إرسال</button>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
    }
}
</script>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged, updateProfile } from 'firebase/auth';
import { getDatabase, ref, push, onChildAdded, onValue, update, remove, serverTimestamp, set, get } from 'firebase/database';
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'firebase/storage';

const firebaseConfig = {
    apiKey: "AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",
    authDomain: "gemiapp.firebaseapp.com",
    databaseURL: "https://gemiapp-default-rtdb.firebaseio.com",
    projectId: "gemiapp",
    storageBucket: "gemiapp.firebasestorage.app",
    messagingSenderId: "27673374613",
    appId: "1:27673374613:web:86f977ea41e8c0e2b0909c",
    measurementId: "G-G5XN8H9MG9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const guestLoginBtn = document.getElementById('guestLoginBtn');
const guestNameBtn = document.getElementById('guestNameBtn');
const guestNameInput = document.getElementById('guestNameInput');
const randomNameBtn = document.getElementById('randomNameBtn');
const loginError = document.getElementById('loginError');
const messagesContainer = document.getElementById('messagesContainer');
const emptyChat = document.getElementById('emptyChat');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const fileInput = document.getElementById('fileInput');
const usersList = document.getElementById('usersList');
const onlineCount = document.getElementById('onlineCount');
const headerOnlineCount = document.getElementById('headerOnlineCount');
const userDisplayName = document.getElementById('userDisplayName');
const userAvatar = document.getElementById('userAvatar');
const leaveBtn = document.getElementById('leaveBtn');

let currentUser = null;
let currentDisplayName = '';
let unsubscribeMessages = null;
let unsubscribeUsers = null;

const randomNames = ['مشعاع', 'نجمة', 'سندباد', 'ياسمين', 'زائر', 'غيمة', 'قمر', 'نسيم', 'شروق', 'غروب', 'أمل', 'ريان', 'سارة', 'نور', 'حياة', 'سلام', 'فرح', 'ليان', 'جود', 'تالا'];

function getRandomName() {
    return randomNames[Math.floor(Math.random() * randomNames.length)] + Math.floor(Math.random() * 100);
}

function showError(msg) {
    loginError.textContent = msg;
    loginError.style.display = 'block';
    setTimeout(() => { loginError.style.display = 'none'; }, 4000);
}

function getInitials(name) {
    return name.charAt(0).toUpperCase();
}

function getAvatarColor(name) {
    const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#38f9d7', '#fa709a', '#fee140'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return colors[Math.abs(hash) % colors.length];
}

async function loginAsGuest(displayName) {
    try {
        const result = await signInAnonymously(auth);
        const user = result.user;
        await updateProfile(user, { displayName: displayName || getRandomName() });
        const userRef = ref(db, 'users/' + user.uid);
        await set(userRef, {
            uid: user.uid,
            displayName: user.displayName,
            online: true,
            joinedAt: serverTimestamp(),
            lastSeen: serverTimestamp()
        });
        currentUser = user;
        currentDisplayName = user.displayName;
        console.log('✅ زائر دخل:', user.displayName);
    } catch (error) {
        showError('خطأ في الدخول: ' + error.message);
        console.error(error);
    }
}

guestLoginBtn.addEventListener('click', () => {
    const name = guestNameInput.value.trim() || getRandomName();
    loginAsGuest(name);
});

guestNameBtn.addEventListener('click', () => {
    const name = guestNameInput.value.trim();
    if (!name) {
        showError('الرجاء إدخال اسم للدردشة');
        return;
    }
    loginAsGuest(name);
});

guestNameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') guestNameBtn.click();
});

randomNameBtn.addEventListener('click', (e) => {
    e.preventDefault();
    guestNameInput.value = getRandomName();
});

onAuthStateChanged(auth, (user) => {
    if (user) {
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        currentUser = user;
        currentDisplayName = user.displayName || 'زائر';
        updateUI(user);
        listenToMessages();
        listenToUsers();
        updateUserStatus(true);
        messageInput.focus();
    } else {
        loginScreen.style.display = 'flex';
        chatScreen.style.display = 'none';
        if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
        if (unsubscribeUsers) { unsubscribeUsers(); unsubscribeUsers = null; }
        usersList.innerHTML = '';
        onlineCount.textContent = '0';
        headerOnlineCount.textContent = '0 متصل';
    }
});

function updateUI(user) {
    const name = user.displayName || 'زائر';
    userDisplayName.textContent = name;
    userAvatar.textContent = getInitials(name);
    userAvatar.style.background = getAvatarColor(name);
}

function updateUserStatus(online) {
    if (currentUser) {
        const userRef = ref(db, 'users/' + currentUser.uid);
        update(userRef, {
            online: online,
            lastSeen: serverTimestamp()
        });
    }
}

window.addEventListener('beforeunload', () => {
    updateUserStatus(false);
});

leaveBtn.addEventListener('click', async () => {
    if (currentUser) {
        await updateUserStatus(false);
        await auth.signOut();
    }
});

async function sendMessage(content, fileURL = null, fileType = null, fileName = null) {
    if (!content && !fileURL) return;
    if (!currentUser) {
        alert('الرجاء تسجيل الدخول أولاً');
        return;
    }
    try {
        const messagesRef = ref(db, 'messages');
        await push(messagesRef, {
            content: content || '',
            userId: currentUser.uid,
            userName: currentUser.displayName || 'زائر',
            userAvatar: getInitials(currentUser.displayName || 'ز'),
            avatarColor: getAvatarColor(currentUser.displayName || 'ز'),
            timestamp: serverTimestamp(),
            fileURL: fileURL || null,
            fileType: fileType || null,
            fileName: fileName || null
        });
    } catch (error) {
        console.error('❌ خطأ في الإرسال:', error);
        alert('فشل إرسال الرسالة: ' + error.message);
    }
}

sendBtn.addEventListener('click', () => {
    const content = messageInput.value.trim();
    if (content) {
        sendMessage(content);
        messageInput.value = '';
        messageInput.focus();
    }
});

messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendBtn.click();
});

fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!currentUser) {
        alert('الرجاء تسجيل الدخول أولاً');
        fileInput.value = '';
        return;
    }
    if (file.size > 5 * 1024 * 1024) {
        alert('الملف كبير جداً، الحد الأقصى 5 ميجابايت');
        fileInput.value = '';
        return;
    }
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'message sent';
    loadingMsg.innerHTML = `<div class="loading-spinner"></div> جاري رفع الملف...`;
    messagesContainer.appendChild(loadingMsg);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    try {
        const path = `uploads/${Date.now()}_${file.name}`;
        const fileRef = storageRef(storage, path);
        await uploadBytes(fileRef, file);
        const downloadURL = await getDownloadURL(fileRef);
        loadingMsg.remove();
        await sendMessage('📎 ' + file.name, downloadURL, file.type, file.name);
        fileInput.value = '';
    } catch (error) {
        loadingMsg.remove();
        console.error('❌ خطأ في الرفع:', error);
        alert('فشل رفع الملف: ' + error.message);
        fileInput.value = '';
    }
});

function listenToMessages() {
    const messagesRef = ref(db, 'messages');
    if (unsubscribeMessages) unsubscribeMessages();
    let initialLoad = true;
    unsubscribeMessages = onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        if (initialLoad && messagesContainer.children.length > 1) return;
        if (emptyChat) emptyChat.style.display = 'none';
        const msgDiv = document.createElement('div');
        const isOwn = data.userId === currentUser?.uid;
        msgDiv.className = `message ${isOwn ? 'sent' : 'received'}`;
        let mediaHtml = '';
        if (data.fileURL) {
            if (data.fileType && data.fileType.startsWith('image/')) {
                mediaHtml = `<img src="${data.fileURL}" class="msg-media" alt="صورة" loading="lazy">`;
            } else if (data.fileType && data.fileType.startsWith('video/')) {
                mediaHtml = `<video src="${data.fileURL}" class="msg-media" controls style="max-width:200px;"></video>`;
            } else if (data.fileType && data.fileType.startsWith('audio/')) {
                mediaHtml = `<audio src="${data.fileURL}" controls style="max-width:150px;"></audio>`;
            } else {
                mediaHtml = `<a href="${data.fileURL}" target="_blank" class="msg-file"><i class="fas fa-download"></i> ${data.fileName || 'تحميل ملف'}</a>`;
            }
        }
        const time = data.timestamp ? new Date(data.timestamp) : new Date();
        const timeStr = time.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const senderName = data.userName || 'زائر';
        const avatarInitial = data.userAvatar || senderName.charAt(0).toUpperCase();
        const avatarColor = data.avatarColor || getAvatarColor(senderName);
        msgDiv.innerHTML = `
            <span class="msg-sender">
                <span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${avatarColor};color:white;text-align:center;line-height:22px;font-size:11px;font-weight:700;margin-left:6px;">${avatarInitial}</span>
                ${senderName}
            </span>
            ${data.content ? `<div class="msg-content">${data.content}</div>` : ''}
            ${mediaHtml}
            <span class="msg-time">${timeStr}</span>
        `;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
    setTimeout(() => { initialLoad = false; }, 1000);
}

function listenToUsers() {
    const usersRef = ref(db, 'users');
    if (unsubscribeUsers) unsubscribeUsers();
    unsubscribeUsers = onValue(usersRef, (snapshot) => {
        const data = snapshot.val();
        usersList.innerHTML = '';
        let online = 0;
        if (data) {
            const userIds = Object.keys(data);
            userIds.forEach((uid) => {
                const user = data[uid];
                if (uid === currentUser?.uid) return;
                const isOnline = user.online === true;
                if (isOnline) online++;
                const item = document.createElement('div');
                item.className = 'user-item';
                const name = user.displayName || 'زائر';
                const initial = name.charAt(0).toUpperCase();
                const color = user.avatarColor || getAvatarColor(name);
                item.innerHTML = `
                    <div class="avatar-mini" style="background:${color};">${initial}</div>
                    <span class="user-name">${name}</span>
                    <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                `;
                usersList.appendChild(item);
            });
        }
        onlineCount.textContent = online;
        headerOnlineCount.textContent = online + ' متصل';
    });
}

document.addEventListener('DOMContentLoaded', () => {
    guestNameInput.focus();
});
</script>

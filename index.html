<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>سكرة ليبيا</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://unpkg.com/videojs-youtube/dist/Youtube.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1e1e1e;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent-color: #4da8da;
      --accent-hover: #3b8ab5;
      --danger-color: #e57373;
      --success-color: #81c784;
      --warning-color: #ffb74d;
      --border-color: #333333;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 24px;
      --transition: all 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loginScreen {
      position: fixed; inset: 0; background: rgba(10, 10, 10, 0.97);
      display: flex; justify-content: center; align-items: center; z-index: 10000;
      backdrop-filter: blur(5px);
    }
    #loginBox {
      background: var(--bg-secondary); padding: 2.5rem; border-radius: var(--radius-md);
      text-align: center; width: 90%; max-width: 380px; box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }
    #loginBox h2 {
      margin-bottom: 1.5rem; font-weight: 700; font-size: 1.8rem;
      background: linear-gradient(135deg, var(--accent-color), #67d8f5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #usernameInput {
      width: 100%; padding: 14px 20px; margin: 15px 0; border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); font-size: 16px; text-align: center; font-family: inherit;
      background: var(--bg-primary); color: var(--text-primary); transition: var(--transition);
    }
    #usernameInput:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 0 2px rgba(77, 168, 218, 0.3); }
    #loginBtn {
      background: linear-gradient(135deg, var(--accent-color), #67d8f5); color: white; border: none;
      padding: 14px 30px; border-radius: var(--radius-lg); font-size: 18px; cursor: pointer;
      font-family: inherit; font-weight: 700; width: 100%; transition: var(--transition);
    }
    #loginBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(77, 168, 218, 0.4); }
    #loginBtn:active { transform: scale(0.98); }

    #chat-container { display: flex; flex-direction: column; height: 100vh; opacity: 0; transition: opacity 0.3s ease; }
    #topButtons {
      display: flex; gap: 10px; padding: 10px 15px; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color); flex-shrink: 0; align-items: center;
    }
    .btn {
      background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 8px 16px; cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 6px;
      color: var(--text-primary); transition: var(--transition); font-family: inherit; font-weight: 500;
    }
    .btn:hover { background: #3a3a3a; border-color: var(--accent-color); }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    .btn-primary { background: var(--accent-color); border-color: var(--accent-color); }
    .btn-primary:hover { background: var(--accent-hover); }

    #messages {
      flex: 1; overflow-y: auto; padding: 15px; scroll-behavior: smooth;
      display: flex; flex-direction: column; gap: 4px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .msg {
      display: flex; align-items: baseline; gap: 8px; padding: 6px 10px;
      border-radius: var(--radius-sm); animation: fadeIn 0.3s ease; transition: background 0.2s;
    }
    .msg:hover { background: rgba(255,255,255,0.03); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .user-badge {
      font-weight: 700; color: var(--accent-color); background: rgba(77, 168, 218, 0.15);
      padding: 2px 8px; border-radius: 12px; font-size: 13px; white-space: nowrap; flex-shrink: 0;
      border: 1px solid rgba(77, 168, 218, 0.3);
    }
    .msg-text { flex: 1; word-break: break-word; line-height: 1.5; }
    .msg-time { font-size: 11px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }

    .delete-btn {
      background: none; border: none; color: var(--text-secondary); cursor: pointer;
      padding: 4px; border-radius: 50%; display: flex; align-items: center; opacity: 0; transition: var(--transition);
    }
    .msg:hover .delete-btn { opacity: 0.7; }
    .delete-btn:hover { color: var(--danger-color); background: rgba(229, 115, 115, 0.2); opacity: 1 !important; }
    .delete-btn svg { width: 16px; height: 16px; }

    .sys-msg {
      text-align: center; color: var(--text-secondary); font-size: 12px; margin: 8px auto;
      background: var(--bg-tertiary); padding: 4px 12px; border-radius: 12px; width: fit-content;
      animation: fadeIn 0.5s ease; border: 1px solid var(--border-color);
    }

    #inputArea {
      display: flex; gap: 10px; padding: 12px 15px; background: var(--bg-secondary);
      border-top: 1px solid var(--border-color); flex-shrink: 0;
    }
    #messageInput {
      flex: 1; font-size: 16px; padding: 12px 20px; border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); font-family: inherit; background: var(--bg-tertiary);
      color: var(--text-primary); transition: var(--transition);
    }
    #messageInput:focus { border-color: var(--accent-color); outline: none; }
    #sendBtn {
      background: linear-gradient(135deg, var(--accent-color), #67d8f5); color: white; border: none;
      border-radius: var(--radius-lg); padding: 0 20px; cursor: pointer; font-family: inherit;
      font-weight: 700; display: flex; align-items: center; gap: 6px; transition: var(--transition);
    }
    #sendBtn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(77, 168, 218, 0.3); }
    #sendBtn svg { width: 20px; height: 20px; fill: currentColor; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999;
      display: flex; justify-content: center; align-items: center; backdrop-filter: blur(2px);
    }
    .modal-box {
      background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 20px; width: 90%; max-width: 400px; box-shadow: var(--shadow); animation: scaleIn 0.2s ease;
    }
    @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-box h4 { margin-bottom: 15px; font-size: 18px; text-align: center; color: var(--accent-color); }
    .modal-box input {
      width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-primary);
      font-family: inherit; text-align: center;
    }
    .modal-box button {
      width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none;
      border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 700; transition: var(--transition);
    }
    .modal-box button:hover { background: var(--accent-hover); }
    #usersList { max-height: 250px; overflow-y: auto; }
    .user-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 8px;
      border-bottom: 1px solid var(--border-color); font-size: 15px;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-online { background: var(--success-color); box-shadow: 0 0 8px rgba(129, 199, 132, 0.5); }
    .status-idle { background: var(--warning-color); box-shadow: 0 0 8px rgba(255, 183, 77, 0.5); }
    .status-offline { background: #757575; }

    #pinnedVideoPlayer {
      position: fixed; top: 60px; right: 20px; width: 400px; background: #000;
      border-radius: var(--radius-md); overflow: hidden; z-index: 998; display: none;
      flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border-color);
    }
    .video-header {
      background: var(--bg-secondary); padding: 10px 15px; display: flex;
      justify-content: space-between; align-items: center; cursor: move; font-weight: 500;
      border-bottom: 1px solid var(--border-color);
    }
    .close-video-btn {
      background: none; border: none; color: var(--text-secondary); cursor: pointer;
      padding: 4px; border-radius: 50%; display: flex; transition: var(--transition);
    }
    .close-video-btn:hover { color: var(--danger-color); background: rgba(255,255,255,0.1); }
    .close-video-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .video-body { position: relative; width: 100%; background: #000; }
    .video-status {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; text-align: center; z-index: 5; padding: 15px; background: rgba(0,0,0,0.8);
      border-radius: var(--radius-sm);
    }
    .video-error { color: var(--danger-color); font-size: 14px; }
    .video-loading { color: var(--accent-color); }
    .resize-handle {
      position: absolute; bottom: 0; left: 0; width: 20px; height: 20px;
      cursor: nwse-resize; background: linear-gradient(315deg, transparent 50%, var(--accent-color) 50%);
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <h2>👋 أهلاً بك في سكرة ليبيا</h2>
    <input type="text" id="usernameInput" placeholder="اكتب اسمك المستعار" maxlength="15" autofocus autocomplete="off">
    <button id="loginBtn">دخول إلى الدردشة</button>
  </div>
</div>

<div id="chat-container" style="display: none;">
  <div id="topButtons">
    <button class="btn" id="setVideoBtn">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4V6.5l-4 4Z"/></svg>
      <span>فيديو</span>
    </button>
    <button class="btn" id="onlineListBtn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="4"/><path d="M12 14c-6 0-8 3-8 5v1h16v-1c0-2-2-5-8-5Z"/></svg>
      <span id="userCount">0</span>
    </button>
  </div>

  <div id="messages"></div>

  <form id="inputArea" autocomplete="off">
    <input type="text" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off">
    <button type="submit" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      إرسال
    </button>
  </form>

  <div id="pinnedVideoPlayer"></div>
</div>

<div id="modalContainer"></div>

<script>
  const icons = {
    close: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  };

  // قائمة وكلاء CORS موثوقة
  const CORS_PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://cors-anywhere.herokuapp.com/',
  ];
  let activeProxyIndex = 0;

  function getProxiedUrl(originalUrl) {
    return CORS_PROXIES[activeProxyIndex] + encodeURIComponent(originalUrl);
  }

  function tryNextProxy() {
    activeProxyIndex = (activeProxyIndex + 1) % CORS_PROXIES.length;
    console.log(`🔄 التبديل إلى الوكيل ${activeProxyIndex + 1}`);
  }

  class ChatApp {
    constructor() {
      this.loginScreen = document.getElementById('loginScreen');
      this.usernameInput = document.getElementById('usernameInput');
      this.loginBtn = document.getElementById('loginBtn');
      this.chatContainer = document.getElementById('chat-container');
      this.messagesDiv = document.getElementById('messages');
      this.messageInput = document.getElementById('messageInput');
      this.userCountSpan = document.getElementById('userCount');
      this.modalContainer = document.getElementById('modalContainer');
      this.pinnedVideoContainer = document.getElementById('pinnedVideoPlayer');
      this.onlineListBtn = document.getElementById('onlineListBtn');
      this.setVideoBtn = document.getElementById('setVideoBtn');
      
      document.getElementById('inputArea').addEventListener('submit', (e) => this.sendMessage(e));

      this.username = '';
      this.userRef = null;
      this.messagesRef = null;
      this.onlineRef = null;
      this.pinnedVideoRef = null;
      this.serverTimeOffset = 0;
      this.renderedMessages = new Set();
      this.videoPlayerManager = null;

      this.initFirebase();
      this.initEventListeners();
    }

    initFirebase() {
      const firebaseConfig = {
        apiKey: "AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",
        authDomain: "gemiapp.firebaseapp.com",
        databaseURL: "https://gemiapp-default-rtdb.firebaseio.com",
        projectId: "gemiapp",
        storageBucket: "gemiapp.firebasestorage.app",
        messagingSenderId: "27673374613",
        appId: "1:27673374613:web:86f977ea41e8c0e2b0909c"
      };
      try {
        firebase.initializeApp(firebaseConfig);
        this.db = firebase.database();
      } catch(e) {
        alert('خطأ في الاتصال بقاعدة البيانات');
      }
    }

    initEventListeners() {
      this.loginBtn.onclick = () => this.attemptLogin();
      this.usernameInput.onkeypress = (e) => { if (e.key === 'Enter') this.attemptLogin(); };
      this.onlineListBtn.onclick = () => this.showOnlineUsersModal();
      this.setVideoBtn.onclick = () => this.showSetVideoModal();
    }

    attemptLogin() {
      const name = this.usernameInput.value.trim();
      if (/[.#$\[\]]/.test(name)) return alert("الرجاء عدم استخدام رموز خاصة");
      if (name.length < 2) return alert("الاسم قصير جداً");
      this.username = name;
      this.userRef = this.db.ref("online/" + this.username);
      this.messagesRef = this.db.ref("messages");
      this.onlineRef = this.db.ref("online");
      this.pinnedVideoRef = this.db.ref("pinned_video");
      this.startChat();
    }

    startChat() {
      this.loginScreen.style.display = 'none';
      this.chatContainer.style.display = 'flex';
      setTimeout(() => this.chatContainer.style.opacity = '1', 50);

      this.db.ref('.info/serverTimeOffset').on('value', snap => this.serverTimeOffset = snap.val() || 0);
      this.userRef.set({ lastActive: firebase.database.ServerValue.TIMESTAMP });
      this.userRef.onDisconnect().remove();
      setInterval(() => this.userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP }), 60000);
      setInterval(() => this.cleanInactiveUsers(), 60000);

      this.messagesRef.limitToLast(100).on("child_added", snap => {
        if (this.renderedMessages.has(snap.key)) return;
        this.renderedMessages.add(snap.key);
        this.addMessageToUI(snap.key, snap.val());
      });

      this.messagesRef.on("child_removed", snap => {
        this.renderedMessages.delete(snap.key);
        const el = document.getElementById(`msg-${snap.key}`);
        if (el) el.remove();
      });

      this.onlineRef.on("value", snap => this.userCountSpan.textContent = snap.numChildren());
      this.pinnedVideoRef.on("value", snap => this.handlePinnedVideo(snap.val()));

      this.addSystemMessage(`👋 مرحباً ${this.escapeHtml(this.username)}!`);
    }

    cleanInactiveUsers() {
      const now = Date.now() + this.serverTimeOffset;
      this.onlineRef.once('value', snap => {
        snap.forEach(child => { if (now - child.val().lastActive > 90000) child.ref.remove(); });
      });
    }

    addMessageToUI(key, { user, text, timestamp }) {
      const div = document.createElement("div");
      div.className = "msg";
      div.id = `msg-${key}`;
      const isMe = user === this.username;
      div.innerHTML = `
        <span class="user-badge">${this.escapeHtml(user)}</span>
        <span class="msg-text">${this.escapeHtml(text)}</span>
        <span class="msg-time" data-timestamp="${timestamp}"></span>
      `;
      const timeSpan = div.querySelector('.msg-time');
      this.updateRelativeTime(timestamp, timeSpan);

      if (isMe) {
        const del = document.createElement("button");
        del.className = "delete-btn";
        del.innerHTML = icons.trash;
        del.title = "حذف";
        del.onclick = () => { if(confirm("حذف الرسالة؟")) this.messagesRef.child(key).remove(); };
        div.appendChild(del);
      }

      this.messagesDiv.appendChild(div);
      this.scrollToBottom();
      if (timestamp) {
        const interval = setInterval(() => {
          if (!document.getElementById(`msg-${key}`)) clearInterval(interval);
          else this.updateRelativeTime(timestamp, timeSpan);
        }, 60000);
      }
    }

    updateRelativeTime(timestamp, el) {
      if (!timestamp || !el) return;
      const diff = Math.floor((Date.now() + this.serverTimeOffset - timestamp) / 1000);
      let txt = "الآن";
      if (diff < 60) txt = `${diff} ث`;
      else if (diff < 3600) txt = `منذ ${Math.floor(diff/60)} د`;
      else if (diff < 86400) txt = `منذ ${Math.floor(diff/3600)} س`;
      else txt = `منذ ${Math.floor(diff/86400)} ي`;
      el.textContent = txt;
    }

    addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "sys-msg";
      div.textContent = text;
      this.messagesDiv.appendChild(div);
      this.scrollToBottom();
    }

    sendMessage(e) {
      e.preventDefault();
      const text = this.messageInput.value.trim();
      if (!text) return;
      this.messagesRef.push({ user: this.username, text, timestamp: firebase.database.ServerValue.TIMESTAMP });
      this.messageInput.value = "";
      this.userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP });
    }

    showModal(title, content) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.innerHTML = `<h4>${title}</h4>${content}`;
      overlay.appendChild(box);
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      this.modalContainer.appendChild(overlay);
      return { overlay, box };
    }

    showOnlineUsersModal() {
      this.onlineRef.once("value", snap => {
        const users = snap.val() || {};
        const now = Date.now() + this.serverTimeOffset;
        const arr = Object.entries(users).sort((a,b) => (b[1].lastActive||0) - (a[1].lastActive||0));
        let list = '';
        arr.forEach(([name, data]) => {
          const diff = now - (data.lastActive||0);
          let cls = 'status-online', txt = 'متصل';
          if (diff > 60000) { cls = 'status-offline'; txt = 'غير متصل'; }
          else if (diff > 30000) { cls = 'status-idle'; txt = 'خامل'; }
          list += `<div class="user-item"><span class="status-dot ${cls}"></span><span>${this.escapeHtml(name)}</span><span style="margin-right:auto;font-size:12px;color:var(--text-secondary)">${txt}</span></div>`;
        });
        this.showModal('👥 المتصلون الآن', `<div id="usersList">${list || '<p>لا يوجد متصلون</p>'}</div>`);
      });
    }

    showSetVideoModal() {
      const content = `
        <input type="text" id="videoUrlInput" placeholder="أدخل رابط الفيديو" style="margin-bottom:10px;">
        <small style="display:block;text-align:center;color:var(--text-secondary);margin-bottom:15px;">YouTube | HLS/M3U8 | MP4 | Twitter</small>
        <button id="submitVideoBtn" class="btn-primary">🎬 تثبيت الفيديو</button>
      `;
      const { overlay, box } = this.showModal('📺 تثبيت فيديو', content);
      const btn = box.querySelector('#submitVideoBtn');
      const inp = box.querySelector('#videoUrlInput');
      btn.onclick = () => {
        const url = inp.value.trim();
        if (!url) return alert("أدخل رابطاً");
        const data = this.parseVideoUrl(url);
        if (data) {
          data.setBy = this.username;
          this.pinnedVideoRef.set(data);
          overlay.remove();
          this.addSystemMessage(`🎬 ${this.username} ثبت فيديو`);
        } else {
          alert("الرابط غير مدعوم");
        }
      };
      inp.onkeypress = e => { if (e.key === 'Enter') btn.click(); };
    }

    parseVideoUrl(url) {
      url = url.trim();
      const yt = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (yt) return { type: 'youtube', id: yt[1] };
      const tw = url.match(/(?:twitter|x)\.com\/\w+\/status\/(\d+)/);
      if (tw) return { type: 'twitter', id: tw[1] };
      if (url.includes('.m3u8') || url.includes('m3u')) return { type: 'hls', url };
      if (/\.(mp4|webm|ogv)(\?.*)?$/i.test(url)) return { type: 'direct', url };
      // إذا كان الرابط يبدو كـ HLS لكن بدون امتداد واضح
      if (url.includes('master') || url.includes('playlist') || url.includes('token')) return { type: 'hls', url };
      return null;
    }

    handlePinnedVideo(data) {
      if (this.videoPlayerManager) { this.videoPlayerManager.dispose(); this.videoPlayerManager = null; }
      this.pinnedVideoContainer.innerHTML = '';
      if (!data) { this.pinnedVideoContainer.style.display = 'none'; return; }
      this.pinnedVideoContainer.style.display = 'flex';
      this.videoPlayerManager = new VideoPlayerManager(this.pinnedVideoContainer, data, () => {
        this.pinnedVideoRef.remove();
        this.addSystemMessage('🗑️ تم إزالة الفيديو');
      });
    }

    scrollToBottom() { setTimeout(() => this.messagesDiv.scrollTop = this.messagesDiv.scrollHeight, 50); }
    escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
  }

  // مشغل الفيديو مع دعم Proxy
  class VideoPlayerManager {
    constructor(container, data, onClose) {
      this.container = container;
      this.data = data;
      this.onClose = onClose;
      this.player = null;
      this.hls = null;
      this.buildUI();
      this.init();
    }

    buildUI() {
      this.container.innerHTML = `
        <div class="video-header">
          <span>🎬 ${this.escapeHtml(this.data.setBy||'')}</span>
          <button class="close-video-btn">${icons.close}</button>
        </div>
        <div class="video-body">
          <div id="videoContainer" style="width:100%;height:100%">
            <div class="video-status video-loading">⏳ جاري التحميل...</div>
          </div>
          <div class="resize-handle" id="resizeHandle"></div>
        </div>`;
      this.container.querySelector('.close-video-btn').onclick = () => this.onClose();
      this.makeDraggable();
      this.makeResizable();
    }

    async init() {
      const vc = document.getElementById('videoContainer');
      try {
        let src = null, type = '';

        if (this.data.type === 'youtube') {
          src = `https://www.youtube.com/watch?v=${this.data.id}`;
          type = 'video/youtube';
        } else if (this.data.type === 'twitter') {
          const r = await fetch(`https://api.vxtwitter.com/i/status/${this.data.id}`);
          const d = await r.json();
          if (d?.media_extended?.[0]?.url) { src = d.media_extended[0].url; type = 'video/mp4'; }
          else { this.showError('تعذر تحميل الفيديو من تويتر'); return; }
        } else if (this.data.type === 'hls' || this.data.type === 'direct') {
          // استخدام Proxy للروابط المباشرة
          src = getProxiedUrl(this.data.url);
          type = (this.data.type === 'hls') ? 'application/x-mpegURL' : 'video/mp4';
        }

        vc.innerHTML = '';
        const video = document.createElement('video');
        video.id = 'mainVideo';
        video.className = 'video-js vjs-big-play-centered';
        video.setAttribute('playsinline', '');
        video.setAttribute('crossorigin', 'anonymous');
        vc.appendChild(video);

        const opts = {
          autoplay: true, muted: true, controls: true, aspectRatio: '16:9',
          techOrder: (type === 'video/youtube') ? ['youtube','html5'] : ['html5'],
          sources: [{ type, src }],
          youtube: { iv_load_policy:1, modestbranding:1 }
        };

        this.player = videojs(video, opts);
        this.player.ready(() => {
          this.player.on('error', () => {
            console.error('❌ خطأ video.js');
            if (this.data.type === 'hls') {
              // تجربة HLS.js مع Proxy
              this.tryHlsWithProxy(video, this.data.url);
            } else {
              this.showError('تعذر تشغيل الفيديو');
            }
          });
        });

      } catch(e) {
        console.error(e);
        this.showError('فشل التحميل');
      }
    }

    tryHlsWithProxy(videoEl, originalUrl) {
      if (this.player) { this.player.dispose(); this.player = null; }
      videoEl.removeAttribute('id');
      videoEl.className = '';
      
      const proxiedUrl = getProxiedUrl(originalUrl);
      console.log('🔄 محاولة تشغيل HLS عبر:', proxiedUrl.substring(0, 80) + '...');
      
      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
        });
        
        hls.loadSource(proxiedUrl);
        hls.attachMedia(videoEl);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          console.log('✅ تم تحميل البيان بنجاح');
          videoEl.play().catch(() => {});
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('❌ خطأ HLS:', data.type, data.details);
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              console.log('🔄 إعادة المحاولة مع وكيل مختلف...');
              tryNextProxy();
              hls.loadSource(getProxiedUrl(originalUrl));
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              this.showError('فشل تشغيل البث بعد عدة محاولات');
              hls.destroy();
            }
          }
        });
        
        this.hls = hls;
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = proxiedUrl;
        videoEl.play().catch(() => {});
      } else {
        this.showError('المتصفح لا يدعم تشغيل HLS');
      }
    }

    showError(msg) {
      const vc = document.getElementById('videoContainer');
      if (vc) vc.innerHTML = `<div class="video-status video-error"><div style="font-size:24px;">⚠️</div><div>${msg}</div></div>`;
    }

    makeDraggable() {
      const hdr = this.container.querySelector('.video-header');
      let isDragging = false, sx, sy, ix, iy;
      const onStart = (e) => {
        isDragging = true;
        const p = e.touches ? e.touches[0] : e;
        sx = p.clientX; sy = p.clientY;
        ix = this.container.offsetLeft; iy = this.container.offsetTop;
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchend', onEnd);
      };
      const onMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        const nx = ix + p.clientX - sx, ny = iy + p.clientY - sy;
        this.container.style.left = Math.min(Math.max(nx, 10), window.innerWidth-this.container.offsetWidth-10) + 'px';
        this.container.style.top = Math.min(Math.max(ny, 10), window.innerHeight-this.container.offsetHeight-10) + 'px';
      };
      const onEnd = () => {
        isDragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchend', onEnd);
      };
      hdr.addEventListener('mousedown', onStart);
      hdr.addEventListener('touchstart', onStart, { passive: false });
    }

    makeResizable() {
      const hnd = document.getElementById('resizeHandle');
      if (!hnd) return;
      let isResizing = false, sx, sy, iw, ih;
      const onStart = (e) => {
        isResizing = true;
        const p = e.touches ? e.touches[0] : e;
        sx = p.clientX; sy = p.clientY;
        iw = this.container.offsetWidth; ih = this.container.offsetHeight;
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchend', onEnd);
      };
      const onMove = (e) => {
        if (!isResizing) return;
        e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        const nw = iw - (p.clientX - sx), nh = ih + (p.clientY - sy);
        if (nw >= 320 && nw <= window.innerWidth-20) this.container.style.width = nw+'px';
        if (nh >= 200 && nh <= window.innerHeight-100) this.container.style.height = nh+'px';
      };
      const onEnd = () => {
        isResizing = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchend', onEnd);
      };
      hnd.addEventListener('mousedown', onStart);
      hnd.addEventListener('touchstart', onStart, { passive: false });
    }

    dispose() {
      if (this.player) { this.player.dispose(); this.player = null; }
      if (this.hls) { this.hls.destroy(); this.hls = null; }
    }
    escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
  }

  document.addEventListener('DOMContentLoaded', () => { window.chatApp = new ChatApp(); });
</script>

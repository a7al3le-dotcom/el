<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeoFox Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0f0f1a}
    #app{display:flex;flex-direction:column;height:100%;width:100%;background:#16162e;color:#fff}
    #auth{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;gap:20px;padding:20px;background:linear-gradient(135deg,#16162e,#2a1f4e)}
    #auth h1{font-size:2.2rem;background:linear-gradient(90deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
    #auth input{padding:14px 20px;border-radius:30px;border:2px solid #3a3a5a;background:#1e1e3a;color:#fff;font-size:1.1rem;width:280px;max-width:90%;outline:none;transition:.3s;text-align:center}
    #auth input:focus{border-color:#6c5ce7;box-shadow:0 0 20px rgba(108,92,231,0.3)}
    #auth button{padding:14px 50px;border-radius:30px;border:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:.3s;width:280px;max-width:90%}
    #auth button:hover{transform:scale(1.03);box-shadow:0 0 30px rgba(108,92,231,0.5)}
    #chat{display:none;flex-direction:column;height:100%;width:100%;background:#0f0f1a}
    #messages{flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;background:linear-gradient(180deg,#0f0f1a,#1a1a35)}
    #messages::-webkit-scrollbar{width:4px}
    #messages::-webkit-scrollbar-thumb{background:#6c5ce7;border-radius:10px}
    .msg{background:#25254a;padding:10px 16px;border-radius:16px;max-width:80%;word-wrap:break-word;align-self:flex-start;animation:fadeIn .2s;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
    .msg.own{background:linear-gradient(135deg,#6c5ce7,#8f7af0);align-self:flex-end}
    .msg-user{font-weight:bold;color:#b8a9ff;margin-right:6px;font-size:0.9rem}
    .msg-text{font-size:1rem;line-height:1.4}
    .msg-time{font-size:0.65rem;color:#888;margin-top:4px;text-align:right}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    #input-area{background:#16162e;padding:10px 16px 12px;border-top:1px solid #2a2a4a;display:flex;gap:10px;align-items:center;flex-shrink:0}
    #msgInput{flex:1;padding:12px 18px;border-radius:30px;border:2px solid #2a2a4a;background:#1a1a35;color:#fff;font-size:1rem;outline:none;transition:.3s}
    #msgInput:focus{border-color:#6c5ce7;box-shadow:0 0 15px rgba(108,92,231,0.2)}
    #msgInput::placeholder{color:#666}
    #sendBtn{padding:12px 28px;border-radius:30px;border:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;transition:.3s;white-space:nowrap}
    #sendBtn:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(108,92,231,0.4)}
    .info{display:none}
    #status{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#aaa;padding:6px 18px;border-radius:20px;font-size:0.8rem;pointer-events:none;z-index:10}
    .empty-state{color:#444;text-align:center;margin-top:40%;font-size:1.2rem}
  </style>
</head>
<body>
<div id="app">
  <div id="auth">
    <h1>💬 NeoFox</h1>
    <input type="text" id="username" placeholder="👤 اسم المستخدم" autocomplete="off" />
    <button id="loginBtn">🚀 دخول</button>
  </div>
  <div id="chat">
    <div id="messages"><div class="empty-state">✨ أهلاً بك! ابدأ المحادثة</div></div>
    <div id="input-area">
      <input type="text" id="msgInput" placeholder="✏️ اكتب رسالتك..." autocomplete="off" />
      <button id="sendBtn">📤 إرسال</button>
    </div>
    <div id="status">🟢 متصل</div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",authDomain:"gemiapp.firebaseapp.com",databaseURL:"https://gemiapp-default-rtdb.firebaseio.com",projectId:"gemiapp",storageBucket:"gemiapp.firebasestorage.app",messagingSenderId:"27673374613",appId:"1:27673374613:web:86f977ea41e8c0e2b0909c",measurementId:"G-G5XN8H9MG9"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const authDiv=document.getElementById('auth'),chatDiv=document.getElementById('chat'),usernameInput=document.getElementById('username'),loginBtn=document.getElementById('loginBtn'),msgInput=document.getElementById('msgInput'),sendBtn=document.getElementById('sendBtn'),messagesDiv=document.getElementById('messages'),statusDiv=document.getElementById('status');let currentUser='';let isFirstLoad=true;loginBtn.onclick=()=>{const name=usernameInput.value.trim();if(name){currentUser=name;authDiv.style.display='none';chatDiv.style.display='flex';loadMessages();msgInput.focus();statusDiv.textContent='🟢 متصل'}};usernameInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')loginBtn.click()});sendBtn.onclick=()=>{const text=msgInput.value.trim();if(text&&currentUser){db.ref('messages').push({user:currentUser,text:text,time:Date.now()});msgInput.value='';msgInput.focus()}};msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')sendBtn.click()});function loadMessages(){db.ref('messages').orderByChild('time').on('child_added',(snapshot)=>{const data=snapshot.val();if(isFirstLoad){messagesDiv.innerHTML='';isFirstLoad=false}const div=document.createElement('div');div.className='msg';if(data.user===currentUser)div.classList.add('own');const userSpan=document.createElement('span');userSpan.className='msg-user';userSpan.textContent=data.user+':';const textSpan=document.createElement('span');textSpan.className='msg-text';textSpan.textContent=' '+data.text;const timeSpan=document.createElement('div');timeSpan.className='msg-time';const d=new Date(data.time);timeSpan.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');div.appendChild(userSpan);div.appendChild(textSpan);div.appendChild(timeSpan);messagesDiv.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight})}
</script>
</body>
</html>

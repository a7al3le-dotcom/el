<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NeoFox Chat</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#1e1e2f;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}#app{width:420px;max-width:95%;background:#2a2a40;padding:20px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}#auth{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}#auth input{flex:1;padding:10px;border-radius:8px;border:none;background:#3a3a5a;color:#fff;min-width:120px}#auth input::placeholder{color:#aaa}button{padding:10px 20px;border:none;border-radius:8px;background:#6c5ce7;color:#fff;cursor:pointer;font-weight:700;transition:.2s}button:hover{background:#5a4bd1;transform:scale(1.02)}#chat{display:none;flex-direction:column;gap:10px}#messages{height:380px;overflow-y:auto;border-bottom:2px solid #444;padding:8px 4px;margin-bottom:4px;display:flex;flex-direction:column;gap:6px}#messages::-webkit-scrollbar{width:6px}#messages::-webkit-scrollbar-thumb{background:#6c5ce7;border-radius:4px}.msg{background:#3a3a5a;padding:8px 12px;border-radius:10px;max-width:85%;word-wrap:break-word;align-self:flex-start}.msg.own{background:#6c5ce7;align-self:flex-end}.msg-user{font-weight:700;color:#b8a9ff;margin-right:6px}#input-row{display:flex;gap:8px}#msgInput{flex:1;padding:10px;border-radius:8px;border:none;background:#3a3a5a;color:#fff}#msgInput::placeholder{color:#aaa}#sendBtn{background:#00b894}#sendBtn:hover{background:#00a381}.info{font-size:13px;color:#aaa;text-align:center;margin-top:6px}</style></head><body><div id="app"><div id="auth"><input type="text" id="username" placeholder="👤 اسم المستخدم"><button id="loginBtn">🚀 دخول</button></div><div id="chat"><div id="messages"></div><div id="input-row"><input type="text" id="msgInput" placeholder="✏️ اكتب رسالتك..."><button id="sendBtn">📤 إرسال</button></div><div class="info">💬 NeoFox · محادثة فورية</div></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",authDomain:"gemiapp.firebaseapp.com",databaseURL:"https://gemiapp-default-rtdb.firebaseio.com",projectId:"gemiapp",storageBucket:"gemiapp.firebasestorage.app",messagingSenderId:"27673374613",appId:"1:27673374613:web:86f977ea41e8c0e2b0909c",measurementId:"G-G5XN8H9MG9"};firebase.initializeApp(firebaseConfig);const db=firebase.database();const authDiv=document.getElementById('auth'),chatDiv=document.getElementById('chat'),usernameInput=document.getElementById('username'),loginBtn=document.getElementById('loginBtn'),msgInput=document.getElementById('msgInput'),sendBtn=document.getElementById('sendBtn'),messagesDiv=document.getElementById('messages');let currentUser='';loginBtn.onclick=()=>{const name=usernameInput.value.trim();if(name){currentUser=name;authDiv.style.display='none';chatDiv.style.display='flex';loadMessages();msgInput.focus();}};usernameInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')loginBtn.click();});sendBtn.onclick=()=>{const text=msgInput.value.trim();if(text&&currentUser){db.ref('messages').push({user:currentUser,text:text,time:Date.now()});msgInput.value='';msgInput.focus();}};msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')sendBtn.click();});function loadMessages(){messagesDiv.innerHTML='';db.ref('messages').orderByChild('time').on('child_added',(snapshot)=>{const data=snapshot.val();const div=document.createElement('div');div.className='msg';if(data.user===currentUser)div.classList.add('own');const userSpan=document.createElement('span');userSpan.className='msg-user';userSpan.textContent=data.user+':';const textSpan=document.createElement('span');textSpan.textContent=' '+data.text;div.appendChild(userSpan);div.appendChild(textSpan);messagesDiv.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight;});}</script></body></html>

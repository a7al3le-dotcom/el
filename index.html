<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeoFox Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0a0a12}
    #app{display:flex;flex-direction:column;height:100%;width:100%;background:#0a0a12;color:#e0e0e0}
    #auth{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;gap:20px;padding:20px;background:linear-gradient(135deg,#0a0a12,#1a1030)}
    #auth h1{font-size:2.5rem;background:linear-gradient(90deg,#7c6cf0,#b8a9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;letter-spacing:-1px}
    #auth input{padding:14px 24px;border-radius:30px;border:2px solid #2a2a4a;background:#12122a;color:#e0e0e0;font-size:1.1rem;width:300px;max-width:90%;outline:none;transition:.3s;text-align:center}
    #auth input:focus{border-color:#7c6cf0;box-shadow:0 0 30px rgba(124,108,240,0.15)}
    #auth button{padding:14px 50px;border-radius:30px;border:none;background:linear-gradient(135deg,#7c6cf0,#b8a9ff);color:#fff;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:.3s;width:300px;max-width:90%}
    #auth button:hover{transform:scale(1.03);box-shadow:0 0 40px rgba(124,108,240,0.3)}
    #chat{display:none;flex-direction:column;height:100%;width:100%;background:#0a0a12}
    #messages{flex:1;overflow-y:auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;background:#0a0a12}
    #messages::-webkit-scrollbar{width:3px}
    #messages::-webkit-scrollbar-thumb{background:#3a3a5a;border-radius:10px}
    .msg{padding:6px 12px;width:100%;display:flex;align-items:baseline;gap:8px;animation:fadeIn .15s;line-height:1.5;border-bottom:1px solid rgba(255,255,255,0.02)}
    .msg.own{background:transparent}
    .msg-user{font-weight:600;color:#8f7cf0;font-size:0.92rem;white-space:nowrap;min-width:fit-content}
    .msg-text{color:#e8e8e8;font-size:0.98rem;word-wrap:break-word;flex:1}
    .msg-time{font-size:0.6rem;color:#555;white-space:nowrap;margin-left:4px;font-weight:300}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    #input-area{background:#0f0f1a;padding:10px 16px 14px;border-top:1px solid #1a1a2e;display:flex;gap:10px;align-items:center;flex-shrink:0}
    #msgInput{flex:1;padding:12px 20px;border-radius:30px;border:2px solid #1a1a2e;background:#12122a;color:#e0e0e0;font-size:1rem;outline:none;transition:.3s}
    #msgInput:focus{border-color:#7c6cf0;box-shadow:0 0 20px rgba(124,108,240,0.1)}
    #msgInput::placeholder{color:#555}
    #sendBtn{padding:12px 32px;border-radius:30px;border:none;background:linear-gradient(135deg,#7c6cf0,#b8a9ff);color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;transition:.3s;white-space:nowrap}
    #sendBtn:hover{transform:scale(1.04);box-shadow:0 0 30px rgba(124,108,240,0.25)}
    #status{position:fixed;top:12px;right:16px;background:rgba(15,15,26,0.85);color:#7c6cf0;padding:4px 14px;border-radius:20px;font-size:0.7rem;border:1px solid #2a2a4a;backdrop-filter:blur(10px);z-index:20;font-weight:300;letter-spacing:0.3px;pointer-events:none}
    #status::before{content:"● ";color:#4ade80;font-size:0.6rem}
    .empty-state{color:#333;text-align:center;margin-top:35%;font-size:1.1rem;font-weight:300}
  </style>
</head>
<body>
<div id="app">
  <div id="auth">
    <h1>💬 NeoFox</h1>
    <input type="text" id="username" placeholder="👤 اسم المستخدم" autocomplete="off" />
    <button id="loginBtn">🚀 دخول</button>
  </div>
  <div id="chat">
    <div id="messages"><div class="empty-state">✨ أهلاً بك! ابدأ المحادثة</div></div>
    <div id="input-area">
      <input type="text" id="msgInput" placeholder="✏️ اكتب رسالتك..." autocomplete="off" />
      <button id="sendBtn">📤 إرسال</button>
    </div>
    <div id="status">متصل</div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",authDomain:"gemiapp.firebaseapp.com",databaseURL:"https://gemiapp-default-rtdb.firebaseio.com",projectId:"gemiapp",storageBucket:"gemiapp.firebasestorage.app",messagingSenderId:"27673374613",appId:"1:27673374613:web:86f977ea41e8c0e2b0909c",measurementId:"G-G5XN8H9MG9"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const authDiv=document.getElementById('auth'),chatDiv=document.getElementById('chat'),usernameInput=document.getElementById('username'),loginBtn=document.getElementById('loginBtn'),msgInput=document.getElementById('msgInput'),sendBtn=document.getElementById('sendBtn'),messagesDiv=document.getElementById('messages'),statusDiv=document.getElementById('status');let currentUser='';let isFirstLoad=true;loginBtn.onclick=()=>{const name=usernameInput.value.trim();if(name){currentUser=name;authDiv.style.display='none';chatDiv.style.display='flex';loadMessages();msgInput.focus();statusDiv.textContent=' متصل'}};usernameInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')loginBtn.click()});sendBtn.onclick=()=>{const text=msgInput.value.trim();if(text&&currentUser){db.ref('messages').push({user:currentUser,text:text,time:Date.now()});msgInput.value='';msgInput.focus()}};msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')sendBtn.click()});function loadMessages(){db.ref('messages').orderByChild('time').on('child_added',(snapshot)=>{const data=snapshot.val();if(isFirstLoad){messagesDiv.innerHTML='';isFirstLoad=false}const div=document.createElement('div');div.className='msg';if(data.user===currentUser)div.classList.add('own');const userSpan=document.createElement('span');userSpan.className='msg-user';userSpan.textContent=data.user+':';const textSpan=document.createElement('span');textSpan.className='msg-text';textSpan.textContent=' '+data.text;const timeSpan=document.createElement('span');timeSpan.className='msg-time';if(data.time){const d=new Date(data.time);const hours=d.getHours().toString().padStart(2,'0');const mins=d.getMinutes().toString().padStart(2,'0');timeSpan.textContent=hours+':'+mins;}else{timeSpan.textContent='--:--'}div.appendChild(userSpan);div.appendChild(textSpan);div.appendChild(timeSpan);messagesDiv.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight})}
</script>
</body>
</html>

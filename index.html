<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دردشة فورية - Gemiapp</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

    <style>
        /* ===== التنسيقات العامة ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0e17;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* ===== حاوية التطبيق الرئيسية ===== */
        #app {
            width: 100%;
            max-width: 520px;
            height: 95vh;
            max-height: 800px;
            background: #121926;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border: 1px solid #1e2a3a;
        }

        /* ===== شاشة تسجيل الدخول ===== */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px 30px;
            gap: 18px;
            background: linear-gradient(145deg, #121926, #0d1624);
        }

        #login-screen .logo {
            font-size: 48px;
            margin-bottom: 5px;
        }

        #login-screen h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        #login-screen .subtitle {
            color: #8892a8;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #login-screen input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid #1e2a3a;
            background: #0d1624;
            color: #e6edf3;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        #login-screen input:focus {
            border-color: #2d7aff;
        }

        #login-screen input::placeholder {
            color: #4a5a72;
        }

        #login-error {
            color: #f85149;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            width: 100%;
        }

        #login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2d7aff, #1a5cdb);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
        }

        #login-btn:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(45, 122, 255, 0.35);
        }

        #login-btn:active {
            transform: scale(0.97);
        }

        .toggle-link {
            color: #6a8bb0;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
            margin-top: 5px;
        }

        .toggle-link:hover {
            color: #2d7aff;
        }

        /* ===== واجهة الدردشة ===== */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        /* ===== رأس التطبيق ===== */
        #header {
            padding: 16px 20px;
            background: #0f1729;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2a3a;
            flex-shrink: 0;
        }

        #header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #header .online-dot {
            width: 10px;
            height: 10px;
            background: #2ea043;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        #header h2 {
            color: #f0f6fc;
            font-size: 18px;
            font-weight: 600;
        }

        #header .room-badge {
            background: #1e2a3a;
            color: #8b9bb5;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 500;
        }

        #logout-btn {
            background: transparent;
            color: #8b9bb5;
            border: 1px solid #2a3a52;
            padding: 7px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            font-weight: 500;
        }

        #logout-btn:hover {
            background: #f85149;
            color: white;
            border-color: #f85149;
        }

        /* ===== منطقة عرض الرسائل ===== */
        #messages {
            flex: 1;
            padding: 16px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0a0e17;
        }

        /* تخصيص شريط التمرير */
        #messages::-webkit-scrollbar {
            width: 4px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #2a3a52;
            border-radius: 10px;
        }

        /* ===== الرسالة الواحدة ===== */
        .msg {
            max-width: 82%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeInUp 0.25s ease;
            position: relative;
        }

        .msg.self {
            background: linear-gradient(135deg, #1a5cdb, #2d7aff);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.other {
            background: #1a2538;
            color: #e6edf3;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg .sender {
            font-size: 11px;
            font-weight: 600;
            color: #8b9bb5;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg.self .sender {
            color: #a8c8ff;
        }

        .msg .sender .badge {
            background: #2d7aff;
            color: white;
            font-size: 8px;
            padding: 1px 8px;
            border-radius: 30px;
            font-weight: 700;
        }

        .msg .text {
            margin-bottom: 4px;
        }

        .msg .timestamp {
            font-size: 10px;
            color: #6a7a92;
            text-align: left;
            margin-top: 2px;
        }

        .msg.self .timestamp {
            color: #8ab0ff;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== رسالة "لا توجد رسائل" ===== */
        .empty-state {
            color: #3a4a62;
            text-align: center;
            font-size: 14px;
            margin-top: 40px;
            user-select: none;
        }

        .empty-state span {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== منطقة الإدخال ===== */
        #input-area {
            padding: 12px 16px 16px;
            background: #0f1729;
            border-top: 1px solid #1a2538;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        #msg-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid #1e2a3a;
            background: #0a0e17;
            color: #e6edf3;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        #msg-input:focus {
            border-color: #2d7aff;
        }

        #msg-input::placeholder {
            color: #4a5a72;
        }

        #send-btn {
            background: linear-gradient(135deg, #2d7aff, #1a5cdb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: 80px;
        }

        #send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(45, 122, 255, 0.4);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== إشعار الكتابة ===== */
        #typing-indicator {
            color: #4a5a72;
            font-size: 12px;
            padding: 4px 18px 0;
            min-height: 22px;
            font-style: italic;
        }

        /* ===== توافق مع الشاشات الصغيرة ===== */
        @media (max-width: 480px) {
            #app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            #login-screen {
                padding: 30px 20px;
            }
            #header h2 {
                font-size: 15px;
            }
            .msg {
                max-width: 90%;
                font-size: 13px;
                padding: 8px 13px;
            }
            #send-btn {
                padding: 10px 16px;
                font-size: 13px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- ========================================================== -->
    <!-- ===== شاشة تسجيل الدخول ===== -->
    <!-- ========================================================== -->
    <div id="login-screen">
        <div class="logo">💬</div>
        <h1>Gemiapp Chat</h1>
        <p class="subtitle">تواصل مع أصدقائك لحظيًا</p>

        <input type="email" id="login-email" placeholder="البريد الإلكتروني" autocomplete="email" />
        <input type="password" id="login-password" placeholder="كلمة المرور" autocomplete="current-password" />

        <div id="login-error"></div>

        <button id="login-btn">🚀 تسجيل الدخول</button>

        <span class="toggle-link" id="toggle-register">📝 ليس لديك حساب؟ سجل الآن</span>
    </div>

    <!-- ========================================================== -->
    <!-- ===== واجهة الدردشة ===== -->
    <!-- ========================================================== -->
    <div id="chat-screen">
        <!-- رأس التطبيق -->
        <div id="header">
            <div class="left">
                <span class="online-dot"></span>
                <h2>الدردشة العامة</h2>
                <span class="room-badge">#general</span>
            </div>
            <button id="logout-btn">🚪 خروج</button>
        </div>

        <!-- منطقة الرسائل -->
        <div id="messages">
            <!-- سيتم إدراج الرسائل هنا بواسطة JavaScript -->
        </div>

        <!-- مؤشر الكتابة -->
        <div id="typing-indicator"></div>

        <!-- منطقة الإدخال -->
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." maxlength="500" />
            <button id="send-btn">إرسال</button>
        </div>
    </div>
</div>

<!-- ========================================================== -->
<!-- ===== جافا سكريبت ===== -->
<!-- ========================================================== -->
<script>
    // =============================================================
    // 1. إعدادات Firebase (تم إدخال مفاتيحك)
    // =============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",
        authDomain: "gemiapp.firebaseapp.com",
        databaseURL: "https://gemiapp-default-rtdb.firebaseio.com",
        projectId: "gemiapp",
        storageBucket: "gemiapp.firebasestorage.app",
        messagingSenderId: "27673374613",
        appId: "1:27673374613:web:86f977ea41e8c0e2b0909c",
        measurementId: "G-G5XN8H9MG9"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); // قاعدة البيانات
    const auth = firebase.auth();   // المصادقة

    // =============================================================
    // 2. عناصر الصفحة (DOM)
    // =============================================================
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const toggleRegister = document.getElementById('toggle-register');
    const logoutBtn = document.getElementById('logout-btn');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    // =============================================================
    // 3. متغيرات الحالة
    // =============================================================
    let isRegisterMode = false;          // true = وضع إنشاء حساب
    let currentUser = null;             // بيانات المستخدم المسجل
    let unsubscribeMessages = null;     // لإلغاء الاستماع للرسائل
    let typingTimeout = null;           // مؤقت إشعار الكتابة
    let isTyping = false;              // منع تكرار الإشعارات

    // =============================================================
    // 4. دوال المصادقة (تسجيل الدخول / إنشاء حساب)
    // =============================================================

    /**
     * دالة تسجيل الدخول أو إنشاء حساب جديد
     */
    async function handleAuth() {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();

        // التحقق من صحة الإدخال
        if (!email) {
            loginError.textContent = '⚠️ الرجاء إدخال البريد الإلكتروني';
            return;
        }
        if (!password || password.length < 6) {
            loginError.textContent = '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            return;
        }

        try {
            if (isRegisterMode) {
                // إنشاء حساب جديد
                await auth.createUserWithEmailAndPassword(email, password);
            } else {
                // تسجيل الدخول
                await auth.signInWithEmailAndPassword(email, password);
            }
            // في حال النجاح، سيتم تفعيل onAuthStateChanged تلقائيًا
        } catch (error) {
            // عرض رسائل الخطأ بلغة مفهومة
            let msg = error.message;
            if (msg.includes('user-not-found')) msg = '❌ هذا البريد غير مسجل';
            else if (msg.includes('wrong-password')) msg = '❌ كلمة المرور خاطئة';
            else if (msg.includes('email-already-in-use')) msg = '❌ هذا البريد مسجل مسبقًا';
            else if (msg.includes('weak-password')) msg = '❌ كلمة المرور ضعيفة جدًا';
            else if (msg.includes('invalid-email')) msg = '❌ البريد الإلكتروني غير صحيح';
            loginError.textContent = msg;
        }
    }

    /**
     * التبديل بين وضع تسجيل الدخول ووضع إنشاء حساب
     */
    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        loginBtn.textContent = isRegisterMode ? '✨ إنشاء حساب' : '🚀 تسجيل الدخول';
        toggleRegister.textContent = isRegisterMode ?
            '🔙 لدي حساب؟ سجل دخول' :
            '📝 ليس لديك حساب؟ سجل الآن';
        loginError.textContent = '';
    }

    // ربط الأحداث
    loginBtn.addEventListener('click', handleAuth);
    loginPassword.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleAuth();
    });
    toggleRegister.addEventListener('click', toggleAuthMode);

    // =============================================================
    // 5. مراقبة حالة تسجيل الدخول
    // =============================================================

    auth.onAuthStateChanged((user) => {
        if (user) {
            // المستخدم مسجل دخول
            currentUser = user;
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            loginEmail.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
            // بدء الاستماع للرسائل
            listenToMessages();
            // إظهار رسالة ترحيب في منطقة الرسائل
            showWelcomeMessage();
        } else {
            // المستخدم خارج
            currentUser = null;
            loginScreen.style.display = 'flex';
            chatScreen.style.display = 'none';
            messagesDiv.innerHTML = '';
            // إلغاء الاستماع للرسائل
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
        }
    });

    // =============================================================
    // 6. تسجيل الخروج
    // =============================================================

    logoutBtn.addEventListener('click', () => {
        auth.signOut();
    });

    // =============================================================
    // 7. دوال إدارة الرسائل
    // =============================================================

    /**
     * عرض رسالة ترحيب عند الدخول لأول مرة
     */
    function showWelcomeMessage() {
        if (messagesDiv.children.length === 0) {
            const welcome = document.createElement('div');
            welcome.className = 'empty-state';
            welcome.innerHTML = `
                <span>👋</span>
                مرحبًا ${currentUser.email.split('@')[0]}<br />
                <small style="color:#3a4a62;">أرسل أول رسالة الآن</small>
            `;
            messagesDiv.appendChild(welcome);
        }
    }

    /**
     * بدء الاستماع للرسائل من Firestore في الوقت الفعلي
     */
    function listenToMessages() {
        // إلغاء الاستماع السابق إن وجد
        if (unsubscribeMessages) {
            unsubscribeMessages();
            unsubscribeMessages = null;
        }

        // ترتيب الرسائل حسب الوقت (الأقدم أولاً)
        const query = db.collection('messages')
            .orderBy('timestamp', 'asc')
            .limit(200);

        // الاستماع للتغييرات
        unsubscribeMessages = query.onSnapshot((snapshot) => {
            // حذف رسالة الترحيب إن وجدت
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            // معالجة الرسائل الجديدة فقط
            snapshot.docChanges().forEach((change) => {
                if (change.type === 'added') {
                    const data = change.doc.data();
                    // التأكد من وجود بيانات صحيحة
                    if (data && data.text) {
                        appendMessage(data);
                    }
                }
            });

            // التمرير إلى أحدث رسالة
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

        }, (error) => {
            console.error('خطأ في الاستماع للرسائل:', error);
        });
    }

    /**
     * إضافة رسالة جديدة إلى الواجهة
     */
    function appendMessage(data) {
        const div = document.createElement('div');

        // تحديد نوع الرسالة (خاصة بي أو لشخص آخر)
        const isSelf = data.uid === currentUser?.uid;
        div.className = `msg ${isSelf ? 'self' : 'other'}`;

        // اسم المرسل
        const senderDiv = document.createElement('div');
        senderDiv.className = 'sender';
        const displayName = data.displayName || data.name || 'مجهول';
        senderDiv.innerHTML = `
            ${displayName}
            ${isSelf ? '<span class="badge">أنت</span>' : ''}
        `;

        // نص الرسالة
        const textDiv = document.createElement('div');
        textDiv.className = 'text';
        textDiv.textContent = data.text;

        // الوقت
        const timeDiv = document.createElement('div');
        timeDiv.className = 'timestamp';
        if (data.timestamp) {
            const date = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
            timeDiv.textContent = date.toLocaleTimeString('ar-EG', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // تجميع العناصر
        div.appendChild(senderDiv);
        div.appendChild(textDiv);
        div.appendChild(timeDiv);
        messagesDiv.appendChild(div);
    }

    // =============================================================
    // 8. إرسال رسالة جديدة
    // =============================================================

    async function sendMessage() {
        const text = msgInput.value.trim();

        // التحقق من وجود مستخدم ونص
        if (!currentUser) {
            alert('الرجاء تسجيل الدخول أولاً');
            return;
        }
        if (!text) {
            msgInput.focus();
            return;
        }
        if (text.length > 500) {
            alert('الرسالة طويلة جدًا (الحد الأقصى 500 حرف)');
            return;
        }

        // تعطيل الزر مؤقتًا لمنع الإرسال المتكرر
        sendBtn.disabled = true;

        try {
            // إضافة الرسالة إلى Firestore
            await db.collection('messages').add({
                text: text,
                uid: currentUser.uid,
                displayName: currentUser.email?.split('@')[0] || 'مستخدم',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            // تفريغ حقل الإدخال
            msgInput.value = '';
            msgInput.focus();

        } catch (error) {
            console.error('فشل الإرسال:', error);
            alert('حدث خطأ أثناء الإرسال. حاول مرة أخرى.');
        } finally {
            sendBtn.disabled = false;
        }
    }

    // ربط أزرار الإرسال
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // =============================================================
    // 9. إشعار الكتابة (Typing Indicator)
    // =============================================================

    msgInput.addEventListener('input', () => {
        if (!currentUser) return;

        // إظهار مؤشر الكتابة للمستخدم الحالي
        if (!isTyping && msgInput.value.length > 0) {
            isTyping = true;
            // يمكن إضافة منطق لإرسال حالة الكتابة إلى Firebase هنا
            // (تم حذفه للتبسيط، لكن يمكن إضافته)
        }

        // إعادة ضبط المؤقت عند التوقف عن الكتابة
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            isTyping = false;
            typingIndicator.textContent = '';
        }, 2000);

        // عرض "يكتب..." في المؤشر (محليًا)
        if (msgInput.value.length > 0) {
            typingIndicator.textContent = '✍️ جاري الكتابة...';
        } else {
            typingIndicator.textContent = '';
        }
    });

    // =============================================================
    // 10. تحذير المستخدم بإعدادات الخصوصية
    // =============================================================

    // عرض رسالة في الكونسول لتذكير المطور
    console.log('✅ تطبيق الدردشة يعمل بنجاح!');
    console.log('📌 المستخدم الحالي:', currentUser?.email || 'غير مسجل');

    // =============================================================
    // 11. معالجة الأخطاء العامة
    // =============================================================

    // التقاط أي خطأ غير متوقع
    window.addEventListener('unhandledrejection', (event) => {
        console.error('خطأ غير متوقع:', event.reason);
    });

    // =============================================================
    // نهاية الكود
    // =============================================================
</script>

</body>
</html>

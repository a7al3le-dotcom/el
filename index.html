<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeoFox Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0a0a12}
    #app{display:flex;flex-direction:column;height:100%;width:100%;background:#0a0a12;color:#e0e0e0}
    #auth{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;gap:20px;padding:20px;background:linear-gradient(135deg,#0a0a12,#1a1030)}
    #auth h1{font-size:2.5rem;background:linear-gradient(90deg,#7c6cf0,#b8a9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;letter-spacing:-1px}
    #auth input{padding:14px 24px;border-radius:30px;border:2px solid #2a2a4a;background:#12122a;color:#e0e0e0;font-size:1.1rem;width:300px;max-width:90%;outline:none;transition:.3s;text-align:center}
    #auth input:focus{border-color:#7c6cf0;box-shadow:0 0 30px rgba(124,108,240,0.15)}
    #auth button{padding:14px 50px;border-radius:30px;border:none;background:linear-gradient(135deg,#7c6cf0,#b8a9ff);color:#fff;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:.3s;width:300px;max-width:90%}
    #auth button:hover{transform:scale(1.03);box-shadow:0 0 40px rgba(124,108,240,0.3)}
    #chat{display:none;flex-direction:column;height:100%;width:100%;background:#0a0a12}
    #top-bar{background:#0f0f1a;padding:8px 16px;border-bottom:1px solid #1a1a2e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:48px;position:relative;z-index:50}
    #online-btn{background:transparent;border:1px solid #2a2a4a;color:#7c6cf0;padding:4px 14px;border-radius:20px;cursor:pointer;font-size:0.8rem;transition:.3s;position:relative}
    #online-btn:hover{background:#1a1a2e;border-color:#7c6cf0}
    #online-btn .count{background:#7c6cf0;color:#fff;border-radius:50%;padding:0 6px;font-size:0.7rem;margin-left:4px}
    #online-popup{display:none;position:absolute;top:50px;right:16px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:12px 16px;min-width:200px;max-height:300px;overflow-y:auto;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,0.8)}
    #online-popup.show{display:block}
    #online-popup::-webkit-scrollbar{width:3px}
    #online-popup::-webkit-scrollbar-thumb{background:#3a3a5a;border-radius:10px}
    #online-popup h4{color:#888;font-size:0.8rem;margin-bottom:8px;font-weight:400;border-bottom:1px solid #2a2a4a;padding-bottom:6px}
    #online-popup .user-item{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:0.9rem;color:#ddd;border-bottom:1px solid rgba(255,255,255,0.03)}
    #online-popup .user-item:last-child{border-bottom:none}
    #online-popup .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:#4ade80;box-shadow:0 0 12px rgba(74,222,128,0.6)}
    #online-popup .user-name{flex:1;font-weight:500}
    #online-popup .status-text{font-size:0.6rem;color:#4ade80;padding:2px 8px;border-radius:10px;background:rgba(74,222,128,0.1)}
    #messages{flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;background:#0a0a12}
    #messages::-webkit-scrollbar{width:3px}
    #messages::-webkit-scrollbar-thumb{background:#3a3a5a;border-radius:10px}
    .msg{padding:6px 12px;width:100%;display:flex;align-items:baseline;gap:6px;animation:fadeIn .15s;line-height:1.5;border-bottom:1px solid rgba(255,255,255,0.02);position:relative}
    .msg.own{background:transparent}
    .msg-user{font-weight:600;color:#8f7cf0;font-size:0.92rem;white-space:nowrap;min-width:fit-content}
    .msg-text{color:#e8e8e8;font-size:0.98rem;word-wrap:break-word;flex:1}
    .msg-time{font-size:0.6rem;color:#555;white-space:nowrap;margin-left:4px;font-weight:300}
    .msg-status{font-size:0.55rem;color:#555;margin-left:4px}
    .msg-status.seen{color:#4ade80}
    .msg-status.delivered{color:#888}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    #typing-indicator{font-size:0.75rem;color:#7c6cf0;padding:2px 16px 6px;min-height:22px;font-style:italic;background:#0a0a12}
    #input-area{background:#0f0f1a;padding:8px 12px 12px;border-top:1px solid #1a1a2e;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;position:relative;z-index:50}
    #emoji-btn{background:transparent;border:none;font-size:1.4rem;cursor:pointer;padding:4px 6px;color:#888;transition:.2s}
    #emoji-btn:hover{color:#7c6cf0;transform:scale(1.1)}
    #emoji-picker{display:none;position:absolute;bottom:70px;left:12px;background:#1a1a2e;border-radius:12px;padding:10px;border:1px solid #2a2a4a;z-index:100;max-width:280px;max-height:200px;overflow-y:auto;flex-wrap:wrap;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
    #emoji-picker.show{display:flex}
    #emoji-picker span{font-size:1.5rem;cursor:pointer;padding:4px 6px;border-radius:6px;transition:.2s}
    #emoji-picker span:hover{background:#2a2a4a;transform:scale(1.15)}
    #msgInput{flex:1;padding:10px 16px;border-radius:30px;border:2px solid #1a1a2e;background:#12122a;color:#e0e0e0;font-size:1rem;outline:none;transition:.3s;min-width:120px}
    #msgInput:focus{border-color:#7c6cf0;box-shadow:0 0 20px rgba(124,108,240,0.1)}
    #msgInput::placeholder{color:#555}
    #sendBtn{padding:10px 24px;border-radius:30px;border:none;background:linear-gradient(135deg,#7c6cf0,#b8a9ff);color:#fff;font-weight:bold;font-size:0.95rem;cursor:pointer;transition:.3s;white-space:nowrap}
    #sendBtn:hover{transform:scale(1.04);box-shadow:0 0 30px rgba(124,108,240,0.25)}
    .empty-state{color:#333;text-align:center;margin-top:30%;font-size:1.1rem;font-weight:300}
  </style>
</head>
<body>
<div id="app">
  <div id="auth">
    <h1>💬 NeoFox</h1>
    <input type="text" id="username" placeholder="👤 اسم المستخدم" autocomplete="off" />
    <button id="loginBtn">🚀 دخول</button>
  </div>
  <div id="chat">
    <div id="top-bar">
      <div style="font-size:0.9rem;color:#888;">💬 المحادثة العامة</div>
      <button id="online-btn">🟢 المتصلون <span id="online-count" class="count">0</span></button>
      <div id="online-popup">
        <h4>👥 المتصلون الآن</h4>
        <div id="online-list"></div>
      </div>
    </div>
    <div id="messages"><div class="empty-state">✨ أهلاً بك! ابدأ المحادثة</div></div>
    <div id="typing-indicator"></div>
    <div id="input-area">
      <button id="emoji-btn">😊</button>
      <div id="emoji-picker"></div>
      <input type="text" id="msgInput" placeholder="✏️ اكتب رسالتك..." autocomplete="off" />
      <button id="sendBtn">📤 إرسال</button>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",authDomain:"gemiapp.firebaseapp.com",databaseURL:"https://gemiapp-default-rtdb.firebaseio.com",projectId:"gemiapp",storageBucket:"gemiapp.firebasestorage.app",messagingSenderId:"27673374613",appId:"1:27673374613:web:86f977ea41e8c0e2b0909c",measurementId:"G-G5XN8H9MG9"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const authDiv=document.getElementById('auth'),chatDiv=document.getElementById('chat'),usernameInput=document.getElementById('username'),loginBtn=document.getElementById('loginBtn'),msgInput=document.getElementById('msgInput'),sendBtn=document.getElementById('sendBtn'),messagesDiv=document.getElementById('messages'),onlineBtn=document.getElementById('online-btn'),onlinePopup=document.getElementById('online-popup'),onlineList=document.getElementById('online-list'),onlineCount=document.getElementById('online-count'),typingIndicator=document.getElementById('typing-indicator'),emojiBtn=document.getElementById('emoji-btn'),emojiPicker=document.getElementById('emoji-picker');let currentUser='';let isFirstLoad=true;const emojis=['😊','😂','❤️','🔥','👍','👏','😍','🤩','😎','🤔','🙏','💪','🎉','✨','🌟','💯','🤗','😘','🥰','😁','🤣','😅','😄','🙃','😉','😇','🥺','😢','😭','😤','😡','🤬','🤯','🥳','🤪','😜','😝','🤑','🤓','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥶','🥵','🤢','🤮','🤧','🤕','🤒','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾'];function renderEmojis(){emojiPicker.innerHTML='';emojis.forEach(e=>{const span=document.createElement('span');span.textContent=e;span.onclick=()=>{msgInput.value+=e;emojiPicker.classList.remove('show');msgInput.focus()};emojiPicker.appendChild(span)})}renderEmojis();emojiBtn.onclick=(e)=>{e.stopPropagation();emojiPicker.classList.toggle('show')};document.addEventListener('click',()=>{emojiPicker.classList.remove('show')});onlineBtn.onclick=(e)=>{e.stopPropagation();onlinePopup.classList.toggle('show')};document.addEventListener('click',()=>{onlinePopup.classList.remove('show')});loginBtn.onclick=()=>{const name=usernameInput.value.trim();if(name){currentUser=name;authDiv.style.display='none';chatDiv.style.display='flex';loadMessages();trackOnline();trackTyping();msgInput.focus()}};usernameInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')loginBtn.click()});sendBtn.onclick=()=>{const text=msgInput.value.trim();if(text&&currentUser){db.ref('messages').push({user:currentUser,text:text,time:Date.now(),status:'delivered'});msgInput.value='';msgInput.focus()}};msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')sendBtn.click()});let typingTimeout;msgInput.addEventListener('input',()=>{if(currentUser){db.ref('typing/'+currentUser).set(true);clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{db.ref('typing/'+currentUser).remove()},2000)}});function trackTyping(){db.ref('typing').on('value',(snapshot)=>{const data=snapshot.val();const typingUsers=[];for(let key in data){if(key!==currentUser&&data[key]===true){typingUsers.push(key)}}if(typingUsers.length>0){typingIndicator.textContent='✏️ '+typingUsers.join(', ')+' يكتب...'}else{typingIndicator.textContent=''}})}function trackOnline(){const userRef=db.ref('users/'+currentUser);db.ref('.info/connected').on('value',(snap)=>{if(snap.val()){userRef.set({online:true,lastSeen:Date.now()});userRef.onDisconnect().set({online:false,lastSeen:Date.now()})}});db.ref('users').on('value',(snapshot)=>{const data=snapshot.val();let onlineCountNum=0;let html='';if(data){for(let key in data){if(key!==currentUser){const isOnline=data[key].online;if(isOnline){onlineCountNum++;html+=`<div class="user-item"><span class="dot"></span><span class="user-name">${key}</span><span class="status-text">🟢 متصل</span></div>`}}}}if(html===''){html='<div style="color:#555;font-size:0.8rem;padding:8px 0;text-align:center;">لا يوجد متصلون حالياً</div>'}onlineCount.textContent=onlineCountNum;if(onlineCountNum>0){onlineBtn.style.borderColor='#4ade80';onlineBtn.style.color='#4ade80'}else{onlineBtn.style.borderColor='#2a2a4a';onlineBtn.style.color='#7c6cf0'}onlineList.innerHTML=html})}function loadMessages(){db.ref('messages').orderByChild('time').on('child_added',(snapshot)=>{const data=snapshot.val();const msgId=snapshot.key;if(isFirstLoad){messagesDiv.innerHTML='';isFirstLoad=false}const div=document.createElement('div');div.className='msg';if(data.user===currentUser)div.classList.add('own');const userSpan=document.createElement('span');userSpan.className='msg-user';userSpan.textContent=data.user+':';const textSpan=document.createElement('span');textSpan.className='msg-text';textSpan.textContent=' '+data.text;const timeSpan=document.createElement('span');timeSpan.className='msg-time';if(data.time){const d=new Date(data.time);timeSpan.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}else{timeSpan.textContent='--:--'}const statusSpan=document.createElement('span');statusSpan.className='msg-status';if(data.user===currentUser){if(data.status==='seen'){statusSpan.textContent='✓✓';statusSpan.className='msg-status seen'}else{statusSpan.textContent='✓';statusSpan.className='msg-status delivered'}}else{statusSpan.textContent=''}div.appendChild(userSpan);div.appendChild(textSpan);div.appendChild(timeSpan);div.appendChild(statusSpan);messagesDiv.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight;if(data.user!==currentUser){db.ref('messages/'+msgId+'/status').set('seen')}})}
</script>
</body>
</html>

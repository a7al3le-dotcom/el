<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16162e" />
  <title>NeoFox Chat</title>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #16162e;
      --bg-tertiary: #1e1e3a;
      --bg-message: #25254a;
      --text-primary: #ffffff;
      --text-secondary: #b8a9ff;
      --text-muted: #888888;
      --accent-primary: #6c5ce7;
      --accent-secondary: #a29bfe;
      --border-color: #2a2a4a;
      --danger: #ff6b6b;
      --success: #51cf66;
      --warning: #ffd43b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: var(--bg-secondary);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* Authentication Screen */
    #auth {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      gap: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #16162e, #2a1f4e);
    }

    #auth h1 {
      font-size: clamp(2rem, 8vw, 2.5rem);
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-align: center;
    }

    #auth .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: -10px;
      margin-bottom: 10px;
      text-align: center;
    }

    #auth input {
      padding: 14px 20px;
      border-radius: 30px;
      border: 2px solid #3a3a5a;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 1.1rem;
      width: min(280px, 90%);
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    #auth input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
    }

    #auth input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #auth button {
      padding: 14px 50px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      width: min(280px, 90%);
      min-height: 48px;
      touch-action: manipulation;
    }

    #auth button:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(108, 92, 231, 0.5);
    }

    #auth button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .auth-error {
      color: var(--danger);
      font-size: 0.9rem;
      text-align: center;
      min-height: 24px;
      max-width: 280px;
      word-wrap: break-word;
    }

    /* Chat Screen */
    #chat {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: var(--bg-primary);
    }

    .chat-header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 60px;
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .chat-header-title .logo {
      font-size: 1.5rem;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .online-users-badge {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 36px;
      touch-action: manipulation;
    }

    .logout-btn:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* Messages Container */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: linear-gradient(180deg, #0f0f1a, #1a1a35);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #messages::-webkit-scrollbar {
      width: 4px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 10px;
    }

    .msg {
      background: var(--bg-message);
      padding: 10px 16px;
      border-radius: 16px;
      max-width: min(80%, 500px);
      word-wrap: break-word;
      align-self: flex-start;
      animation: fadeIn 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .msg.own {
      background: linear-gradient(135deg, var(--accent-primary), #8f7af0);
      align-self: flex-end;
    }

    .msg-user {
      font-weight: bold;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-size: 0.85rem;
    }

    .msg.own .msg-user {
      color: rgba(255, 255, 255, 0.9);
    }

    .msg-text {
      font-size: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .msg.own .msg-meta {
      color: rgba(255, 255, 255, 0.7);
      justify-content: flex-start;
    }

    .msg-time {
      font-size: inherit;
    }

    .msg-read-status {
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .msg-read-status.delivered {
      color: var(--text-muted);
    }

    .msg-read-status.seen {
      color: #4dabf7;
    }

    .msg-read-status.sending {
      color: var(--warning);
    }

    .msg-read-status.failed {
      color: var(--danger);
      cursor: pointer;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg {
        animation: none;
      }
      #messages {
        scroll-behavior: auto;
      }
    }

    /* Empty State */
    .empty-state {
      color: #444;
      text-align: center;
      margin: auto;
      font-size: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      opacity: 0.5;
    }

    /* Loading Indicator */
    .loading-indicator {
      text-align: center;
      padding: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .loading-indicator.hidden {
      display: none;
    }

    /* New Messages Indicator */
    .new-messages-indicator {
      position: sticky;
      bottom: 12px;
      align-self: center;
      background: var(--accent-primary);
      color: white;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
      animation: pulse 2s infinite;
      border: none;
      touch-action: manipulation;
      z-index: 5;
    }

    .new-messages-indicator:hover {
      animation: none;
      box-shadow: 0 6px 16px rgba(108, 92, 231, 0.6);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    /* Typing Indicator */
    #typing-indicator {
      padding: 4px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
      min-height: 24px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      margin-inline-start: 8px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-6px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-dots span {
        animation: none;
      }
    }

    /* Input Area */
    #input-area {
      background: var(--bg-secondary);
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      padding-bottom: max(12px, var(--safe-bottom));
    }

    #msgInput {
      flex: 1;
      padding: 12px 18px;
      border-radius: 30px;
      border: 2px solid var(--border-color);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      min-height: 48px;
      touch-action: manipulation;
    }

    #msgInput:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 15px rgba(108, 92, 231, 0.2);
    }

    #msgInput::placeholder {
      color: #666;
    }

    .emoji-btn,
    #sendBtn {
      padding: 12px 20px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      min-height: 48px;
      touch-action: manipulation;
    }

    .emoji-btn {
      background: var(--bg-tertiary);
      font-size: 1.5rem;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-btn:hover {
      background: #2a2a4a;
    }

    #sendBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(108, 92, 231, 0.4);
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Emoji Picker */
    #emoji-picker {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 16px;
      right: 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
      z-index: 100;
      max-height: 300px;
      overflow-y: auto;
    }

    #emoji-picker.active {
      display: block;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 8px;
    }

    .emoji-item {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s;
      touch-action: manipulation;
      min-height: 40px;
    }

    .emoji-item:hover {
      background: rgba(108, 92, 231, 0.2);
    }

    /* Connection Status */
    #status {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #aaa;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    #status.connected {
      color: var(--success);
    }

    #status.disconnected {
      color: var(--danger);
    }

    #status.reconnecting {
      color: var(--warning);
    }

    /* Online Users Panel */
    #online-users-panel {
      display: none;
      position: fixed;
      top: 60px;
      left: 16px;
      right: 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 50;
      max-height: 300px;
      overflow-y: auto;
    }

    #online-users-panel.active {
      display: block;
    }

    .online-user-item {
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .online-user-item:hover {
      background: rgba(108, 92, 231, 0.1);
    }

    .online-user-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Notifications */
    #notification-container {
      position: fixed;
      top: calc(60px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .notification {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 20px;
      color: var(--text-primary);
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      animation: slideDown 0.3s ease;
      pointer-events: auto;
    }

    .notification.error {
      border-color: var(--danger);
      background: rgba(255, 107, 107, 0.1);
    }

    .notification.success {
      border-color: var(--success);
      background: rgba(81, 207, 102, 0.1);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      #input-area {
        padding: 8px 12px 10px;
        gap: 8px;
      }

      .msg {
        max-width: 85%;
        padding: 8px 12px;
      }

      .chat-header {
        padding: 10px 12px;
      }

      .emoji-btn,
      #sendBtn {
        padding: 10px 14px;
        min-height: 44px;
      }

      #msgInput {
        padding: 10px 14px;
        min-height: 44px;
      }
    }

    /* Focus styles for accessibility */
    :focus-visible {
      outline: 2px solid var(--accent-secondary);
      outline-offset: 2px;
    }

    /* Screen reader only */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Notification Container -->
    <div id="notification-container" aria-live="polite"></div>

    <!-- Authentication Screen -->
    <div id="auth" role="main" aria-label="شاشة تسجيل الدخول">
      <h1>💬 NeoFox</h1>
      <p class="auth-subtitle">منصة المحادثة العامة</p>
      <input 
        type="text" 
        id="username" 
        placeholder="👤 اسم المستخدم" 
        autocomplete="off"
        aria-label="اسم المستخدم"
        maxlength="30"
        minlength="3"
        required
      />
      <button id="loginBtn" aria-label="دخول إلى المحادثة">🚀 دخول</button>
      <div class="auth-error" id="auth-error" role="alert" aria-live="polite"></div>
    </div>

    <!-- Chat Screen -->
    <div id="chat" role="main" aria-label="شاشة المحادثة">
      <header class="chat-header">
        <div class="chat-header-title">
          <span class="logo">💬</span>
          <span>NeoFox Chat</span>
        </div>
        <div class="chat-header-actions">
          <button class="online-users-badge" id="onlineUsersBtn" aria-label="عرض المستخدمين المتصلين">
            🟢 <span id="onlineCount">0</span> متصل
          </button>
          <button class="logout-btn" id="logoutBtn" aria-label="تسجيل الخروج">
            خروج
          </button>
        </div>
      </header>

      <div id="online-users-panel" role="dialog" aria-label="قائمة المستخدمين المتصلين">
        <div id="online-users-list"></div>
      </div>

      <div id="messages" role="log" aria-label="الرسائل" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">💬</div>
          <div>✨ أهلاً بك! ابدأ المحادثة</div>
        </div>
        <div class="loading-indicator hidden" id="loadingIndicator">
          جاري تحميل الرسائل القديمة...
        </div>
      </div>

      <div id="typing-indicator" aria-live="polite"></div>

      <div id="input-area">
        <button class="emoji-btn" id="emojiBtn" aria-label="فتح قائمة الرموز التعبيرية">😊</button>
        <div id="emoji-picker" role="dialog" aria-label="قائمة الرموز التعبيرية">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <input 
          type="text" 
          id="msgInput" 
          placeholder="✏️ اكتب رسالتك..." 
          autocomplete="off"
          aria-label="نص الرسالة"
          maxlength="1000"
        />
        <button id="sendBtn" aria-label="إرسال الرسالة">📤 إرسال</button>
      </div>

      <div id="status" role="status" aria-live="polite">🟢 متصل</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    'use strict';

    // ==================== CONFIG ====================
    const CONFIG = {
      FIREBASE: {
        apiKey: "AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",
        authDomain: "gemiapp.firebaseapp.com",
        databaseURL: "https://gemiapp-default-rtdb.firebaseio.com",
        projectId: "gemiapp",
        storageBucket: "gemiapp.firebasestorage.app",
        messagingSenderId: "27673374613",
        appId: "1:27673374613:web:86f977ea41e8c0e2b0909c",
        measurementId: "G-G5XN8H9MG9"
      },
      VALIDATION: {
        USERNAME_MIN_LENGTH: 3,
        USERNAME_MAX_LENGTH: 30,
        MESSAGE_MAX_LENGTH: 1000,
        MESSAGE_MIN_LENGTH: 1,
        RESERVED_USERNAMES: [
          'admin', 'administrator', 'system', 'moderator', 'mod',
          'neofox', 'support', 'help', 'root', 'owner',
          'test', 'user', 'guest', 'anonymous', 'undefined', 'null'
        ]
      },
      PAGINATION: {
        MESSAGES_PER_PAGE: 50,
        MAX_CACHE_SIZE: 200
      },
      TYPING: {
        DEBOUNCE_MS: 300,
        THROTTLE_MS: 1000,
        CLEANUP_MS: 5000
      }
    };

    // ==================== FIREBASE INIT ====================
    firebase.initializeApp(CONFIG.FIREBASE);
    const db = firebase.database();
    const auth = firebase.auth();

    // ==================== STATE ====================
    const STATE = {
      currentUser: null,
      currentUid: null,
      currentUsername: null,
      currentUsernameKey: null,
      isFirstLoad: true,
      isNearBottom: true,
      hasMoreMessages: true,
      messageCache: new Map(),
      typingTimers: new Map(),
      activeListeners: [],
      connectionId: null,
      onlineUsers: new Map(),
      typingUsers: new Map(),
      lastMessageTimestamp: null,
      lastMessageKey: null
    };

    // ==================== DOM ELEMENTS ====================
    const DOM = {
      authScreen: document.getElementById('auth'),
      chatScreen: document.getElementById('chat'),
      usernameInput: document.getElementById('username'),
      loginBtn: document.getElementById('loginBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      authError: document.getElementById('auth-error'),
      msgInput: document.getElementById('msgInput'),
      sendBtn: document.getElementById('sendBtn'),
      emojiBtn: document.getElementById('emojiBtn'),
      emojiPicker: document.getElementById('emoji-picker'),
      emojiGrid: document.getElementById('emojiGrid'),
      messagesDiv: document.getElementById('messages'),
      emptyState: document.getElementById('emptyState'),
      loadingIndicator: document.getElementById('loadingIndicator'),
      typingIndicator: document.getElementById('typing-indicator'),
      statusDiv: document.getElementById('status'),
      onlineUsersBtn: document.getElementById('onlineUsersBtn'),
      onlineCount: document.getElementById('onlineCount'),
      onlineUsersPanel: document.getElementById('online-users-panel'),
      onlineUsersList: document.getElementById('online-users-list'),
      notificationContainer: document.getElementById('notification-container')
    };

    // ==================== UTILITY FUNCTIONS ====================
    function normalizeUsername(username) {
      return username.trim().normalize('NFC');
    }

    function sanitizeUsernameKey(username) {
      return username.toLowerCase().replace(/[.#$\[\]]/g, '');
    }

    function isValidUsername(username) {
      if (!username || username.length < CONFIG.VALIDATION.USERNAME_MIN_LENGTH) {
        return { valid: false, error: `اسم المستخدم يجب أن يكون ${CONFIG.VALIDATION.USERNAME_MIN_LENGTH} أحرف على الأقل` };
      }
      
      if (username.length > CONFIG.VALIDATION.USERNAME_MAX_LENGTH) {
        return { valid: false, error: `اسم المستخدم يجب أن يكون أقل من ${CONFIG.VALIDATION.USERNAME_MAX_LENGTH} حرف` };
      }
      
      if (/[\/\.#\$\[\]]/.test(username)) {
        return { valid: false, error: 'اسم المستخدم يحتوي على أحرف غير مسموحة' };
      }
      
      if (CONFIG.VALIDATION.RESERVED_USERNAMES.includes(username.toLowerCase())) {
        return { valid: false, error: 'اسم المستخدم محجوز' };
      }
      
      if (/\s/.test(username)) {
        return { valid: false, error: 'اسم المستخدم لا يمكن أن يحتوي على مسافات' };
      }
      
      return { valid: true };
    }

    function generateConnectionId() {
      return `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
    }

    function escapeHtml(text) {
      // We don't use this - we use textContent everywhere for safety
      return text;
    }

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      notification.setAttribute('role', type === 'error' ? 'alert' : 'status');
      
      DOM.notificationContainer.appendChild(notification);
      
      setTimeout(() => {
        if (notification.parentNode) {
          notification.parentNode.removeChild(notification);
        }
      }, 3000);
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      
      if (diffMins < 1) return 'الآن';
      if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
      
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `منذ ${diffHours} ساعة`;
      
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) return `منذ ${diffDays} يوم`;
      
      return date.toLocaleDateString('ar-SA', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function isNearBottom() {
      const threshold = 100;
      const scrollTop = DOM.messagesDiv.scrollTop;
      const scrollHeight = DOM.messagesDiv.scrollHeight;
      const clientHeight = DOM.messagesDiv.clientHeight;
      return scrollHeight - scrollTop - clientHeight < threshold;
    }

    function cleanupListeners() {
      STATE.activeListeners.forEach(listener => {
        try {
          listener.ref.off(listener.event, listener.callback);
        } catch (error) {
          console.error('Error cleaning up listener:', error);
        }
      });
      STATE.activeListeners = [];
    }

    function cleanupTypingTimers() {
      STATE.typingTimers.forEach((timer, key) => {
        clearTimeout(timer);
      });
      STATE.typingTimers.clear();
    }

    // ==================== AUTHENTICATION ====================
    async function initializeAuth() {
      try {
        const user = await auth.signInAnonymously();
        STATE.currentUid = user.user.uid;
        
        // Check if user has a username already
        const userRef = db.ref(`users/${STATE.currentUid}`);
        const snapshot = await userRef.once('value');
        
        if (snapshot.exists()) {
          const userData = snapshot.val();
          STATE.currentUsername = userData.username;
          STATE.currentUsernameKey = userData.usernameKey;
          enterChatScreen();
        } else {
          showAuthScreen();
        }
      } catch (error) {
        console.error('Auth initialization error:', error);
        showNotification('فشل في تهيئة الجلسة', 'error');
        showAuthScreen();
      }
    }

    function showAuthScreen() {
      DOM.authScreen.style.display = 'flex';
      DOM.chatScreen.style.display = 'none';
      DOM.loginBtn.disabled = false;
      DOM.usernameInput.disabled = false;
      DOM.usernameInput.focus();
    }

    function showChatScreen() {
      DOM.authScreen.style.display = 'none';
      DOM.chatScreen.style.display = 'flex';
      initializeChatSystems();
    }

    async function handleLogin() {
      const username = normalizeUsername(DOM.usernameInput.value);
      
      const validation = isValidUsername(username);
      if (!validation.valid) {
        DOM.authError.textContent = validation.error;
        return;
      }
      
      DOM.authError.textContent = '';
      DOM.loginBtn.disabled = true;
      DOM.usernameInput.disabled = true;
      DOM.loginBtn.textContent = '⏳ جاري الدخول...';
      
      try {
        // Ensure anonymous auth
        if (!STATE.currentUid) {
          const user = await auth.signInAnonymously();
          STATE.currentUid = user.user.uid;
        }
        
        const usernameKey = sanitizeUsernameKey(username);
        
        // Atomic username reservation using transaction
        const usernameRef = db.ref(`usernames/${usernameKey}`);
        
        const result = await usernameRef.transaction((currentData) => {
          if (currentData === null) {
            return {
              uid: STATE.currentUid,
              username: username,
              createdAt: firebase.database.ServerValue.TIMESTAMP
            };
          }
          return undefined; // Abort transaction - username taken
        });
        
        if (!result.committed) {
          DOM.authError.textContent = 'اسم المستخدم محجوز بالفعل';
          DOM.loginBtn.disabled = false;
          DOM.usernameInput.disabled = false;
          DOM.loginBtn.textContent = '🚀 دخول';
          return;
        }
        
        // Create user record
        const userRef = db.ref(`users/${STATE.currentUid}`);
        await userRef.set({
          username: username,
          usernameKey: usernameKey,
          createdAt: firebase.database.ServerValue.TIMESTAMP,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        
        STATE.currentUsername = username;
        STATE.currentUsernameKey = usernameKey;
        
        showChatScreen();
      } catch (error) {
        console.error('Login error:', error);
        DOM.authError.textContent = 'حدث خطأ أثناء تسجيل الدخول';
        DOM.loginBtn.disabled = false;
        DOM.usernameInput.disabled = false;
        DOM.loginBtn.textContent = '🚀 دخول';
        
        // Cleanup if username was reserved but user creation failed
        if (usernameKey && STATE.currentUid) {
          await db.ref(`usernames/${usernameKey}`).remove();
        }
      }
    }

    async function handleLogout() {
      try {
        // Clean up all systems
        await cleanupAllSystems();
        
        // Remove presence
        if (STATE.currentUid && STATE.connectionId) {
          await db.ref(`presence/${STATE.currentUid}/connections/${STATE.connectionId}`).remove();
        }
        
        // Sign out
        await auth.signOut();
        
        // Reset state
        STATE.currentUser = null;
        STATE.currentUid = null;
        STATE.currentUsername = null;
        STATE.currentUsernameKey = null;
        STATE.connectionId = null;
        STATE.isFirstLoad = true;
        STATE.hasMoreMessages = true;
        STATE.messageCache.clear();
        STATE.onlineUsers.clear();
        STATE.typingUsers.clear();
        
        // Clear DOM
        DOM.messagesDiv.innerHTML = '';
        DOM.emptyState.style.display = 'flex';
        DOM.msgInput.value = '';
        DOM.typingIndicator.textContent = '';
        DOM.onlineUsersList.innerHTML = '';
        DOM.onlineCount.textContent = '0';
        
        showAuthScreen();
      } catch (error) {
        console.error('Logout error:', error);
        showNotification('فشل في تسجيل الخروج', 'error');
      }
    }

    // ==================== CHAT SYSTEMS INIT ====================
    function enterChatScreen() {
      DOM.authScreen.style.display = 'none';
      DOM.chatScreen.style.display = 'flex';
      initializeChatSystems();
    }

    function initializeChatSystems() {
      initializePresence();
      initializeMessageListeners();
      initializeTypingListeners();
      initializeOnlineUsersListener();
      initializeConnectionStatus();
      initializeEmojiPicker();
      loadInitialMessages();
    }

    async function cleanupAllSystems() {
      cleanupListeners();
      cleanupTypingTimers();
      
      // Remove typing state
      if (STATE.currentUid) {
        try {
          await db.ref(`typing/${STATE.currentUid}`).remove();
        } catch (error) {
          console.error('Error cleaning typing state:', error);
        }
      }
    }

    // ==================== PRESENCE SYSTEM ====================
    function initializePresence() {
      STATE.connectionId = generateConnectionId();
      
      const connectionsRef = db.ref(`presence/${STATE.currentUid}/connections/${STATE.connectionId}`);
      const connectedRef = db.ref('.info/connected');
      const lastSeenRef = db.ref(`users/${STATE.currentUid}/lastSeen`);
      
      let connectedListener = connectedRef.on('value', (snapshot) => {
        const isConnected = snapshot.val() === true;
        
        if (isConnected) {
          // Set up disconnect cleanup before setting presence
          const disconnectCleanup = {};
          disconnectCleanup[`presence/${STATE.currentUid}/connections/${STATE.connectionId}`] = null;
          disconnectCleanup[`typing/${STATE.currentUid}`] = null;
          disconnectCleanup[`users/${STATE.currentUid}/lastSeen`] = firebase.database.ServerValue.TIMESTAMP;
          
          // Register disconnect handlers
          db.ref().update(disconnectCleanup)
            .catch(error => console.error('Error setting up disconnect:', error));
          
          // Set connection
          connectionsRef.set({
            connectedAt: firebase.database.ServerValue.TIMESTAMP
          }).then(() => {
            // Also update lastSeen
            lastSeenRef.set(firebase.database.ServerValue.TIMESTAMP);
          }).catch(error => {
            console.error('Error setting presence:', error);
          });
        }
      });
      
      // Store listener for cleanup
      STATE.activeListeners.push({
        ref: connectedRef,
        event: 'value',
        callback: connectedListener
      });
    }

    // ==================== MESSAGE SYSTEM ====================
    const MESSAGE_LIMIT = CONFIG.PAGINATION.MESSAGES_PER_PAGE;

    function loadInitialMessages() {
      const messagesRef = db.ref('messages');
      const query = messagesRef.orderByKey().limitToLast(MESSAGE_LIMIT);
      
      const listener = query.on('child_added', (snapshot) => {
        const messageId = snapshot.key;
        const messageData = snapshot.val();
        
        if (STATE.isFirstLoad) {
          // Skip first load messages if we already have them
          if (STATE.messageCache.has(messageId)) {
            return;
          }
        }
        
        STATE.messageCache.set(messageId, messageData);
        
        // Update last message info
        STATE.lastMessageKey = messageId;
        STATE.lastMessageTimestamp = messageData.timestamp;
        
        // Render message
        renderMessage(messageId, messageData, true);
      });
      
      STATE.activeListeners.push({
        ref: messagesRef,
        event: 'child_added',
        callback: listener
      });
      
      // Listen for new messages
      initializeNewMessageListener();
      
      // Initial load complete
      setTimeout(() => {
        STATE.isFirstLoad = false;
        scrollToBottom();
        checkEmptyState();
      }, 100);
    }

    function initializeNewMessageListener() {
      if (!STATE.lastMessageKey) return;
      
      const messagesRef = db.ref('messages');
      const newMessagesQuery = messagesRef.orderByKey().startAt(STATE.lastMessageKey);
      
      const listener = newMessagesQuery.on('child_added', (snapshot) => {
        const messageId = snapshot.key;
        const messageData = snapshot.val();
        
        if (messageId === STATE.lastMessageKey) return; // Skip the last known message
        
        if (STATE.messageCache.has(messageId)) return; // Skip duplicates
        
        STATE.messageCache.set(messageId, messageData);
        STATE.lastMessageKey = messageId;
        STATE.lastMessageTimestamp = messageData.timestamp;
        
        // Render message
        renderMessage(messageId, messageData, false);
        
        // Handle scroll
        if (isNearBottom()) {
          scrollToBottom();
        } else {
          showNewMessagesIndicator();
        }
        
        // Mark as read if visible
        if (isNearBottom() && messageData.uid !== STATE.currentUid) {
          markMessageAsRead(messageId);
        }
        
        // Clean up old messages from cache
        cleanupMessageCache();
      });
      
      STATE.activeListeners.push({
        ref: messagesRef,
        event: 'child_added',
        callback: listener
      });
    }

    function renderMessage(messageId, messageData, isInitialLoad = false) {
      if (STATE.messageCache.has(messageId)) {
        return; // Already rendered
      }
      
      const messageDiv = document.createElement('div');
      messageDiv.className = 'msg';
      messageDiv.id = `msg-${messageId}`;
      
      if (messageData.uid === STATE.currentUid) {
        messageDiv.classList.add('own');
      }
      
      // Username
      const userSpan = document.createElement('div');
      userSpan.className = 'msg-user';
      getUserUsername(messageData.uid).then(username => {
        userSpan.textContent = username;
      });
      
      // Message text
      const textSpan = document.createElement('div');
      textSpan.className = 'msg-text';
      textSpan.textContent = messageData.text;
      
      // Message meta
      const metaDiv = document.createElement('div');
      metaDiv.className = 'msg-meta';
      
      const timeSpan = document.createElement('span');
      timeSpan.className = 'msg-time';
      timeSpan.textContent = formatTimestamp(messageData.timestamp);
      
      metaDiv.appendChild(timeSpan);
      
      // Read status for own messages
      if (messageData.uid === STATE.currentUid) {
        const readStatus = document.createElement('span');
        readStatus.className = 'msg-read-status';
        readStatus.id = `read-status-${messageId}`;
        
        // Set initial status
        if (messageData.isRead) {
          readStatus.textContent = '✓✓';
          readStatus.classList.add('seen');
        } else {
          readStatus.textContent = '✓';
          readStatus.classList.add('delivered');
        }
        
        metaDiv.appendChild(readStatus);
      }
      
      messageDiv.appendChild(userSpan);
      messageDiv.appendChild(textSpan);
      messageDiv.appendChild(metaDiv);
      
      // Insert message in correct order
      const messages = Array.from(DOM.messagesDiv.children);
      const insertIndex = messages.findIndex(child => {
        if (child.id === 'emptyState' || child.id === 'loadingIndicator') return false;
        const childId = child.id.replace('msg-', '');
        return childId > messageId;
      });
      
      if (insertIndex === -1) {
        DOM.messagesDiv.appendChild(messageDiv);
      } else {
        DOM.messagesDiv.insertBefore(messageDiv, messages[insertIndex]);
      }
      
      STATE.messageCache.set(messageId, messageData);
    }

    async function getUserUsername(uid) {
      try {
        const userRef = db.ref(`users/${uid}/username`);
        const snapshot = await userRef.once('value');
        return snapshot.val() || 'مستخدم';
      } catch (error) {
        return 'مستخدم';
      }
    }

    async function sendMessage() {
      const text = DOM.msgInput.value.trim();
      
      if (!text || text.length === 0) {
        return;
      }
      
      if (text.length > CONFIG.VALIDATION.MESSAGE_MAX_LENGTH) {
        showNotification(`الرسالة يجب أن تكون أقل من ${CONFIG.VALIDATION.MESSAGE_MAX_LENGTH} حرف`, 'error');
        return;
      }
      
      if (!STATE.currentUid) {
        showNotification('غير مسجل الدخول', 'error');
        return;
      }
      
      DOM.sendBtn.disabled = true;
      
      try {
        const messagesRef = db.ref('messages');
        const newMessageRef = messagesRef.push();
        
        await newMessageRef.set({
          uid: STATE.currentUid,
          text: text,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        
        // Clear input
        DOM.msgInput.value = '';
        DOM.msgInput.focus();
        
        // Remove typing state
        await removeTypingState();
        
        scrollToBottom();
      } catch (error) {
        console.error('Error sending message:', error);
        showNotification('فشل في إرسال الرسالة', 'error');
      } finally {
        DOM.sendBtn.disabled = false;
      }
    }

    function cleanupMessageCache() {
      if (STATE.messageCache.size > CONFIG.PAGINATION.MAX_CACHE_SIZE) {
        const keysToRemove = Array.from(STATE.messageCache.keys())
          .sort()
          .slice(0, STATE.messageCache.size - CONFIG.PAGINATION.MAX_CACHE_SIZE);
        
        keysToRemove.forEach(key => {
          STATE.messageCache.delete(key);
          const messageElement = document.getElementById(`msg-${key}`);
          if (messageElement) {
            messageElement.remove();
          }
        });
      }
    }

    function checkEmptyState() {
      const hasMessages = STATE.messageCache.size > 0;
      DOM.emptyState.style.display = hasMessages ? 'none' : 'flex';
    }

    function scrollToBottom() {
      DOM.messagesDiv.scrollTop = DOM.messagesDiv.scrollHeight;
      STATE.isNearBottom = true;
    }

    function showNewMessagesIndicator() {
      let indicator = document.getElementById('newMessagesIndicator');
      if (!indicator) {
        indicator = document.createElement('button');
        indicator.id = 'newMessagesIndicator';
        indicator.className = 'new-messages-indicator';
        indicator.textContent = '⬇ رسائل جديدة';
        indicator.setAttribute('aria-label', 'الانتقال إلى الرسائل الجديدة');
        indicator.onclick = () => {
          scrollToBottom();
          indicator.remove();
        };
        DOM.messagesDiv.appendChild(indicator);
      }
    }

    // ==================== PAGINATION ====================
    async function loadOlderMessages() {
      if (!STATE.hasMoreMessages || !STATE.lastMessageKey) return;
      
      DOM.loadingIndicator.classList.remove('hidden');
      
      try {
        const messagesRef = db.ref('messages');
        const oldestKey = Array.from(STATE.messageCache.keys()).sort()[0];
        
        if (!oldestKey) {
          STATE.hasMoreMessages = false;
          DOM.loadingIndicator.classList.add('hidden');
          return;
        }
        
        const query = messagesRef.orderByKey().endAt(oldestKey).limitToLast(MESSAGE_LIMIT + 1);
        const snapshot = await query.once('value');
        
        const messages = [];
        snapshot.forEach((childSnapshot) => {
          messages.push({
            id: childSnapshot.key,
            data: childSnapshot.val()
          });
        });
        
        // Remove the last message (which is our current oldest)
        if (messages.length > 0) {
          messages.pop();
        }
        
        if (messages.length === 0) {
          STATE.hasMoreMessages = false;
        } else {
          const scrollHeightBefore = DOM.messagesDiv.scrollHeight;
          
          messages.forEach(message => {
            if (!STATE.messageCache.has(message.id)) {
              STATE.messageCache.set(message.id, message.data);
              renderMessage(message.id, message.data, true);
            }
          });
          
          // Maintain scroll position
          const scrollHeightAfter = DOM.messagesDiv.scrollHeight;
          DOM.messagesDiv.scrollTop = scrollHeightAfter - scrollHeightBefore;
        }
      } catch (error) {
        console.error('Error loading older messages:', error);
        showNotification('فشل في تحميل الرسائل القديمة', 'error');
      } finally {
        DOM.loadingIndicator.classList.add('hidden');
      }
    }

    // ==================== TYPING INDICATOR ====================
    function initializeTypingListeners() {
      const typingRef = db.ref('typing');
      
      const listener = typingRef.on('child_added', (snapshot) => {
        const uid = snapshot.key;
        const data = snapshot.val();
        
        if (uid === STATE.currentUid) return;
        
        STATE.typingUsers.set(uid, data);
        updateTypingIndicator();
      });
      
      const changedListener = typingRef.on('child_changed', (snapshot) => {
        const uid = snapshot.key;
        const data = snapshot.val();
        
        if (uid === STATE.currentUid) return;
        
        STATE.typingUsers.set(uid, data);
        updateTypingIndicator();
      });
      
      const removedListener = typingRef.on('child_removed', (snapshot) => {
        const uid = snapshot.key;
        
        STATE.typingUsers.delete(uid);
        updateTypingIndicator();
      });
      
      STATE.activeListeners.push({
        ref: typingRef,
        event: 'child_added',
        callback: listener
      });
      
      STATE.activeListeners.push({
        ref: typingRef,
        event: 'child_changed',
        callback: changedListener
      });
      
      STATE.activeListeners.push({
        ref: typingRef,
        event: 'child_removed',
        callback: removedListener
      });
    }

    function setTypingState() {
      if (!STATE.currentUid) return;
      
      const typingRef = db.ref(`typing/${STATE.currentUid}`);
      
      typingRef.set({
        username: STATE.currentUsername,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch(error => {
        console.error('Error setting typing state:', error);
      });
      
      // Auto cleanup after 5 seconds
      const timerKey = `typing_${STATE.currentUid}`;
      if (STATE.typingTimers.has(timerKey)) {
        clearTimeout(STATE.typingTimers.get(timerKey));
      }
      
      const timer = setTimeout(() => {
        removeTypingState();
        STATE.typingTimers.delete(timerKey);
      }, CONFIG.TYPING.CLEANUP_MS);
      
      STATE.typingTimers.set(timerKey, timer);
    }

    async function removeTypingState() {
      if (!STATE.currentUid) return;
      
      try {
        await db.ref(`typing/${STATE.currentUid}`).remove();
        const timerKey = `typing_${STATE.currentUid}`;
        if (STATE.typingTimers.has(timerKey)) {
          clearTimeout(STATE.typingTimers.get(timerKey));
          STATE.typingTimers.delete(timerKey);
        }
      } catch (error) {
        console.error('Error removing typing state:', error);
      }
    }

    function updateTypingIndicator() {
      const typingUsers = Array.from(STATE.typingUsers.values())
        .map(data => data.username)
        .filter(Boolean);
      
      if (typingUsers.length === 0) {
        DOM.typingIndicator.textContent = '';
        return;
      }
      
      let text;
      if (typingUsers.length === 1) {
        text = `${typingUsers[0]} يكتب...`;
      } else if (typingUsers.length === 2) {
        text = `${typingUsers[0]} و ${typingUsers[1]} يكتبان...`;
      } else {
        text = `${typingUsers[0]} و ${typingUsers.length - 1} آخرين يكتبون...`;
      }
      
      DOM.typingIndicator.textContent = text;
    }

    // ==================== ONLINE USERS ====================
    function initializeOnlineUsersListener() {
      const presenceRef = db.ref('presence');
      
      const listener = presenceRef.on('child_added', (snapshot) => {
        const uid = snapshot.key;
        if (uid === STATE.currentUid) return;
        
        STATE.onlineUsers.set(uid, true);
        updateOnlineUsersUI();
      });
      
      const removedListener = presenceRef.on('child_removed', (snapshot) => {
        const uid = snapshot.key;
        
        STATE.onlineUsers.delete(uid);
        updateOnlineUsersUI();
      });
      
      STATE.activeListeners.push({
        ref: presenceRef,
        event: 'child_added',
        callback: listener
      });
      
      STATE.activeListeners.push({
        ref: presenceRef,
        event: 'child_removed',
        callback: removedListener
      });
    }

    function updateOnlineUsersUI() {
      const count = STATE.onlineUsers.size;
      DOM.onlineCount.textContent = count;
      
      if (DOM.onlineUsersPanel.classList.contains('active')) {
        renderOnlineUsersList();
      }
    }

    async function renderOnlineUsersList() {
      DOM.onlineUsersList.innerHTML = '';
      
      const uids = Array.from(STATE.onlineUsers.keys());
      
      for (const uid of uids) {
        try {
          const userRef = db.ref(`users/${uid}/username`);
          const snapshot = await userRef.once('value');
          const username = snapshot.val() || 'مستخدم';
          
          const userItem = document.createElement('div');
          userItem.className = 'online-user-item';
          
          const dot = document.createElement('span');
          dot.className = 'online-user-dot';
          dot.setAttribute('aria-hidden', 'true');
          
          const nameSpan = document.createElement('span');
          nameSpan.textContent = username;
          
          userItem.appendChild(dot);
          userItem.appendChild(nameSpan);
          
          DOM.onlineUsersList.appendChild(userItem);
        } catch (error) {
          console.error('Error fetching username:', error);
        }
      }
    }

    // ==================== READ RECEIPTS ====================
    function initializeReadReceipts() {
      // Listen for read receipts on own messages
      const readRef = db.ref('messageReads');
      
      const listener = readRef.on('child_added', (snapshot) => {
        const messageId = snapshot.key;
        const reads = snapshot.val();
        
        if (!reads) return;
        
        const messageElement = document.getElementById(`msg-${messageId}`);
        if (!messageElement) return;
        
        const readStatus = document.getElementById(`read-status-${messageId}`);
        if (!readStatus) return;
        
        // Check if someone else has read this message
        let hasOtherReader = false;
        Object.keys(reads).forEach(uid => {
          if (uid !== STATE.currentUid) {
            hasOtherReader = true;
          }
        });
        
        if (hasOtherReader) {
          readStatus.textContent = '✓✓';
          readStatus.className = 'msg-read-status seen';
        }
      });
      
      STATE.activeListeners.push({
        ref: readRef,
        event: 'child_added',
        callback: listener
      });
    }

    function markMessageAsRead(messageId) {
      if (!STATE.currentUid) return;
      
      const readRef = db.ref(`messageReads/${messageId}/${STATE.currentUid}`);
      
      readRef.set({
        readAt: firebase.database.ServerValue.TIMESTAMP
      }).catch(error => {
        console.error('Error marking message as read:', error);
      });
    }

    // ==================== CONNECTION STATUS ====================
    function initializeConnectionStatus() {
      const connectedRef = db.ref('.info/connected');
      
      const listener = connectedRef.on('value', (snapshot) => {
        const isConnected = snapshot.val() === true;
        
        if (isConnected) {
          DOM.statusDiv.textContent = '🟢 متصل';
          DOM.statusDiv.className = 'connected';
        } else {
          DOM.statusDiv.textContent = '🔴 غير متصل';
          DOM.statusDiv.className = 'disconnected';
        }
      });
      
      STATE.activeListeners.push({
        ref: connectedRef,
        event: 'value',
        callback: listener
      });
    }

    // ==================== EMOJI PICKER ====================
    function initializeEmojiPicker() {
      const emojis = [
        '😀', '😁', '😂', '🤣', '😊', '😇', '🙂', '😉', '😍', '😘',
        '😋', '😜', '🤪', '😎', '🤓', '🧐', '😕', '😟', '😢', '😭',
        '😤', '😡', '🤬', '🤯', '😳', '🥵', '🥶', '😱', '😨', '😰',
        '👍', '👎', '👏', '🙏', '💪', '🤝', '👋', '🤙', '✌️', '🤞',
        '❤️', '💖', '💗', '💓', '💕', '💞', '💯', '✨', '⭐', '🌟',
        '🔥', '💥', '🎉', '🎊', '🎈', '🎁', '🏆', '🥇', '💎', '🦊'
      ];
      
      emojis.forEach(emoji => {
        const button = document.createElement('button');
        button.className = 'emoji-item';
        button.textContent = emoji;
        button.setAttribute('aria-label', `إدراج ${emoji}`);
        button.onclick = () => {
          DOM.msgInput.value += emoji;
          DOM.msgInput.focus();
          DOM.emojiPicker.classList.remove('active');
        };
        DOM.emojiGrid.appendChild(button);
      });
    }

    // ==================== EVENT LISTENERS ====================
    function setupEventListeners() {
      // Auth events
      DOM.loginBtn.addEventListener('click', handleLogin);
      DOM.usernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
      
      DOM.logoutBtn.addEventListener('click', handleLogout);
      
      // Message events
      DOM.sendBtn.addEventListener('click', sendMessage);
      DOM.msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      
      // Typing detection
      let typingTimeout = null;
      DOM.msgInput.addEventListener('input', () => {
        if (DOM.msgInput.value.trim().length > 0) {
          if (!typingTimeout) {
            setTypingState();
          }
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => {
            removeTypingState();
            typingTimeout = null;
          }, CONFIG.TYPING.CLEANUP_MS);
        } else {
          removeTypingState();
        }
      });
      
      // Emoji picker
      DOM.emojiBtn.addEventListener('click', () => {
        DOM.emojiPicker.classList.toggle('active');
      });
      
      // Online users panel
      DOM.onlineUsersBtn.addEventListener('click', () => {
        const isActive = DOM.onlineUsersPanel.classList.contains('active');
        if (isActive) {
          DOM.onlineUsersPanel.classList.remove('active');
        } else {
          renderOnlineUsersList();
          DOM.onlineUsersPanel.classList.add('active');
        }
      });
      
      // Scroll handling for pagination
      DOM.messagesDiv.addEventListener('scroll', () => {
        STATE.isNearBottom = isNearBottom();
        
        if (DOM.messagesDiv.scrollTop < 100 && STATE.hasMoreMessages) {
          loadOlderMessages();
        }
        
        // Mark visible messages as read
        if (STATE.isNearBottom) {
          // Remove new messages indicator
          const indicator = document.getElementById('newMessagesIndicator');
          if (indicator) indicator.remove();
          
          // Mark visible messages as read
          markVisibleMessagesAsRead();
        }
      });
      
      // Close panels on outside click
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#emoji-picker') && !e.target.closest('#emojiBtn')) {
          DOM.emojiPicker.classList.remove('active');
        }
        if (!e.target.closest('#online-users-panel') && !e.target.closest('#onlineUsersBtn')) {
          DOM.onlineUsersPanel.classList.remove('active');
        }
      });
      
      // Handle visibility change for presence
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          removeTypingState();
        }
      });
    }

    function markVisibleMessagesAsRead() {
      const messages = Array.from(DOM.messagesDiv.children);
      
      messages.forEach(messageElement => {
        if (!messageElement.id.startsWith('msg-')) return;
        
        const messageId = messageElement.id.replace('msg-', '');
        const messageData = STATE.messageCache.get(messageId);
        
        if (!messageData || messageData.uid === STATE.currentUid) return;
        
        // Check if message is in viewport
        const rect = messageElement.getBoundingClientRect();
        const containerRect = DOM.messagesDiv.getBoundingClientRect();
        
        if (rect.top >= containerRect.top && rect.bottom <= containerRect.bottom) {
          markMessageAsRead(messageId);
        }
      });
    }

    // ==================== INITIALIZATION ====================
    function initialize() {
      setupEventListeners();
      initializeAuth();
    }

    // Initialize the app
    initialize();
  </script>
</body>
  </html>

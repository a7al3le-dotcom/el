<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="سكرة ليبيا - غرفة دردشة فورية مع بث فيديو مشترك">
  <meta name="theme-color" content="#0a0a0a">
  <title>سكرة ليبيا   </title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!--
  ╔══════════════════════════════════════════════════════════════════════════╗
  ║                   FIREBASE DATABASE RULES (إلزامي)                       ║
  ╠══════════════════════════════════════════════════════════════════════════╣
  ║ انسخ القواعد التالية إلى Firebase Console > Realtime Database > Rules   ║
  ╚══════════════════════════════════════════════════════════════════════════╝
  
  {
    "rules": {
      "messages": {
        ".read": "auth != null",
        ".indexOn": ["timestamp"],
        "$messageId": {
          ".write": "auth != null && (!data.exists() || data.child('uid').val() === auth.uid || newData.val() == null)",
          ".validate": "newData.hasChildren(['user', 'text', 'timestamp', 'uid']) && newData.child('text').val().length <= 500 && newData.child('user').val().length <= 15"
        }
      },
      "online": {
        ".read": "auth != null",
        "$uid": {
          ".write": "auth != null && auth.uid === $uid",
          ".validate": "newData.hasChildren(['username', 'lastActive', 'uid'])"
        }
      },
      "typing": {
        ".read": "auth != null",
        "$uid": {
          ".write": "auth != null && auth.uid === $uid"
        }
      },
      "pinned_video": {
        ".read": "auth != null",
        ".write": "auth != null && (!data.exists() || data.child('uid').val() === auth.uid || newData.val() == null)"
      }
    }
  }
  
  ملاحظة: يُنصح بإضافة Cloud Function لتنظيف المستخدمين الخاملين كل دقيقة
  بدلاً من الاعتماد على العملاء لتجنب استنزاف حصص القراءة.
  -->

  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1e1e1e;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent-color: #4da8da;
      --accent-hover: #3b8ab5;
      --danger-color: #e57373;
      --success-color: #81c784;
      --warning-color: #ffb74d;
      --border-color: #333333;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 24px;
      --transition: all 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh; height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loginScreen {
      position: fixed; inset: 0; background: rgba(10, 10, 10, 0.97);
      display: flex; justify-content: center; align-items: center; z-index: 10000;
      backdrop-filter: blur(5px);
    }
    #loginBox {
      background: var(--bg-secondary); padding: 2.5rem; border-radius: var(--radius-md);
      text-align: center; width: 90%; max-width: 380px; box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }
    #loginBox h2 {
      margin-bottom: 1.5rem; font-weight: 700; font-size: 1.8rem;
      background: linear-gradient(135deg, var(--accent-color), #67d8f5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loginStatus {
      color: var(--text-secondary); font-size: 14px; margin-bottom: 15px;
      min-height: 20px;
    }
    #usernameInput {
      width: 100%; padding: 14px 20px; margin: 15px 0; border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); font-size: 16px; text-align: center; font-family: inherit;
      background: var(--bg-primary); color: var(--text-primary); transition: var(--transition);
    }
    #usernameInput:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 0 2px rgba(77, 168, 218, 0.3); }
    #usernameInput:disabled { opacity: 0.5; cursor: not-allowed; }
    #loginBtn {
      background: linear-gradient(135deg, var(--accent-color), #67d8f5); color: white; border: none;
      padding: 14px 30px; border-radius: var(--radius-lg); font-size: 18px; cursor: pointer;
      font-family: inherit; font-weight: 700; width: 100%; transition: var(--transition);
    }
    #loginBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(77, 168, 218, 0.4); }
    #loginBtn:active:not(:disabled) { transform: scale(0.98); }
    #loginBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    #chat-container { 
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; 
      opacity: 0; transition: opacity 0.3s ease; visibility: hidden;
    }
    #chat-container.visible { opacity: 1; visibility: visible; }

    #topButtons {
      display: flex; gap: 10px; padding: 10px 15px; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color); flex-shrink: 0; align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 8px 16px; cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 6px;
      color: var(--text-primary); transition: var(--transition); font-family: inherit; font-weight: 500;
      white-space: nowrap;
    }
    .btn:hover { background: #3a3a3a; border-color: var(--accent-color); }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    .btn-primary { background: var(--accent-color); border-color: var(--accent-color); }
    .btn-primary:hover { background: var(--accent-hover); }

    #messages {
      flex: 1; overflow-y: auto; padding: 15px; scroll-behavior: smooth;
      display: flex; flex-direction: column; gap: 4px;
      overscroll-behavior: contain;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .msg {
      display: flex; align-items: baseline; gap: 8px; padding: 6px 10px;
      border-radius: var(--radius-sm); animation: fadeIn 0.3s ease; transition: background 0.2s;
    }
    .msg:hover { background: rgba(255,255,255,0.03); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .user-badge {
      font-weight: 700; color: var(--accent-color); background: rgba(77, 168, 218, 0.15);
      padding: 2px 8px; border-radius: 12px; font-size: 13px; white-space: nowrap; flex-shrink: 0;
      border: 1px solid rgba(77, 168, 218, 0.3);
    }
    .msg-text { flex: 1; word-break: break-word; line-height: 1.5; }
    .msg-time { font-size: 11px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }

    .delete-btn {
      background: none; border: none; color: var(--text-secondary); cursor: pointer;
      padding: 4px; border-radius: 50%; display: flex; align-items: center; opacity: 0; transition: var(--transition);
    }
    .msg:hover .delete-btn { opacity: 0.7; }
    .delete-btn:hover { color: var(--danger-color); background: rgba(229, 115, 115, 0.2); opacity: 1 !important; }
    .delete-btn svg { width: 16px; height: 16px; }

    .sys-msg {
      text-align: center; color: var(--text-secondary); font-size: 12px; margin: 8px auto;
      background: var(--bg-tertiary); padding: 4px 12px; border-radius: 12px; width: fit-content;
      animation: fadeIn 0.5s ease; border: 1px solid var(--border-color);
    }

    #typingIndicator {
      padding: 4px 15px; font-size: 12px; color: var(--text-secondary);
      min-height: 20px; flex-shrink: 0; text-align: right;
      transition: var(--transition); opacity: 0;
    }
    #typingIndicator.active { opacity: 1; }
    .typing-dots { display: inline-flex; gap: 3px; margin-right: 5px; }
    .typing-dots span {
      width: 6px; height: 6px; background: var(--accent-color); border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,80%,100% { transform: scale(0.6); opacity:0.3; } 40% { transform: scale(1); opacity:1; } }

    #inputArea {
      display: flex; gap: 10px; padding: 12px 15px; background: var(--bg-secondary);
      border-top: 1px solid var(--border-color); flex-shrink: 0;
    }
    #messageInput {
      flex: 1; font-size: 16px; padding: 12px 20px; border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); font-family: inherit; background: var(--bg-tertiary);
      color: var(--text-primary); transition: var(--transition);
    }
    #messageInput:focus { border-color: var(--accent-color); outline: none; }
    #messageInput:disabled { opacity: 0.5; cursor: not-allowed; }
    #sendBtn {
      background: linear-gradient(135deg, var(--accent-color), #67d8f5); color: white; border: none;
      border-radius: var(--radius-lg); padding: 0 20px; cursor: pointer; font-family: inherit;
      font-weight: 700; display: flex; align-items: center; gap: 6px; transition: var(--transition);
    }
    #sendBtn:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
    #sendBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(77, 168, 218, 0.3); }
    #sendBtn svg { width: 20px; height: 20px; fill: currentColor; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999;
      display: flex; justify-content: center; align-items: center; backdrop-filter: blur(2px);
    }
    .modal-box {
      background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 20px; width: 90%; max-width: 400px; box-shadow: var(--shadow); animation: scaleIn 0.2s ease;
    }
    @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-box h4 { margin-bottom: 15px; font-size: 18px; text-align: center; color: var(--accent-color); }
    .modal-box input {
      width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-primary);
      font-family: inherit; text-align: center;
    }
    .modal-box button {
      width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none;
      border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 700; transition: var(--transition);
    }
    .modal-box button:hover { background: var(--accent-hover); }
    #usersList { max-height: 250px; overflow-y: auto; }
    .user-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 8px;
      border-bottom: 1px solid var(--border-color); font-size: 15px;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-online { background: var(--success-color); box-shadow: 0 0 8px rgba(129, 199, 132, 0.5); }
    .status-idle { background: var(--warning-color); box-shadow: 0 0 8px rgba(255, 183, 77, 0.5); }
    .status-offline { background: #757575; }

    #pinnedVideoPlayer {
      position: fixed; top: 60px; right: 20px; width: 400px; min-width: 320px; max-width: 90vw;
      background: #000; border-radius: var(--radius-md); overflow: hidden; z-index: 998;
      display: none; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border-color);
      resize: both; overflow: auto; touch-action: none;
      transition: all 0.3s ease;
    }
    #pinnedVideoPlayer.minimized {
      height: 45px !important;
      min-height: 45px !important;
    }
    .video-header {
      background: var(--bg-secondary); padding: 8px 15px; display: flex;
      justify-content: space-between; align-items: center; cursor: move; font-weight: 500;
      border-bottom: 1px solid var(--border-color); touch-action: none;
      min-height: 40px;
      gap: 10px;
    }
    .video-header-actions {
      display: flex; gap: 8px; align-items: center;
    }
    .video-control-btn {
      background: none; border: none; color: var(--text-secondary); cursor: pointer;
      padding: 4px 6px; border-radius: 50%; display: flex; align-items: center;
      transition: var(--transition); font-size: 18px;
    }
    .video-control-btn:hover { 
      color: var(--accent-color); 
      background: rgba(255,255,255,0.1); 
    }
    .video-control-btn.danger:hover { 
      color: var(--danger-color); 
    }
    .video-body { 
      position: relative; width: 100%; background: #000; flex:1; min-height: 200px;
      transition: all 0.3s ease;
    }
    .video-body.hidden { display: none; }
    .video-status {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; text-align: center; z-index: 5; padding: 15px; background: rgba(0,0,0,0.8);
      border-radius: var(--radius-sm);
    }
    .video-error { color: var(--danger-color); font-size: 14px; }
    .video-loading { color: var(--accent-color); }
    .video-minimize-bar {
      display: none; padding: 6px; text-align: center; color: var(--text-secondary);
      font-size: 12px; background: var(--bg-secondary); 
      border-top: 1px solid var(--border-color); cursor: pointer;
      transition: var(--transition);
    }
    .video-minimize-bar:hover { background: var(--bg-tertiary); }

    #connectionStatus {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--bg-secondary); padding: 8px 16px; border-radius: var(--radius-lg);
      border: 1px solid var(--border-color); font-size: 12px; z-index: 999;
      display: none; box-shadow: var(--shadow);
    }
    #connectionStatus.visible { display: block; }
    #connectionStatus.offline { border-color: var(--danger-color); color: var(--danger-color); }
    #connectionStatus.online { border-color: var(--success-color); color: var(--success-color); }

    #restoreVideoBtn {
      position: fixed; bottom: 80px; right: 20px; z-index: 997;
      display: none; background: var(--accent-color); color: white;
      border: none; border-radius: var(--radius-lg); padding: 10px 18px;
      font-family: inherit; font-weight: 700; cursor: pointer;
      box-shadow: var(--shadow); transition: var(--transition);
    }
    #restoreVideoBtn:hover { transform: scale(1.05); background: var(--accent-hover); }

    /* RTL fixes for video controls */
    [dir="rtl"] .video-control-btn svg { transform: scaleX(-1); }

    @media (max-width: 600px) {
      #pinnedVideoPlayer { width: 95vw; right: 2.5vw; top: 10px; min-width: unset; }
      #topButtons .btn span { font-size: 13px; }
      #topButtons .btn { padding: 6px 12px; }
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <h2>👋 أهلاً بك في سكرة ليبيا</h2>
    <div id="loginStatus">🔄 جاري الاتصال بالخادم...</div>
    <input type="text" id="usernameInput" placeholder="اكتب اسمك المستعار" maxlength="15" autofocus autocomplete="off" disabled>
    <button id="loginBtn" disabled>⏳ جاري التحميل...</button>
  </div>
</div>

<div id="chat-container">
  <div id="topButtons">
    <button class="btn" id="setVideoBtn" aria-label="تثبيت فيديو جديد" role="button">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4V6.5l-4 4Z"/></svg>
      <span>فيديو</span>
    </button>
    <button class="btn" id="onlineListBtn" aria-label="عرض المتصلين" role="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="4"/><path d="M12 14c-6 0-8 3-8 5v1h16v-1c0-2-2-5-8-5Z"/></svg>
      <span id="userCount">0</span>
    </button>
    <button class="btn" id="restoreVideoBtn" style="display:none;" aria-label="استعادة الفيديو المصغر" role="button">
      🎬 عرض الفيديو
    </button>
  </div>

  <div id="messages"></div>

  <div id="typingIndicator"></div>

  <form id="inputArea" autocomplete="off">
    <input type="text" id="messageInput" placeholder="اكتب رسالتك..." maxlength="500" autocomplete="off" disabled>
    <button type="submit" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      إرسال
    </button>
  </form>

  <div id="pinnedVideoPlayer"></div>
</div>

<div id="modalContainer"></div>
<div id="connectionStatus"></div>

<script>
  const icons = {
    close: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>',
    minimize: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 13H5v-2h14v2z" fill="currentColor"/></svg>',
    maximize: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>',
  };

  class ChatApp {
    constructor() {
      // DOM elements
      this.loginScreen = document.getElementById('loginScreen');
      this.usernameInput = document.getElementById('usernameInput');
      this.loginBtn = document.getElementById('loginBtn');
      this.loginStatus = document.getElementById('loginStatus');
      this.chatContainer = document.getElementById('chat-container');
      this.messagesDiv = document.getElementById('messages');
      this.messageInput = document.getElementById('messageInput');
      this.sendBtn = document.getElementById('sendBtn');
      this.userCountSpan = document.getElementById('userCount');
      this.modalContainer = document.getElementById('modalContainer');
      this.pinnedVideoContainer = document.getElementById('pinnedVideoPlayer');
      this.onlineListBtn = document.getElementById('onlineListBtn');
      this.setVideoBtn = document.getElementById('setVideoBtn');
      this.typingIndicator = document.getElementById('typingIndicator');
      this.connectionStatus = document.getElementById('connectionStatus');
      this.restoreVideoBtn = document.getElementById('restoreVideoBtn');
      
      // State
      this.username = '';
      this.uid = null;
      this.userRef = null;
      this.messagesRef = null;
      this.onlineRef = null;
      this.pinnedVideoRef = null;
      this.typingRef = null;
      this.serverTimeOffset = 0;
      this.renderedMessages = new Set();
      this.videoPlayerManager = null;
      this.timeElements = new Map();
      this.atBottom = true;
      this.isTyping = false;
      this.typingTimeout = null;
      this.timeObserver = null;
      this.isLoggedIn = false;
      this.messageListeners = [];
      this.isVideoMinimized = false;
      this.isFirstConnect = true;
      this.presenceInterval = null;
      this.cleanupInterval = null;
      this.connectedRef = null;
      this.serverTimeRef = null;
      this.onlineUsersListener = null;
      this.typingListener = null;
      this.pinnedVideoListener = null;

      // ✅ NEW: Rate limiting
      this.lastMessageTime = 0;
      this.messageCount = 0;
      this.messageCountResetTime = 0;
      this.MESSAGE_RATE_LIMIT = 3000; // 3 seconds between messages
      this.MESSAGE_BURST_LIMIT = 10; // Max 10 messages per minute
      this.MESSAGE_BURST_WINDOW = 60000; // 1 minute window

      // Constants
      this.INACTIVE_THRESHOLD = 120000; // 2 minutes
      this.IDLE_THRESHOLD = 60000; // 1 minute
      this.TYPING_TIMEOUT = 3000; // 3 seconds

      // Initialize
      this.initFirebase();
      this.initEventListeners();
      this.initTimeObserver();
      this.monitorConnection();

      // Start authentication
      this.initAuth();

      // Restore video button
      this.restoreVideoBtn.onclick = () => this.restoreMinimizedVideo();
    }

    initFirebase() {
      const firebaseConfig = {
        apiKey: "AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",
        authDomain: "gemiapp.firebaseapp.com",
        databaseURL: "https://gemiapp-default-rtdb.firebaseio.com",
        projectId: "gemiapp",
        storageBucket: "gemiapp.firebasestorage.app",
        messagingSenderId: "27673374613",
        appId: "1:27673374613:web:86f977ea41e8c0e2b0909c"
      };
      
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        this.db = firebase.database();
        this.auth = firebase.auth();
      } catch(e) {
        this.showLoginStatus('❌ خطأ في الاتصال بقاعدة البيانات', 'error');
        console.error('Firebase init error:', e);
      }
    }

    initAuth() {
      this.showLoginStatus('🔄 جاري المصادقة...', 'loading');
      this.usernameInput.disabled = true;
      this.loginBtn.disabled = true;

      this.auth.signInAnonymously()
        .then((userCredential) => {
          this.uid = userCredential.user.uid;
          this.showLoginStatus('✅ تم المصادقة بنجاح! أدخل اسمك', 'success');
          this.usernameInput.disabled = false;
          this.loginBtn.disabled = false;
          this.loginBtn.textContent = '🚀 دخول إلى الدردشة';
          this.usernameInput.focus();
        })
        .catch((error) => {
          console.error('Auth error:', error);
          this.showLoginStatus('❌ فشل المصادقة: ' + error.message, 'error');
          this.loginBtn.disabled = true;
        });
    }

    showLoginStatus(message, type) {
      this.loginStatus.textContent = message;
      this.loginStatus.style.color = type === 'error' ? 'var(--danger-color)' : 
                                    type === 'success' ? 'var(--success-color)' : 
                                    'var(--text-secondary)';
    }

    initEventListeners() {
      this.loginBtn.onclick = () => this.attemptLogin();
      this.usernameInput.onkeypress = (e) => { if (e.key === 'Enter') this.attemptLogin(); };
      this.onlineListBtn.onclick = () => this.showOnlineUsersModal();
      this.setVideoBtn.onclick = () => this.showSetVideoModal();
      
      document.getElementById('inputArea').addEventListener('submit', (e) => this.sendMessage(e));
      this.messagesDiv.addEventListener('scroll', () => {
        const threshold = 50;
        this.atBottom = (this.messagesDiv.scrollHeight - this.messagesDiv.scrollTop - this.messagesDiv.clientHeight) < threshold;
      });

      // Typing indicator
      this.messageInput.addEventListener('input', () => this.handleTyping());
      this.messageInput.addEventListener('blur', () => this.clearTyping());
    }

    attemptLogin() {
      if (this.isLoggedIn || this.loginBtn.disabled) return;
      
      const name = this.usernameInput.value.trim();
      
      // ✅ FIX: Added / to forbidden characters
      if (/[.#$\[\]\/]/.test(name)) {
        this.showLoginStatus('⚠️ الرجاء عدم استخدام رموز خاصة: . # $ [ ] /', 'error');
        return;
      }
      if (name.length < 2) {
        this.showLoginStatus('⚠️ الاسم قصير جداً (أقل من حرفين)', 'error');
        return;
      }
      if (name.length > 15) {
        this.showLoginStatus('⚠️ الاسم طويل جداً (أكثر من 15 حرف)', 'error');
        return;
      }

      this.username = name;
      this.userRef = this.db.ref(`online/${this.uid}`);
      this.messagesRef = this.db.ref("messages");
      this.onlineRef = this.db.ref("online");
      this.pinnedVideoRef = this.db.ref("pinned_video");
      this.typingRef = this.db.ref("typing");
      
      this.startChat();
    }

    startChat() {
      this.isLoggedIn = true;
      this.loginScreen.style.display = 'none';
      this.chatContainer.classList.add('visible');
      setTimeout(() => this.chatContainer.style.opacity = '1', 50);

      // Enable inputs
      this.messageInput.disabled = false;
      this.sendBtn.disabled = false;

      // ✅ FIX: Store server time offset reference for cleanup
      this.serverTimeRef = this.db.ref('.info/serverTimeOffset');
      this.serverTimeRef.on('value', snap => {
        this.serverTimeOffset = snap.val() || 0;
      });

      // Presence - store username immediately
      this.userRef.set({ 
        username: this.username,
        lastActive: firebase.database.ServerValue.TIMESTAMP,
        uid: this.uid 
      });
      this.userRef.onDisconnect().remove();
      
      // Keep alive
      this.presenceInterval = setInterval(() => {
        if (this.isLoggedIn) {
          this.userRef.update({ 
            lastActive: firebase.database.ServerValue.TIMESTAMP 
          });
        }
      }, 30000);

      // ✅ IMPROVEMENT: Reduced cleanup frequency to 5 minutes and optimized
      this.cleanupInterval = setInterval(() => this.cleanInactiveUsers(), 300000);

      // Typing cleanup on disconnect
      this.typingRef.child(this.uid).onDisconnect().remove();

      // Messages
      const messagesListener = this.messagesRef.orderByChild('timestamp').limitToLast(100);
      this.messageListeners.push(
        messagesListener.on("child_added", snap => {
          if (this.renderedMessages.has(snap.key)) return;
          this.renderedMessages.add(snap.key);
          this.addMessageToUI(snap.key, snap.val());
        })
      );

      this.messageListeners.push(
        this.messagesRef.on("child_removed", snap => {
          this.renderedMessages.delete(snap.key);
          
          // ✅ FIX: Unobserve element before removing to prevent memory leak
          const el = document.getElementById(`msg-${snap.key}`);
          if (el) {
            const timeSpan = el.querySelector('.msg-time');
            if (timeSpan && this.timeObserver) {
              this.timeObserver.unobserve(timeSpan);
            }
            this.timeElements.delete(snap.key);
            
            el.style.transition = 'opacity 0.3s, transform 0.3s';
            el.style.opacity = '0';
            el.style.transform = 'scale(0.9)';
            setTimeout(() => el.remove(), 300);
          }
        })
      );

      // ✅ FIX: Store online users listener reference for cleanup
      this.onlineUsersListener = this.onlineRef.on("value", snap => {
        const count = snap.numChildren();
        this.userCountSpan.textContent = count;
      });

      // Pinned video
      this.pinnedVideoListener = this.pinnedVideoRef.on("value", snap => {
        this.handlePinnedVideo(snap.val());
      });

      // ✅ FIX: Store typing listener reference for cleanup
      this.typingListener = this.typingRef.on('value', snap => {
        this.handleTypingUpdate(snap.val());
      });

      this.addSystemMessage(`👋 مرحباً ${this.escapeHtml(this.username)}!`);
    }

    cleanInactiveUsers() {
      if (!this.isLoggedIn) return;
      const now = Date.now() + this.serverTimeOffset;
      this.onlineRef.once('value', snap => {
        snap.forEach(child => {
          // ✅ FIX: Don't delete current user
          if (child.key === this.uid) return;
          
          const data = child.val();
          if (now - (data.lastActive || 0) > this.INACTIVE_THRESHOLD) {
            child.ref.remove();
          }
        });
      });
    }

    // ✅ NEW: Rate limiting check
    canSendMessage() {
      const now = Date.now();
      
      // Check burst limit
      if (now - this.messageCountResetTime > this.MESSAGE_BURST_WINDOW) {
        this.messageCount = 0;
        this.messageCountResetTime = now;
      }
      
      if (this.messageCount >= this.MESSAGE_BURST_LIMIT) {
        return { allowed: false, reason: 'لقد أرسلت رسائل كثيرة. انتظر قليلاً' };
      }
      
      // Check rate limit
      if (now - this.lastMessageTime < this.MESSAGE_RATE_LIMIT) {
        const waitTime = Math.ceil((this.MESSAGE_RATE_LIMIT - (now - this.lastMessageTime)) / 1000);
        return { allowed: false, reason: `انتظر ${waitTime} ثانية قبل إرسال رسالة أخرى` };
      }
      
      return { allowed: true };
    }

    addMessageToUI(key, data) {
      // Sanitize data
      const user = this.escapeHtml(data.user || 'مجهول');
      const text = this.escapeHtml(data.text || '');
      const timestamp = data.timestamp || null;
      const uid = data.uid || null;
      
      const div = document.createElement("div");
      div.className = "msg";
      div.id = `msg-${key}`;
      
      const isMe = uid === this.uid;
      div.innerHTML = `
        <span class="user-badge">${user}</span>
        <span class="msg-text">${text}</span>
        <span class="msg-time" data-timestamp="${timestamp || ''}"></span>
      `;
      
      const timeSpan = div.querySelector('.msg-time');
      
      // ✅ FIX: Set data-msg-key for IntersectionObserver
      if (timestamp) {
        timeSpan.dataset.msgKey = key;
        this.updateRelativeTime(timestamp, timeSpan);
        this.timeElements.set(key, { el: timeSpan, timestamp });
        if (this.timeObserver) {
          this.timeObserver.observe(timeSpan);
        }
      }

      // Delete button - only for messages from this user
      if (isMe) {
        const del = document.createElement("button");
        del.className = "delete-btn";
        del.innerHTML = icons.trash;
        del.title = "حذف";
        del.setAttribute('aria-label', 'حذف الرسالة');
        del.onclick = () => {
          this.showConfirmModal('حذف الرسالة؟', () => {
            this.messagesRef.child(key).remove();
          });
        };
        div.appendChild(del);
      }

      this.messagesDiv.appendChild(div);
      if (this.atBottom) this.scrollToBottom();
    }

    updateRelativeTime(timestamp, el) {
      if (!timestamp || !el) return;
      const diff = Math.max(0, Math.floor((Date.now() + this.serverTimeOffset - timestamp) / 1000));
      let txt = "الآن";
      if (diff < 60) txt = `${diff} ث`;
      else if (diff < 3600) txt = `منذ ${Math.floor(diff/60)} د`;
      else if (diff < 86400) txt = `منذ ${Math.floor(diff/3600)} س`;
      else txt = `منذ ${Math.floor(diff/86400)} ي`;
      el.textContent = txt;
    }

    initTimeObserver() {
      this.timeObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const key = entry.target.dataset.msgKey;
            if (key && this.timeElements.has(key)) {
              const data = this.timeElements.get(key);
              this.updateRelativeTime(data.timestamp, data.el);
            }
          }
        });
      }, { threshold: 0.1 });
    }

    addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "sys-msg";
      div.textContent = text;
      this.messagesDiv.appendChild(div);
      if (this.atBottom) this.scrollToBottom();
    }

    sendMessage(e) {
      e.preventDefault();
      if (this.sendBtn.disabled || !this.isLoggedIn) return;
      
      // ✅ NEW: Rate limiting check
      const rateCheck = this.canSendMessage();
      if (!rateCheck.allowed) {
        this.addSystemMessage(`⚠️ ${rateCheck.reason}`);
        return;
      }
      
      const text = this.messageInput.value.trim();
      if (!text) return;
      
      // ✅ FIX: Extra validation for length
      if (text.length > 500) {
        this.addSystemMessage('⚠️ الرسالة طويلة جداً (الحد 500 حرف)');
        return;
      }
      
      // Update rate limiting counters
      this.lastMessageTime = Date.now();
      this.messageCount++;
      
      this.sendBtn.disabled = true;
      setTimeout(() => { this.sendBtn.disabled = false; }, 1000);

      this.messagesRef.push({
        user: this.username,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        uid: this.uid
      }).catch(err => {
        console.error('Send message error:', err);
        this.addSystemMessage('❌ فشل إرسال الرسالة');
        this.sendBtn.disabled = false;
      });
      
      this.messageInput.value = "";
      this.clearTyping();
      this.isTyping = false;
      this.userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP });
    }

    handleTyping() {
      if (!this.typingRef || !this.isLoggedIn) return;
      
      const text = this.messageInput.value.trim();
      if (text.length > 0 && !this.isTyping) {
        this.isTyping = true;
        this.typingRef.child(this.uid).set(this.username);
        clearTimeout(this.typingTimeout);
        this.typingTimeout = setTimeout(() => this.clearTyping(), this.TYPING_TIMEOUT);
      } else if (text.length === 0) {
        this.clearTyping();
      }
    }

    clearTyping() {
      if (this.typingRef && this.isTyping) {
        this.typingRef.child(this.uid).remove();
        this.isTyping = false;
      }
    }

    handleTypingUpdate(data) {
      if (!data) {
        this.typingIndicator.classList.remove('active');
        this.typingIndicator.innerHTML = '';
        return;
      }
      
      const typers = Object.keys(data).filter(key => key !== this.uid);
      if (typers.length === 0) {
        this.typingIndicator.classList.remove('active');
        this.typingIndicator.innerHTML = '';
      } else {
        const names = typers.map(key => this.escapeHtml(data[key])).filter(n => n);
        let message = '';
        if (names.length === 1) {
          message = `${names[0]} <span style="color:var(--accent-color)">يكتب...</span>`;
        } else if (names.length === 2) {
          message = `${names[0]} و ${names[1]} <span style="color:var(--accent-color)">يكتبان...</span>`;
        } else {
          message = `${names.length} أشخاص <span style="color:var(--accent-color)">يكتبون...</span>`;
        }
        this.typingIndicator.innerHTML = `${message} <span class="typing-dots"><span></span><span></span><span></span></span>`;
        this.typingIndicator.classList.add('active');
      }
    }

    monitorConnection() {
      this.connectedRef = this.db.ref('.info/connected');
      
      // ✅ FIX: Reset first connect flag when page loads
      this.isFirstConnect = true;
      
      this.connectedRef.on('value', (snap) => {
        const isConnected = snap.val() === true;
        this.connectionStatus.textContent = isConnected ? '🟢 متصل' : '🔴 غير متصل';
        this.connectionStatus.className = 'visible ' + (isConnected ? 'online' : 'offline');
        
        if (isConnected) {
          setTimeout(() => {
            this.connectionStatus.classList.remove('visible');
          }, 3000);
          
          // ✅ FIX: Don't show "restored" on first connection
          if (!this.isFirstConnect && this.isLoggedIn) {
            this.addSystemMessage('🟢 تم استعادة الاتصال بالخادم');
          }
          this.isFirstConnect = false;
        } else if (!isConnected) {
          this.addSystemMessage('🔴 انقطع الاتصال... جاري المحاولة');
        }
      });
    }

    // ==================== Modal Functions ====================
    showModal(title, content) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.innerHTML = `<h4>${title}</h4>${content}`;
      overlay.appendChild(box);
      overlay.onclick = (e) => { if (e.target === overlay) this.closeModal(overlay); };
      this.modalContainer.appendChild(overlay);
      
      // ✅ FIX: Focus management
      const firstInput = box.querySelector('input, button');
      if (firstInput) setTimeout(() => firstInput.focus(), 100);
      
      // ✅ FIX: Keyboard navigation - Escape to close
      const handleKeydown = (e) => {
        if (e.key === 'Escape') {
          this.closeModal(overlay);
          document.removeEventListener('keydown', handleKeydown);
        }
      };
      document.addEventListener('keydown', handleKeydown);
      overlay._keydownHandler = handleKeydown;
      
      return { overlay, box };
    }

    closeModal(overlay) {
      if (overlay._keydownHandler) {
        document.removeEventListener('keydown', overlay._keydownHandler);
      }
      if (overlay._cleanup) {
        overlay._cleanup();
      }
      overlay.remove();
    }

    showConfirmModal(message, onConfirm) {
      const content = `
        <p style="text-align:center;margin-bottom:20px;font-size:16px;">${message}</p>
        <div style="display:flex;gap:10px;">
          <button id="confirmYes" style="flex:1;background:var(--danger-color);">نعم</button>
          <button id="confirmNo" style="flex:1;background:var(--bg-tertiary);">إلغاء</button>
        </div>
      `;
      const { overlay, box } = this.showModal('تأكيد', content);
      
      box.querySelector('#confirmYes').onclick = () => {
        this.closeModal(overlay);
        onConfirm();
      };
      box.querySelector('#confirmNo').onclick = () => {
        this.closeModal(overlay);
      };
    }

    showOnlineUsersModal() {
      const { overlay } = this.showModal('👥 المتصلون الآن', '<div id="usersList"><p style="text-align:center;color:var(--text-secondary);">جاري التحميل...</p></div>');
      
      const usersList = overlay.querySelector('#usersList');
      const listener = this.onlineRef.on('value', snap => {
        const users = snap.val() || {};
        const now = Date.now() + this.serverTimeOffset;
        const arr = Object.entries(users).sort((a,b) => (b[1].lastActive||0) - (a[1].lastActive||0));
        let list = '';
        arr.forEach(([key, data]) => {
          const name = this.escapeHtml(data.username || 'مجهول');
          const diff = now - (data.lastActive||0);
          let cls = 'status-online', txt = 'متصل';
          if (diff > this.INACTIVE_THRESHOLD) { cls = 'status-offline'; txt = 'غير متصل'; }
          else if (diff > this.IDLE_THRESHOLD) { cls = 'status-idle'; txt = 'خامل'; }
          list += `<div class="user-item"><span class="status-dot ${cls}"></span><span>${name}</span><span style="margin-right:auto;font-size:12px;color:var(--text-secondary)">${txt}</span></div>`;
        });
        usersList.innerHTML = list || '<p style="text-align:center;color:var(--text-secondary);">لا يوجد متصلون</p>';
      });
      
      // Clean up listener when modal closes
      const cleanupListener = () => {
        this.onlineRef.off('value', listener);
      };
      overlay._cleanup = cleanupListener;
    }

    showSetVideoModal() {
      const content = `
        <input type="text" id="videoUrlInput" placeholder="أدخل رابط الفيديو" style="margin-bottom:10px;">
        <small style="display:block;text-align:center;color:var(--text-secondary);margin-bottom:15px;">YouTube | Twitter/X | HLS (.m3u8) | MP4</small>
        <button id="submitVideoBtn" class="btn-primary">🎬 تثبيت الفيديو</button>
      `;
      const { overlay, box } = this.showModal('📺 تثبيت فيديو', content);
      const btn = box.querySelector('#submitVideoBtn');
      const inp = box.querySelector('#videoUrlInput');
      
      btn.onclick = () => {
        const url = inp.value.trim();
        if (!url) {
          this.showToast('⚠️ أدخل رابطاً');
          return;
        }
        this.validateAndSetVideo(url, overlay);
      };
      
      inp.onkeypress = e => { if (e.key === 'Enter') btn.click(); };
    }

    async validateAndSetVideo(url, overlay) {
      const data = await this.parseVideoUrl(url);
      if (data) {
        data.setBy = this.username;
        data.uid = this.uid;
        this.pinnedVideoRef.set(data);
        this.closeModal(overlay);
        this.addSystemMessage(`🎬 ${this.escapeHtml(this.username)} ثبت فيديو`);
      } else {
        this.showToast('⚠️ الرابط غير مدعوم. جرب: YouTube, Twitter, HLS, أو MP4 مباشر');
      }
    }

    showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
        background: var(--bg-secondary); color: var(--text-primary);
        padding: 12px 24px; border-radius: var(--radius-lg);
        border: 1px solid var(--border-color); z-index: 10000;
        font-family: 'Tajawal', sans-serif; font-size: 14px;
        box-shadow: var(--shadow); animation: fadeIn 0.3s ease;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async parseVideoUrl(url) {
      url = url.trim();
      
      // YouTube
      const ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) return { type: 'youtube', id: ytMatch[1] };
      
      // Twitter/X
      const twMatch = url.match(/(?:twitter\.com|x\.com)\/\w+\/status\/(\d+)/);
      if (twMatch) return { type: 'twitter', id: twMatch[1] };
      
      // Direct video files
      if (/\.(mp4|webm|ogv|mov)(\?.*)?$/i.test(url)) return { type: 'direct', src: url };
      
      // ✅ IMPROVEMENT: Accept HLS URLs without pre-validation (rely on Hls.js error handling)
      if (url.includes('.m3u8') || url.includes('/hls/') || url.includes('m3u8') || 
          url.includes('master') || url.includes('playlist') || url.includes('live') || url.includes('token')) {
        return { type: 'hls', src: url };
      }
      
      return null;
    }

    handlePinnedVideo(data) {
      if (this.videoPlayerManager) {
        this.videoPlayerManager.dispose();
        this.videoPlayerManager = null;
      }
      this.pinnedVideoContainer.innerHTML = '';
      this.isVideoMinimized = false;
      
      // ✅ FIX: Only show restore button if there's a video
      if (!data) {
        this.pinnedVideoContainer.style.display = 'none';
        this.restoreVideoBtn.style.display = 'none';
        return;
      }
      
      this.pinnedVideoContainer.style.display = 'flex';
      this.pinnedVideoContainer.classList.remove('minimized');
      
      // ✅ FIX: Don't show restore button for everyone, only when minimized
      this.restoreVideoBtn.style.display = 'none';
      
      this.videoPlayerManager = new UniversalPlayer(
        this.pinnedVideoContainer, 
        data, 
        this.uid,
        (action, payload) => {
          if (action === 'close' && data.uid === this.uid) {
            this.showConfirmModal('🗑️ حذف الفيديو للجميع؟', () => {
              this.pinnedVideoRef.remove();
              this.addSystemMessage('🗑️ تم إزالة الفيديو');
              this.restoreVideoBtn.style.display = 'none';
            });
          } else if (action === 'minimize') {
            this.minimizeVideo();
          } else if (action === 'restore') {
            this.restoreVideo();
          }
        }
      );
    }

    minimizeVideo() {
      this.isVideoMinimized = true;
      this.pinnedVideoContainer.classList.add('minimized');
      this.restoreVideoBtn.style.display = 'flex';
      this.addSystemMessage('📹 تم تصغير الفيديو');
    }

    restoreVideo() {
      this.isVideoMinimized = false;
      this.pinnedVideoContainer.classList.remove('minimized');
      this.restoreVideoBtn.style.display = 'none';
      if (this.videoPlayerManager) {
        this.videoPlayerManager.restoreFromMinimize();
      }
    }

    restoreMinimizedVideo() {
      this.restoreVideo();
    }

    scrollToBottom() {
      requestAnimationFrame(() => {
        this.messagesDiv.scrollTop = this.messagesDiv.scrollHeight;
      });
    }

    escapeHtml(text) {
      if (!text) return '';
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    dispose() {
      this.isLoggedIn = false;
      
      // Clean up message listeners
      this.messageListeners.forEach(listener => {
        if (listener && typeof listener.off === 'function') {
          listener.off();
        }
      });
      this.messageListeners = [];
      
      // Clean up intervals
      if (this.presenceInterval) {
        clearInterval(this.presenceInterval);
        this.presenceInterval = null;
      }
      if (this.cleanupInterval) {
        clearInterval(this.cleanupInterval);
        this.cleanupInterval = null;
      }
      if (this.typingTimeout) {
        clearTimeout(this.typingTimeout);
        this.typingTimeout = null;
      }
      
      // ✅ FIX: Clean up all listeners
      if (this.timeObserver) {
        this.timeObserver.disconnect();
        this.timeObserver = null;
      }
      
      if (this.serverTimeRef) {
        this.serverTimeRef.off();
        this.serverTimeRef = null;
      }
      
      if (this.connectedRef) {
        this.connectedRef.off();
        this.connectedRef = null;
      }
      
      if (this.typingRef) {
        this.typingRef.off();
        if (this.uid) {
          this.typingRef.child(this.uid).remove();
        }
        this.typingRef = null;
      }
      
      if (this.onlineRef && this.onlineUsersListener) {
        this.onlineRef.off('value', this.onlineUsersListener);
        this.onlineUsersListener = null;
      }
      
      if (this.pinnedVideoRef && this.pinnedVideoListener) {
        this.pinnedVideoRef.off('value', this.pinnedVideoListener);
        this.pinnedVideoListener = null;
      }
      
      if (this.userRef) {
        this.userRef.remove();
        this.userRef = null;
      }
      
      // Clean up video player
      if (this.videoPlayerManager) {
        this.videoPlayerManager.dispose();
        this.videoPlayerManager = null;
      }
      
      // Clear data
      this.renderedMessages.clear();
      this.timeElements.clear();
      
      console.log('ChatApp disposed successfully');
    }
  }

  // ======================== Universal Player ========================
  class UniversalPlayer {
    constructor(container, data, currentUid, onAction) {
      this.container = container;
      this.data = data;
      this.currentUid = currentUid;
      this.onAction = onAction;
      this.videoEl = null;
      this.hls = null;
      this.isMinimized = false;
      this.buildUI();
      this.init();
    }

    buildUI() {
      const isOwner = this.data.uid === this.currentUid;
      this.container.innerHTML = `
        <div class="video-header">
          <span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">🎬 ${this.escapeHtml(this.data.setBy || '')}</span>
          <div class="video-header-actions">
            <button class="video-control-btn minimize-btn" title="تصغير" aria-label="تصغير الفيديو">
              ${icons.minimize}
            </button>
            ${isOwner ? `<button class="video-control-btn danger close-btn" title="حذف الفيديو للجميع" aria-label="حذف الفيديو">${icons.close}</button>` : ''}
          </div>
        </div>
        <div class="video-body" id="videoBody">
          <div class="video-status video-loading">⏳ جاري التحميل...</div>
        </div>
        <div class="video-minimize-bar" id="minimizeBar">
          ⬆ اضغط للتكبير
        </div>
      `;

      // Event listeners for buttons
      const minimizeBtn = this.container.querySelector('.minimize-btn');
      minimizeBtn.onclick = () => {
        this.toggleMinimize();
        this.onAction('minimize');
      };

      const closeBtn = this.container.querySelector('.close-btn');
      if (closeBtn) {
        closeBtn.onclick = () => {
          this.onAction('close');
        };
      }

      const bar = this.container.querySelector('#minimizeBar');
      bar.onclick = () => {
        this.toggleMinimize();
        this.onAction('restore');
      };

      this.makeDraggable();
    }

    toggleMinimize() {
      this.isMinimized = !this.isMinimized;
      const body = this.container.querySelector('.video-body');
      const bar = this.container.querySelector('#minimizeBar');
      
      if (this.isMinimized) {
        body.classList.add('hidden');
        bar.style.display = 'block';
        this.container.style.minHeight = '45px';
        this.container.style.height = '45px';
      } else {
        body.classList.remove('hidden');
        bar.style.display = 'none';
        this.container.style.minHeight = '';
        this.container.style.height = '';
        this.restoreFromMinimize();
      }
    }

    restoreFromMinimize() {
      this.isMinimized = false;
      const body = this.container.querySelector('.video-body');
      const bar = this.container.querySelector('#minimizeBar');
      if (body) body.classList.remove('hidden');
      if (bar) bar.style.display = 'none';
      this.container.style.minHeight = '';
      this.container.style.height = '';
    }

    async init() {
      const body = document.getElementById('videoBody');
      if (!body) return;
      
      try {
        if (this.data.type === 'youtube') {
          this.loadYouTube(body);
        } else if (this.data.type === 'twitter') {
          this.loadTwitter(body);
        } else {
          await this.loadVideo(body, this.data.src);
        }
      } catch (e) {
        console.error('Video load error:', e);
        this.showError(body, 'فشل تحميل المشغل');
      }
    }

    loadYouTube(body) {
      body.innerHTML = `<iframe src="https://www.youtube.com/embed/${this.data.id}?autoplay=1&mute=1&controls=1&playsinline=1&enablejsapi=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"></iframe>`;
    }

    loadTwitter(body) {
      body.innerHTML = `<iframe src="https://twitframe.com/show?url=https://twitter.com/i/status/${this.data.id}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    async loadVideo(body, url) {
      body.innerHTML = '';
      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.setAttribute('crossorigin', 'anonymous');
      video.controls = true;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.background = '#000';
      body.appendChild(video);
      this.videoEl = video;

      // ✅ IMPROVEMENT: Try HLS first if URL looks like HLS, otherwise try direct
      if (this.data.type === 'hls' || url.includes('m3u8') || url.includes('/hls/')) {
        this.tryHLS(video, url, body);
      } else {
        video.src = url;
        try {
          await video.play();
          this.hideStatus();
        } catch (err) {
          // If direct play fails, try HLS as fallback
          this.tryHLS(video, url, body);
        }
      }
    }

    tryHLS(video, url, body) {
      if (Hls.isSupported()) {
        // ✅ IMPROVEMENT: Rely on Hls.js error handling instead of pre-validation
        const hls = new Hls({ 
          enableWorker: true,
          lowLatencyMode: false,
        });
        
        hls.loadSource(url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          // Enable lowLatencyMode only for live streams
          if (data && data.details && data.details.live) {
            hls.config.lowLatencyMode = true;
          }
          this.hideStatus();
          video.play().catch(() => {});
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              this.showError(body, 'تعذر الاتصال بالبث. قد يكون الرابط لا يسمح بالوصول أو معطلاً.');
              hls.destroy();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              try {
                hls.recoverMediaError();
              } catch (e) {
                this.showError(body, 'فشل استرداد البث');
                hls.destroy();
              }
            } else {
              this.showError(body, 'فشل تشغيل البث');
              hls.destroy();
            }
          }
        });
        
        this.hls = hls;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      } else {
        this.showError(body, 'متصفحك لا يدعم تشغيل هذا النوع من البث');
      }
    }

    hideStatus() {
      const status = this.container.querySelector('.video-status');
      if (status) status.style.display = 'none';
    }

    showError(body, msg) {
      body.innerHTML = `<div class="video-status video-error"><div style="font-size:24px;">⚠️</div><div>${msg}</div></div>`;
    }

    makeDraggable() {
      const hdr = this.container.querySelector('.video-header');
      if (!hdr) return;
      
      let isDragging = false, startX, startY, initialLeft, initialTop;

      const onStart = (e) => {
        if (e.target.closest('button')) return;
        isDragging = true;
        const point = e.touches ? e.touches[0] : e;
        startX = point.clientX;
        startY = point.clientY;
        const rect = this.container.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchend', onEnd);
        e.preventDefault();
      };

      const onMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const point = e.touches ? e.touches[0] : e;
        const dx = point.clientX - startX;
        const dy = point.clientY - startY;
        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;
        const maxX = window.innerWidth - this.container.offsetWidth - 10;
        const maxY = window.innerHeight - this.container.offsetHeight - 10;
        newLeft = Math.min(Math.max(newLeft, 10), maxX);
        newTop = Math.min(Math.max(newTop, 10), maxY);
        this.container.style.left = newLeft + 'px';
        this.container.style.top = newTop + 'px';
        this.container.style.right = 'auto';
      };

      const onEnd = () => {
        isDragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchend', onEnd);
      };

      hdr.addEventListener('mousedown', onStart);
      hdr.addEventListener('touchstart', onStart, { passive: false });
    }

    dispose() {
      if (this.hls) { 
        try {
          this.hls.destroy(); 
        } catch(e) {}
        this.hls = null; 
      }
      if (this.videoEl) { 
        try {
          this.videoEl.pause(); 
          this.videoEl.src = ''; 
          this.videoEl.load(); 
        } catch(e) {}
        this.videoEl = null;
      }
      this.container.innerHTML = '';
    }

    escapeHtml(text) {
      if (!text) return '';
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', () => { 
    window.chatApp = new ChatApp(); 
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bitchat - الدردشة اللامركزية</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #app {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
    }
    /* Header */
    .header {
      background: linear-gradient(135deg, #0d47a1, #1565c0);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1e88e5;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      background: #0d47a1;
      border: 1px solid #42a5f5;
    }
    .status-badge.online {
      background: #1b5e20;
      border-color: #4caf50;
    }
    /* Tabs */
    .tabs {
      display: flex;
      background: #111;
      border-bottom: 1px solid #333;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      border-bottom-color: #1e88e5;
      background: #1a1a2e;
    }
    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #121212;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      word-wrap: break-word;
      animation: fadeIn 0.3s;
    }
    .message.sent {
      align-self: flex-end;
      background: #0d47a1;
      border-bottom-right-radius: 4px;
    }
    .message.received {
      align-self: flex-start;
      background: #2a2a2a;
      border-bottom-left-radius: 4px;
    }
    .message img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 5px;
    }
    .message .time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Input */
    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px 15px;
      background: #111;
      border-top: 1px solid #333;
      align-items: center;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 10px 15px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      outline: none;
      font-size: 14px;
    }
    .input-area input[type="text"]:focus {
      border-color: #1e88e5;
    }
    .input-area button {
      background: #0d47a1;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .input-area button:hover {
      background: #1565c0;
    }
    .file-label {
      background: #333;
      padding: 10px 12px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 18px;
    }
    /* Map / Geohash */
    .map-container {
      height: 200px;
      background: #0a0a0a;
      display: none;
      flex-direction: column;
      padding: 10px;
    }
    .map-container.active {
      display: flex;
    }
    .map-placeholder {
      flex: 1;
      background: #1a1a2e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
      border: 1px dashed #333;
    }
    .geohash-control {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .geohash-control input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
    }
    .geohash-control button {
      padding: 8px 15px;
      background: #1e88e5;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }
    /* Users list */
    .users-list {
      padding: 10px 15px;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }
    .users-list.active {
      display: flex;
    }
    .user-chip {
      background: #1a1a2e;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid #333;
    }
    .user-chip.online {
      border-color: #4caf50;
    }
    /* Responsive */
    @media (max-width: 480px) {
      #app {
        max-height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <h1>💬 Bitchat</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="status-badge" id="connectionStatus">📡 إنترنت</span>
      <span class="status-badge" id="userStatus">👤 غير متصل</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="chat">💬 دردشة</div>
    <div class="tab" data-tab="users">👥 المستخدمون</div>
    <div class="tab" data-tab="map">🗺️ الخريطة</div>
  </div>

  <!-- Users List -->
  <div class="users-list" id="usersList">
    <div class="user-chip online">🟢 أنت (محلي)</div>
    <div class="user-chip">📱 صديق_قريب</div>
    <div class="user-chip">🌐 مستخدم_بعيد</div>
  </div>

  <!-- Map -->
  <div class="map-container" id="mapContainer">
    <div class="map-placeholder">
      🗺️ خريطة Geohash<br/>
      <span style="font-size:12px;color:#444;">الموقع الحالي: المنطقة 1</span>
    </div>
    <div class="geohash-control">
      <input type="text" id="geohashInput" placeholder="أدخل رمز Geohash (مثل: sxg)" />
      <button id="teleportBtn">🚀 انتقال</button>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-area" id="chatArea">
    <div class="message received">
      👋 مرحباً! أنت في غرفة الدردشة العامة
      <span class="time">الآن</span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <label class="file-label" id="fileLabel">📎</label>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
    <input type="text" id="messageInput" placeholder="اكتب رسالة..." />
    <button id="sendBtn">إرسال</button>
  </div>
</div>

<script>
  // ======================================================
  // 🔥 إعداد Firebase
  // ======================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCHk0PYGp96vyfbeC-GyN7Q9e1MqM7rgRo",
    authDomain: "gemiapp.firebaseapp.com",
    databaseURL: "https://gemiapp-default-rtdb.firebaseio.com",
    projectId: "gemiapp",
    storageBucket: "gemiapp.firebasestorage.app",
    messagingSenderId: "27673374613",
    appId: "1:27673374613:web:86f977ea41e8c0e2b0909c",
    measurementId: "G-G5XN8H9MG9"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const storage = firebase.storage();

  // ======================================================
  // 🧠 المتغيرات العامة
  // ======================================================
  const chatArea = document.getElementById('chatArea');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const geohashInput = document.getElementById('geohashInput');
  const teleportBtn = document.getElementById('teleportBtn');
  const connectionStatus = document.getElementById('connectionStatus');
  const userStatus = document.getElementById('userStatus');

  let currentRoom = 'general'; // الغرفة الحالية
  let currentUser = 'مستخدم_' + Math.floor(Math.random() * 1000);
  let isOnline = true; // محاكاة حالة الاتصال

  // ======================================================
  // 📌 إدارة الغرف (Geohash)
  // ======================================================
  function changeRoom(newRoom) {
    if (newRoom === currentRoom) return;
    currentRoom = newRoom;
    chatArea.innerHTML = '';
    document.querySelector('.map-placeholder').innerHTML = 
      `🗺️ غرفة: ${newRoom}<br/><span style="font-size:12px;color:#444;">${newRoom === 'general' ? 'الغرفة العامة' : 'موقع مخصص'}</span>`;
    loadMessages();
    addSystemMessage(`🔁 دخلت غرفة: ${newRoom}`);
  }

  // ======================================================
  // 📨 تحميل الرسائل من Firebase
  // ======================================================
  function loadMessages() {
    const roomRef = db.ref(`chat/${currentRoom}`);
    roomRef.off(); // إلغاء الاستماع السابق

    roomRef.limitToLast(50).on('child_added', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      // تجنب تكرار الرسائل
      if (document.querySelector(`[data-id="${snapshot.key}"]`)) return;
      displayMessage(data.text, data.sender === currentUser ? 'sent' : 'received', data.timestamp, data.image, snapshot.key);
    });
  }

  // ======================================================
  // 💬 عرض الرسائل
  // ======================================================
  function displayMessage(text, type, timestamp, imageUrl = null, id = null) {
    const div = document.createElement('div');
    div.className = `message ${type}`;
    if (id) div.dataset.id = id;

    let content = '';
    if (imageUrl) {
      content += `<img src="${imageUrl}" alt="صورة" />`;
    }
    if (text) {
      content += `<span>${text}</span>`;
    }
    const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
    content += `<span class="time">${timeStr}</span>`;
    div.innerHTML = content;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'message received';
    div.style.textAlign = 'center';
    div.style.background = 'transparent';
    div.style.color = '#888';
    div.style.fontSize = '12px';
    div.innerHTML = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ======================================================
  // 📤 إرسال رسالة نصية
  // ======================================================
  function sendMessage(text) {
    if (!text.trim()) return;
    const roomRef = db.ref(`chat/${currentRoom}`);
    const newRef = roomRef.push();
    newRef.set({
      sender: currentUser,
      text: text.trim(),
      timestamp: Date.now(),
      image: null
    }).catch(err => {
      console.error('خطأ في الإرسال:', err);
      alert('❌ فشل الإرسال! تأكد من الاتصال بالإنترنت.');
    });
    messageInput.value = '';
  }

  // ======================================================
  // 📤 إرسال صورة
  // ======================================================
  function sendImage(file) {
    if (!file) return;
    const storageRef = storage.ref(`images/${currentRoom}/${Date.now()}_${file.name}`);
    const uploadTask = storageRef.put(file);

    uploadTask.on('state_changed', 
      (snapshot) => {
        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
        addSystemMessage(`⏳ رفع الصورة: ${Math.round(progress)}%`);
      },
      (error) => {
        console.error('فشل الرفع:', error);
        alert('❌ فشل رفع الصورة!');
      },
      () => {
        storageRef.getDownloadURL().then((url) => {
          const roomRef = db.ref(`chat/${currentRoom}`);
          const newRef = roomRef.push();
          newRef.set({
            sender: currentUser,
            text: '📷 صورة',
            timestamp: Date.now(),
            image: url
          });
          addSystemMessage('✅ تم رفع الصورة بنجاح');
        });
      }
    );
  }

  // ======================================================
  // 🎛️ حالة الاتصال (محاكاة)
  // ======================================================
  function toggleConnection() {
    isOnline = !isOnline;
    connectionStatus.textContent = isOnline ? '🌐 إنترنت' : '📡 بلوتوث فقط';
    connectionStatus.className = `status-badge ${isOnline ? 'online' : ''}`;
    userStatus.textContent = isOnline ? '🟢 متصل' : '🟡 غير متصل';
    userStatus.className = `status-badge ${isOnline ? 'online' : ''}`;
    addSystemMessage(isOnline ? '🌐 تم التبديل إلى وضع الإنترنت' : '📡 تم التبديل إلى وضع البلوتوث (محلي)');
  }

  // ======================================================
  // 🗺️ التنقل بين الغرف (Teleport)
  // ======================================================
  function teleportToGeohash() {
    const code = geohashInput.value.trim();
    if (!code) return;
    changeRoom(code);
    geohashInput.value = '';
  }

  // ======================================================
  // 🎯 الأحداث (Event Listeners)
  // ======================================================
  sendBtn.addEventListener('click', () => sendMessage(messageInput.value));
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(messageInput.value);
  });

  fileLabel.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      sendImage(e.target.files[0]);
    }
    fileInput.value = '';
  });

  teleportBtn.addEventListener('click', teleportToGeohash);
  geohashInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') teleportToGeohash();
  });

  // التبديل بين التبويبات
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      
      const tabName = tab.dataset.tab;
      document.getElementById('usersList').classList.toggle('active', tabName === 'users');
      document.getElementById('mapContainer').classList.toggle('active', tabName === 'map');
    });
  });

  // تبديل حالة الاتصال عند الضغط على زر الحالة
  connectionStatus.addEventListener('dblclick', toggleConnection);

  // ======================================================
  // 🚀 بدء التشغيل
  // ======================================================
  changeRoom('general');
  addSystemMessage('👤 أنت: ' + currentUser);
  addSystemMessage('💡 انقر مرتين على "إنترنت" لتبديل وضع الاتصال');
  addSystemMessage('📎 أرسل صوراً عبر زر المرفق');

  // محاكاة مستخدمين آخرين (للتجربة)
  setTimeout(() => {
    const fakeUsers = ['صديق_قريب', 'مستخدم_بعيد', 'زائر_من_سوريا'];
    fakeUsers.forEach((u, i) => {
      setTimeout(() => {
        const chip = document.createElement('div');
        chip.className = `user-chip ${i === 0 ? 'online' : ''}`;
        chip.textContent = i === 0 ? `🟢 ${u}` : `📱 ${u}`;
        document.getElementById('usersList').appendChild(chip);
      }, i * 800);
    });
  }, 1000);

  // رسائل وهمية من الآخرين (محاكاة)
  setTimeout(() => {
    displayMessage('👋 مرحباً! كيف حالك؟', 'received', Date.now() - 120000);
  }, 2000);
  setTimeout(() => {
    displayMessage('أنا في نفس الغرفة الآن 😊', 'received', Date.now() - 60000);
  }, 4000);

  console.log('✅ Bitchat يعمل! الغرفة الحالية:', currentRoom);
</script>

</body>
</html>
